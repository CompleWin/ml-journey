    - ['`embed_in`', центрированные, '0.0008', '1.46', '1.55']
    - ['`embed_in`', '**отбеленные**', '0.0003', '**1.00**', '0.46']
    - ['`embed_out`', исходные, '**0.9178**', '0.66', '53.08']
    - ['`embed_out`', центрированные, '0.0008', '2.69', '1.96']
    - ['`embed_out`', '**отбеленные**', '0.0003', '**0.98**', '2.78']

- say: >-
    Так это выглядит на графиках из ноутбука. Верхний ряд входная матрица, нижний выходная. Слева исходные, в середине центрированные, справа отбеленные.
    [+] В правом столбце обе гистограммы легли на красную кривую.
