- section: Что требует задание 1.2
  say: >-
    Задание 1.2 переносит опыт из 1.1 на настоящую модель.
    [+] Загружаем матрицу входных эмбеддингов Pythia, embed_in, и обрезаем её до размера словаря, пятидесяти тысяч двухсот семидесяти семи строк.
    [+] Нормируем все строки, то есть приводим к единичной длине.
    [+] Берём десять тысяч случайных пар токенов и строим гистограмму их косинусов поверх теоретической кривой N от нуля и единицы, делённой на пятьсот двенадцать. Если бы векторы токенов были случайными направлениями, гистограмма легла бы на кривую.
    [+] Условие предупреждает о парадоксе: колокол должен оказаться сдвинутым вправо, со средним от ноль пятнадцати до ноль тридцати пяти. Нужно объяснить, почему в языковых моделях возникает такой общий «паразитный конус», исправить его и добиться совпадения с теорией.
  show:
    block: text
    reveal: by-para
    md: |
      - `embed_in` → обрезать до $50\,277$ строк
      - нормировать строки на единичную сферу
      - $10\,000$ случайных пар, гистограмма $\langle u, v\rangle$ поверх $\mathcal{N}(0, 1/512)$
      - ожидание условия: колокол сдвинут вправо, $\mu \in [0.15, 0.35]$; объяснить и исправить

- section: Код задания 1.2
  say: >-
    Код короткий.
    [+] Достаём матрицу весов. detach отцепляет её от механизма градиентов PyTorch, numpy превращает в массив NumPy, astype переводит в двойную точность. Следующая строка обрезает лишние двадцать семь строк.
    [+] Генерируем десять тысяч пар случайных номеров токенов и выбрасываем пары «токен сам с собой»: у них косинус ровно единица, это была бы нечестная статистика. Таких пар ожидается около двух десятых штуки, на деле не выпало ни одной, пар осталось ровно десять тысяч. Одни и те же пары потом используются для всех матриц, чтобы сравнение было честным.
    [+] Нормируем строки и берём косинусы пар. Индексация массивом номеров достаёт сразу все нужные строки, дальше построчное скалярное произведение, как в задании 1.1.
  show:
  - {block: scene, src: 06-cone.js, scene: pairs, size: [800, 900]}
  - block: code
    lang: python
    reveal: all
    trace: [[1, 2], [3, 4], [5, 6]]
    src: |
      input_embeddings = language_model.gpt_neox.embed_in.weight.detach().numpy().astype(np.float64)
      input_embeddings = input_embeddings[:vocabulary_size]
      token_pairs = random_generator.integers(0, vocabulary_size, size=(10000, 2))
      token_pairs = token_pairs[token_pairs[:, 0] != token_pairs[:, 1]]
      unit_embeddings = normalize_rows(embeddings)
      np.sum(unit_embeddings[token_pairs[:, 0]] * unit_embeddings[token_pairs[:, 1]], axis=1)

- section: 'Результат для embed_in: конуса нет'
  say: >-
    Вот что получилось для входных эмбеддингов.
    [+] Колокол стоит на нуле: выборочное среднее всего ноль ноль ноль пять. Никакого сдвига к ноль пятнадцати — ноль тридцати пяти нет.
    [+] Но он шире красной теоретической кривой: выборочная дисперсия ноль ноль ноль двести восемьдесят три, это в одну целую сорок пять сотых раза больше, чем единица, делённая на пятьсот двенадцать. Облако векторов слегка вытянуто вдоль части направлений, но в одну сторону не смотрит. Ожидание условия здесь не подтвердилось, и это первое, о чём спросят на защите.
  show:
    block: figure
    src: figures/nb13-1.png
    caption: '`embed_in`: $\hat\mu = 0.005$, $\hat\sigma^2 = 0.00283$ (теория $1/512 = 0.00195$)'
    reveal: by-mark
