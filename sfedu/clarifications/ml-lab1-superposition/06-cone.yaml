- section: Остаточный эксцесс
  say: >-
    Хитрый вопрос: если всё совпало, почему эксцесс после отбеливания не ноль, а ноль сорок шесть и две целых семьдесят восемь сотых? Положительный эксцесс значит толстые хвосты: некоторые случайные пары заметно похожи. Причина в том, что эмбеддинги не случайный шум. Родственные токены, например формы одного слова, числа, куски кода, образуют кластеры, и иногда случайная пара попадает в один кластер. Отбеливание выравнивает среднее и дисперсию, но смысловую структуру не стирает. И это хорошо: в ней и хранятся знания модели.

- section: Не ломает ли это модель
  say: >-
    Ещё один частый вопрос: не испортит ли центрирование модель?
    [+] Для выходной матрицы нет. Центрирование вычитает из всех векторов один и тот же средний вектор, значит, все логиты сдвигаются на одно и то же число.
    [+] А softmax к такому сдвигу безразличен. В ноутбуке это проверено: максимальное изменение вероятности следующего токена после центрирования одна целая девять десятых на десять в минус четырнадцатой степени. Это просто ошибка округления компьютера.
  show:
    block: derivation
    lines:
    - {tex: 'z_t = \langle h,\ w_t - \bar w \rangle &= \langle h, w_t\rangle - \langle h, \bar w \rangle', note: 'сдвиг один для всех токенов'}
    - {tex: '\max |p - p_{\text{центр}}| &= 1.9 \cdot 10^{-14}', note: 'проверка в ноутбуке: только округление'}

- section: Зачем это на практике
  say: >-
    И практический смысл. В поисковых системах и RAG близость текстов меряют косинусом их эмбеддингов. Если эмбеддинги сидят в конусе, косинус любых двух текстов около ноль девяти, и порог «похоже — не похоже» плохо различает документы. После центрирования косинус несвязанных текстов снова около нуля с разбросом единица на корень из d, и порог можно обосновать статистически, как в лекции, через z-оценку.

- section: Вывод к заданию 1.2
  say: >-
    Вывод одним абзацем.
    [+] У входных эмбеддингов конуса нет: среднее ноль ноль ноль пять, дисперсия в одну целую сорок пять сотых раза больше теории.
