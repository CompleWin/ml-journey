- section: 'Почему конус: все толчки вдоль одной оси'
  say: >-
    Теперь главное: почему возникает конус. Причина первая.
    [+] Мы видели, что при обучении каждый выходной вектор толкают вдоль h. А какие бывают h? Финальный LayerNorm вычисляет h как нормированный вектор, умноженный покоординатно на гамму, плюс сдвиг бета. И бета один и тот же вектор для всех токенов.
    [+] Поэтому финальные h разных токенов почти параллельны. В ноутбуке это проверено на трёх предложениях: средний косинус между h разных токенов ноль девятьсот девяносто.
    [+] Значит, толчки всех пятидесяти тысяч векторов направлены почти вдоль одной оси. Особенно у редких токенов: правильным ответом они почти не бывают и получают толчки всё время в одну сторону. За миллионы шагов обучения все векторы накапливают большое смещение вдоль этой оси и сбиваются в конус.
  show: {block: scene, src: 06-cone.js, scene: wind}

- say: >-
    Формулы и проверки.
    [+] Финальный LayerNorm: общий для всех сдвиг бета.
    [+] Градиент по вектору токена всегда пропорционален h, а все h почти параллельны.
    [+] Проверка в ноутбуке подтверждает объяснение: направление среднего h почти совпадает со средним выходным эмбеддингом, косинус ноль девятьсот семьдесят один, а со сдвигом бета ноль девятьсот восемьдесят четыре. Конус выстроен именно вдоль общей оси скрытых состояний.
  show:
    block: derivation
    lines:
    - {tex: 'h &= \gamma \odot \mathrm{norm}(x) + \beta', note: 'β — один вектор для всех токенов'}
    - {tex: '\frac{\partial L}{\partial w_t} &= (p_t - \mathbb{1}[t = y])\, h, \qquad \overline{\cos}(h_i, h_j) = 0.990', note: 'все толчки почти вдоль одной оси'}
    - {tex: '\cos\big(\bar h,\ \bar w\big) &= 0.971, \qquad \cos\big(\beta,\ \bar w\big) = 0.984', note: 'конус вытянут вдоль общей оси'}

- section: 'Почему конус: ничто не тянет обратно'
  say: >-
    Причина вторая: общую часть ничто не возвращает к нулю.
    [+] Прибавим ко всем выходным векторам один и тот же вектор c. Логит каждого токена изменится на одно и то же число, скалярное произведение h и c.
    [+] А softmax, как мы знаем, общий сдвиг логитов не замечает. Значит, функция потерь общую компоненту вообще не видит, и у обучения нет силы, которая бы её убирала. Она свободно накапливается.
    [+] Модели эта общая часть даже полезна. Скалярное произведение беты и вектора токена работает как бонус токена, не зависящий от контекста: насколько токен частый вообще. Отдельного смещения у выходного слоя Pythia нет, и частоту модель хранит так. В дополнительной проверке вне ноутбука ранговая корреляция этого бонуса с частотой токена в корпусе получилась ноль пятьдесят шесть.
  show:
    block: derivation
    lines:
    - {tex: '\langle h,\ w_t + c \rangle &= z_t + \langle h, c \rangle', note: 'добавка одна и та же для всех токенов t'}
    - {tex: '\mathrm{softmax}(z + \text{const}) &= \mathrm{softmax}(z)', note: 'потери её не видят — нет силы, возвращающей к нулю'}
    - {tex: '\langle \beta, w_t \rangle &\approx \text{«частотный бонус» токена}', note: 'общая часть работает как априорная частота'}

- section: Физический смысл
  say: >-
    Физически это выглядит так. На каждом шаге обучения все токены сносит одним и тем же ветром, а стены, которая их остановит, нет.
    [+] Пример из жизни. Вот три цены: сто, двести пятьдесят и четыреста рублей.
    [+] Прибавим ко всем тысячу. Вопрос «что дороже» решается точно так же, порядок не изменился. Это как softmax.
    [+] Но все ценники стали похожи друг на друга: тысяча с хвостиком. Относительная разница между ними сжалась. Это и есть конус: векторы почти одинаковые, а вся полезная информация о токене спряталась в маленьких отличиях.
  show: {block: scene, src: 06-cone.js, scene: prices}

- section: Почему у embed_in конуса нет
  say: >-
    А почему у входной матрицы конуса нет? Она не участвует в softmax, и общего ветра вдоль h у неё нет. Её градиенты приходят из первого слоя через LayerNorm, а LayerNorm вычитает из каждого вектора его среднее по координатам. С выходной матрицей в Pythia она не связана, поэтому болезнь не наследует. Небольшая вытянутость, дисперсия в одну целую сорок пять сотых раза больше теории, означает лишь, что одни направления модель использует сильнее других.

- section: 'Исправление 1: центрирование'
  say: >-
    Как исправить? Первый шаг подсказывает лекция: центрирование.
    [+] Находим средний вектор всех токенов, это и есть общая часть, ось конуса.
    [+] Вычитаем его из каждого вектора. Это всё равно что перенести начало координат в центр облака.
    [+] Теперь направления векторов расходятся во все стороны. В коде это одна строка: вычесть среднее по оси ноль, то есть по всем токенам сразу.
  show:
  - {block: scene, src: 06-cone.js, scene: center, size: [800, 900]}
  - block: code
    lang: python
    reveal: all
    trace: [2]
    src: |
      def center(embeddings):
          return embeddings - embeddings.mean(axis=0)

- section: 'Исправление 2: отбеливание'
  say: >-
    После центрирования среднее косинуса упало почти до нуля, но дисперсия всё ещё больше теории: в одну целую сорок шесть сотых раза у входной матрицы и в две целых шестьдесят девять сотых у выходной. Облако осталось вытянутым, как дыня: несколько направлений несут слишком много разброса.
    [+] Отбеливание, по-английски whitening, делает из дыни шар. Сначала находим главные оси облака, направления наибольшего разброса.
    [+] Поворачиваем облако так, чтобы главные оси совпали с осями координат.
    [+] И делим каждую ось на её стандартное отклонение. Длинные оси сжимаются, короткие растягиваются. Облако становится круглым, или, как говорят, изотропным. А для изотропного облака косинусы случайных пар ведут себя как у случайных векторов на сфере.
  show: {block: scene, src: 06-cone.js, scene: whiten}

- say: >-
    Код отбеливания.
    [+] Сначала центрируем.
    [+] Считаем ковариационную матрицу пятьсот двенадцать на пятьсот двенадцать. Её элемент показывает, как две координаты меняются вместе, а на диагонали стоят дисперсии координат.
    [+] Функция eigh раскладывает ковариацию на собственные векторы, это главные оси дыни, и собственные числа, это дисперсии вдоль этих осей.
    [+] Умножение на собственные векторы поворачивает облако, а деление на корень из собственных чисел делает разброс по каждой оси равным единице. Ковариация становится единичной матрицей.
  show:
    block: code
    lang: python
    reveal: all
    trace: [2, 3, 4, 5]
    src: |
      def whiten(embeddings):
          centered = center(embeddings)
          covariance = centered.T @ centered / len(centered)
          eigenvalues, eigenvectors = np.linalg.eigh(covariance)
          return centered @ eigenvectors / np.sqrt(eigenvalues)

- section: Результат исправления
  say: >-
    Результат по шагам. Входная матрица до исправления: среднее ноль ноль ноль пять, дисперсия в одну целую сорок пять сотых раза больше теории.
    [+] Центрирование почти ничего не меняет, среднего сдвига там и не было.
    [+] А отбеливание делает отношение дисперсии к теории ровно одна целая ноль ноль.
    [+] Выходная матрица до исправления: средний косинус ноль девятьсот восемнадцать.
    [+] Центрирование роняет его до восьми десятитысячных. Но дисперсия в две целых шестьдесят девять сотых раза больше теории.
    [+] После отбеливания ноль девятьсот восемьдесят четыре от теории. Обе гистограммы ложатся на кривую N от нуля и единицы, делённой на пятьсот двенадцать. Задание выполнено.
  show:
    block: table
    reveal: by-row
    cols: [матрица, обработка, '$\hat\mu$', '$\hat\sigma^2 \cdot 512$', эксцесс]
    rows:
