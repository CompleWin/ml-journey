    - {at: [0.78, 0.4], text: 'шире теории ×1.45'}

- section: 'Конус нашёлся в embed_out'
  say: >-
    Почему так? Вспомним: у Pythia две таблицы эмбеддингов, и они не связаны, tie_word_embeddings равно False. А проблема дегенерации представлений, из-за которой появляется конус, по исследованию Гао и соавторов две тысячи девятнадцатого года, это болезнь выходной матрицы, той, что участвует в softmax.
    [+] Входные векторы смотрят во все стороны, их средний косинус почти ноль.
    [+] А выходные, embed_out, сбились в узкий конус. Мы проверили их тем же кодом на тех же парах, и средний косинус оказался ноль девятьсот восемнадцать. Конус даже сильнее, чем обещало условие.
  show: {block: scene, src: 06-cone.js, scene: cones}

- say: >-
