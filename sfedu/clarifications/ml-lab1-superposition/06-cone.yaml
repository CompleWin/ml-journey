- section: Как измерить конус
  say: >-
    Функция cone_description описывает конус тремя числами. Посмотрим на картинке.
    [+] Сначала средний вектор всех токенов, жирная стрелка. Его длина, делённая на среднюю длину вектора токена, показывает, какую долю вектора составляет общая для всех часть. У выходной матрицы это ноль девятьсот пятьдесят девять: девяносто шесть процентов длины каждого вектора общие.
    [+] Затем средний косинус каждого вектора со средним направлением, ноль девятьсот пятьдесят восемь.
    [+] А арккосинус от него это полуугол конуса, в котором живут векторы: около семнадцати градусов. У входной матрицы тот же угол восемьдесят шесть градусов, то есть никакого конуса.
  show: {block: scene, src: 06-cone.js, scene: meanvec}

- say: >-
    Сводная таблица из ноутбука. Пятьдесят тысяч двести семьдесят семь выходных векторов лежат в конусе с полууглом около семнадцати градусов.
  show:
    block: table
    reveal: all
    cols: [матрица, 'средний cos пар $\hat\mu$', '$\|\mathbb{E}[w]\| / \mathbb{E}\|w\|$', 'средний $\cos(w, \mathbb{E}[w])$', 'полуугол конуса']
    rows:
