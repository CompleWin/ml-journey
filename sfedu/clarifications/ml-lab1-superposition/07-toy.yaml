- section: Гипотеза суперпозиции
  say: >-
    Второе задание отвечает на главный вопрос работы: как в немногих числах помещается много понятий. Строго перпендикулярных направлений в пространстве размерности d ровно d. А из первого задания мы знаем, что почти перпендикулярных намного больше. Гипотеза суперпозиции из статьи Anthropic «Игрушечные модели суперпозиции» две тысячи двадцать второго года стоит на трёх опорах.
    [+] Первая: каждое понятие, его называют признаком, записано в сети направлением, единичным вектором w. А сила признака в данном тексте это неотрицательное число f.
    [+] Вторая: направления признаков не обязаны быть перпендикулярными, достаточно почти перпендикулярных. Тогда признаков M может быть больше, чем измерений d.
    [+] Третья, решающая: разреженность. В каждом конкретном тексте включено лишь крошечное число признаков. В тексте про дифференциальные уравнения признаки «рецепт пасты» и «правила хоккея» равны нулю. Раз одновременно активных мало, они почти не мешают друг другу.
  show:
    block: text
    reveal: by-para
    md: |
      **Гипотеза суперпозиции:** сеть хранит $M > d$ признаков как почти ортогональные направления.

      1. **Линейность:** признак $i$ — направление $w_i$, его сила $f_i \ge 0$
      2. **Почти ортогональность:** $\langle w_i, w_j\rangle \approx 0$, но не обязательно 0
      3. **Разреженность:** одновременно активно мало признаков

- section: Разреженные признаки
  say: >-
    Задание строит игрушечную модель. Сорок признаков, вот они, как сорок лампочек.
    [+] В каждом примере каждая лампочка загорается с вероятностью p. Когда p маленькое, например пять сотых, в примере горят одна-две лампочки. Признаки разрежены.
    [+] Когда p большое, например одна вторая, горит примерно половина. Разреженность пропала. Разреженностью называют величину S, равную единице минус p. Мы будем менять p от одной сотой до одной второй и смотреть, когда суперпозиция работает.
  show: {block: scene, src: 07-toy.js, scene: bulbs}

- say: >-
    Формально каждый признак это произведение двух случайных чисел.
    [+] b это монетка: единица с вероятностью p и ноль иначе. Такое распределение называют распределением Бернулли.
    [+] r это сила признака, случайное число от нуля до единицы, равномерно.
    [+] Отсюда полезный факт: средний квадрат признака равен p, умноженному на средний квадрат равномерного числа, то есть на одну треть. А сумма по всем сорока признакам, энергия вектора, в среднем равна M умножить на p и поделить на три. Это понадобится в задаче 2.3.
  show:
    block: derivation
    lines:
    - {tex: 'f_i &= r_i \cdot b_i, \qquad b_i \sim \mathrm{Bernoulli}(p)', note: 'монетка: признак включён с вероятностью p'}
    - {tex: 'r_i &\sim \mathrm{Uniform}(0, 1)', note: 'сила включённого признака'}
    - {tex: '\mathbb{E}\|f\|^2 &= M \cdot p \cdot \mathbb{E}[r^2] = \frac{M p}{3}', note: 'средний квадрат равномерного числа — 1/3'}

- section: Сжатие в 10 чисел
  say: >-
    Теперь сжатие. Размерности в задании: признаков M сорок, а измерений d всего десять. Сжатие в четыре раза.
    [+] Каждому признаку дано направление, столбец w матрицы W размера десять на сорок.
    [+] Скрытый вектор x получается как сумма направлений активных признаков, каждое умножено на силу признака. Это и есть умножение матрицы W на вектор f: взвешенная сумма столбцов.
    [+] Для наглядности на плоскости: горят признаки три и семь. Их стрелки, умноженные на силы, складываются в один вектор x. Сорок чисел свернулись в десять.
  show: {block: scene, src: 07-toy.js, scene: compress}

- section: Восстановление
  say: >-
    Восстановить признаки из x модель пытается так.
    [+] Для каждого признака i берём скалярное произведение его направления с x. Это умножение транспонированной матрицы W на x: сорок скалярных произведений сразу.
    [+] Если горит только признак i, мы получаем ровно его силу, потому что скалярное произведение единичного вектора с самим собой единица.
    [+] А если горит другой признак j, на выходе i появляется паразитный отклик: сила j, умноженная на косинус между направлениями i и j. Его называют интерференцией.
  show: {block: scene, src: 07-toy.js, scene: readout}

- section: ReLU и порог
  say: >-
    Чтобы подавить паразитные отклики, у модели есть нелинейность ReLU.
    [+] ReLU пропускает положительные числа без изменений, а отрицательные заменяет нулём. Это самая популярная функция активации нейросетей.
    [+] А порог b сдвигает излом вправо: всё, что меньше b, тоже становится нулём, а то, что больше, уменьшается на b. Итоговая формула восстановления: ReLU от W транспонированное на W на f минус b. Порог b это вектор из сорока чисел или одно общее число для всех признаков.
  show: {block: scene, src: 07-toy.js, scene: relu}

- section: Сигнал и интерференция
  say: >-
    Разложим i-й выход на части. Это центральная формула задания.
    [+] Восстановление это ReLU от W транспонированное, умноженное на W, умноженное на f, минус b.
    [+] i-я компонента произведения это сумма по всем признакам j: косинус между w i и w j, умноженный на f j.
    [+] Выделим слагаемое с j, равным i. Скалярное произведение w i с самим собой единица, остаётся просто f i, полезный сигнал.
    [+] Всё остальное это интерференционный шум от других активных признаков. Он мал, если направления почти перпендикулярны и активных признаков мало. Вот и вся суть суперпозиции.
  show:
    block: derivation
    lines:
    - {tex: '\hat f &= \mathrm{ReLU}(W^\top x - b) = \mathrm{ReLU}(W^\top W f - b)', note: 'читаем проекциями, режем порогом'}
    - {tex: '(W^\top W f)_i &= \sum_{j=1}^{M} (w_i^\top w_j)\, f_j', note: 'i-я строка: сумма по всем признакам'}
    - {tex: '\hat f_i &= \mathrm{ReLU}\Big(\underbrace{f_i}_{\text{сигнал}} + \sum_{j \ne i} (w_i^\top w_j) f_j - b_i\Big)', note: 'w_iᵀw_i = 1: остаётся сам признак'}
    - {tex: '&\phantom{=}\ \sum_{j \ne i} (w_i^\top w_j) f_j \;=\; \text{интерференционный шум}', note: 'вклад других активных признаков'}

- section: Матрица Грама
  say: >-
    Все коэффициенты интерференции собраны в одну таблицу, матрицу Грама G, равную W транспонированное на W. Она сорок на сорок.
    [+] Её элемент i, j это скалярное произведение направлений i и j, то есть косинус угла между ними.
    [+] На диагонали квадраты длин направлений, единицы.
    [+] Вне диагонали коэффициенты интерференции. Тёплым цветом положительные, синим отрицательные. Чем бледнее клетка, тем меньше признаки мешают друг другу. Матрицу Грама мы будем рисовать в задаче 2.4, когда сравним случайную и обученную упаковки.
  show: {block: scene, src: 07-toy.js, scene: gram}

- section: 'Задача 2.1: случайная схема'
  say: >-
    Задача 2.1. Сначала направления выбираем случайно.
    [+] Заполняем матрицу десять на сорок нормальными числами и нормируем каждый столбец. Обрати внимание: здесь направления это столбцы, поэтому норма считается по оси ноль, а не один, как в первом задании.
    [+] Из первого задания мы знаем, чего ждать: косинус между случайными направлениями в размерности десять имеет разброс единица на корень из десяти, ноль триста шестнадцать. В ноутбуке получилось ноль триста двенадцать. Но максимум ноль восемьсот десять: в каждой случайной схеме найдутся пары почти одинаковых признаков.
    [+] Тестовые признаки генерирует функция generate_features. Силы равномерные от нуля до единицы, а маска включённости это сравнение равномерного числа с p. Батч сорок на двадцать тысяч: каждый столбец это один пример. Двадцать тысяч примеров нужны для статистической устойчивости.
  show:
    block: code
    lang: python
    reveal: all
    trace: [[1, 2], 3, [5, 6, 7, 8]]
    src: |
      random_directions = random_generator.standard_normal((hidden_dimension, number_of_features))
      random_directions = random_directions / np.linalg.norm(random_directions, axis=0, keepdims=True)
      # интерференция: среднее −0.012, std 0.312 (теория 1/√10 = 0.316), максимум 0.810

      def generate_features(probability, number_of_samples):
          magnitudes = random_generator.uniform(0, 1, size=(number_of_features, number_of_samples))
          is_active = random_generator.uniform(0, 1, size=(number_of_features, number_of_samples)) < probability
          return magnitudes * is_active

- say: >-
    Значения p задание просит взять от одной сотой до одной второй, пятнадцать–двадцать точек. В ноутбуке их пятнадцать, гуще в области малых p, где всё самое интересное. Для каждого p свой тестовый батч из двадцати тысяч примеров.
  show:
    block: code
    lang: python
    reveal: all
    src: |
      hidden_dimension, number_of_features, number_of_test_samples = 10, 40, 20000
      activation_probabilities = [0.01, 0.02, 0.03, 0.05, 0.07, 0.10, 0.13, 0.16,
                                  0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50]

- say: Проверка.
  quiz: {q: 'Признаков $M = 40$, вероятность включения $p = 0.1$. Сколько признаков горит в среднем в одном примере?', answer: 4, tol: 0.01, hint: 'Среднее число успехов — $M \cdot p$.', explain: '$40 \cdot 0.1 = 4$.'}

- say: Ещё одна.
  quiz:
    q: 'Что стоит на диагонали матрицы Грама $G = W^\top W$ при единичных столбцах?'
    options:
    - {text: 'Нули', why: 'Нули были бы, если бы направления были нулевыми векторами.'}
    - 'Единицы: скалярное произведение единичного вектора с самим собой'
    - {text: 'Коэффициенты интерференции', why: 'Интерференция стоит вне диагонали.'}
    answer: 2
    explain: '$G_{ii} = \|w_i\|^2 = 1$.'
