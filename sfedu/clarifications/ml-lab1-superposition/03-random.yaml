- section: Случайная величина и выборка
  say: >-
    Первое задание про случайные векторы, поэтому нужна вторая часть азбуки: немного теории вероятностей. Случайная величина это число, которое заранее неизвестно. Например, результат броска кубика или случайно сгенерированное компьютером число. Если повторить опыт много раз, получим выборку, то есть много значений.
    [+] Чтобы увидеть выборку целиком, ось делят на одинаковые отрезки, их называют корзинами, и считают, сколько значений попало в каждую. Столбики растут. Это гистограмма.
    [+] Если подогнать высоты так, чтобы общая площадь всех столбиков стала равна единице, гистограмму можно сравнить с гладкой кривой, плотностью распределения. Кривая показывает, какие значения встречаются часто, а какие редко. В коде лабы за это отвечает параметр density, равный True.
  show: {block: scene, src: 03-random.js, scene: hist}

- section: Нормальное распределение
  say: >-
    Самая важная кривая в статистике это нормальное распределение, или колокол Гаусса. Оно возникает, когда складывается много маленьких независимых случайностей. У колокола два параметра.
    [+] Мю, среднее значение. Это центр колокола.
    [+] Сигма, стандартное отклонение. Это ширина колокола, типичное расстояние значений от центра.
    [+] Записывают так: N от мю и сигмы в квадрате. Внимание, ловушка: вторым параметром пишут дисперсию, сигму в квадрате, а не саму сигму. А функция stats.norm.pdf из SciPy в параметре scale ждёт именно сигму. Поэтому для N от нуля и единицы, делённой на d, в коде пишут scale, равный единице, делённой на корень из d.
  show: {block: scene, src: 03-random.js, scene: bell, id: bell}

- section: Среднее и дисперсия
  say: >-
    Посчитаем на маленьком примере. Восемь чисел: два, четыре, четыре, четыре, пять, пять, семь и девять.
    [+] Среднее это сумма, делённая на количество. Сумма сорок, делим на восемь, получается пять.
    [+] Теперь насколько числа разбросаны вокруг среднего. Для каждого берём отклонение от пяти: минус три, минус один и так далее.
    [+] Отклонения возводим в квадрат и усредняем. Получается четыре. Это дисперсия, средний квадрат отклонения. Корень из неё, два, это стандартное отклонение, сигма. Оно измеряется в тех же единицах, что и сами числа.
  show: {block: scene, src: 03-random.js, scene: spread}

- say: >-
    То же самое формулами.
    [+] Среднее по выборке обозначают мю с крышечкой. Крышечка значит «оценка по выборке», в отличие от теоретического значения без крышки.
    [+] Выборочная дисперсия, сигма в квадрате с крышкой, это средний квадрат отклонения от выборочного среднего. В NumPy это методы mean и var.
    [+] Стандартное отклонение это корень из дисперсии. В задании 1.1 мы как раз сравниваем выборочную дисперсию с теоретической.
  show:
    block: derivation
    lines:
    - {tex: '\hat\mu &= \frac{1}{n}\sum_{i=1}^{n} x_i', note: 'среднее: сумма, делённая на количество; np.mean'}
    - {tex: '\hat\sigma^2 &= \frac{1}{n}\sum_{i=1}^{n} (x_i - \hat\mu)^2', note: 'дисперсия: средний квадрат отклонения; np.var'}
    - {tex: '\hat\sigma &= \sqrt{\hat\sigma^2}', note: 'стандартное отклонение — в тех же единицах, что x'}

- section: Правило трёх сигм
  say: >-
    У нормального распределения есть удобное правило.
    [+] В пределах одной сигмы от среднего лежит примерно шестьдесят восемь процентов значений.
    [+] В пределах двух сигм примерно девяносто пять процентов.
    [+] А в пределах трёх сигм девяносто девять и семь десятых процента. Почти всё. Этим правилом мы скоро оценим, какие углы между случайными векторами вообще встречаются.
  show: {use: bell, scene: sigmas}

- section: Эксцесс
  say: >-
    В таблице задания есть ещё одна величина, эксцесс, по-английски kurtosis. Он показывает, насколько у распределения толстые хвосты, то есть как часто встречаются далёкие от центра значения. Его отсчитывают от нормального распределения.
    [+] У нормального колокола эксцесс равен нулю. Функция stats.kurtosis из SciPy так и считает: ноль у нормального.
    [+] Если хвосты тоньше, чем у колокола, например значения ограничены отрезком и дальше него не бывает, эксцесс отрицательный.
    [+] Если хвосты толще, то есть изредка попадаются сильные выбросы, эксцесс положительный. В задании мы используем эксцесс как проверку: стало ли распределение действительно нормальным.
  show: {block: scene, src: 03-random.js, scene: kurt}

- section: Многомерное нормальное распределение
  say: >-
    Последний кирпичик. Случайный вектор, у которого каждая из d координат независимо взята из N от нуля и единицы.
    [+] Это записывают N от нуля и I с индексом d. Ноль это вектор средних, а I единичная матрица: каждая координата имеет дисперсию один, и координаты не связаны друг с другом.
    [+] Посмотрим на облако таких точек на плоскости. Оно круглое: ни одно направление не выделено, во все стороны точки разбросаны одинаково. Это свойство называется сферической симметрией. На нём держится всё задание 1.1.
  show: {block: scene, src: 03-random.js, scene: cloud}

- say: Проверим.
  quiz: {q: 'Дисперсия равна $0.0625$. Чему равно стандартное отклонение $\sigma$?', answer: 0.25, tol: 0.001, hint: 'Сигма — корень из дисперсии.', explain: '$\sqrt{0.0625} = 0.25$. Это как раз случай $d = 16$: $\sigma^2 = 1/16$.'}

- say: Ещё вопрос.
  quiz:
    q: У распределения отрицательный эксцесс. Что это значит?
    options:
    - {text: 'Среднее значение отрицательное', why: 'Эксцесс говорит о хвостах, а не о том, где центр.'}
    - 'Хвосты тоньше, чем у нормального: далёкие значения встречаются реже'
    - {text: 'Распределение точно нормальное', why: 'У нормального эксцесс ровно ноль.'}
    answer: 2
    explain: Отрицательный эксцесс — хвосты тоньше гауссовых. Так бывает, когда значения ограничены отрезком.
