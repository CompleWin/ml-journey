title: Геометрия суперпозиции и Sparse Autoencoders
subtitle: Разбор лабораторной № 1 по машинному обучению — с нуля и к защите
lang: ru
kind: lab
data:
  conc: {csv: conc.csv, labels: {d: '$d$', vth: '$\sigma^2_{теор}=1/d$', v: '$\hat\sigma^2$', ratio: '$\hat\sigma^2 \cdot d$', mu: '$\hat\mu$', kurt: 'эксцесс', kexact: '$-6/(d+2)$'}}
  toy: {csv: toy.csv, labels: {p: '$p$', mse0: 'MSE, $b=0$', mseb: 'MSE, $b^*$', energy: '$\mathbb{E}\|f\|^2$', b: '$b^*$', nmse0: 'NMSE, $b=0$', nmseb: 'NMSE случайной, $b^*$', nmset: 'NMSE обученной'}}
  ce: {csv: ce.csv, labels: {a: '$\alpha / \|x\|$', neuron: 'нейрон 42', sae: 'признак SAE 1892', rnd: 'случайное направление'}}
chapters:
- title: О чём работа и азбука векторов
  parts:
  - 01-intro.yaml         # цель работы; четыре задания одной картой; главные результаты за минуту; где результаты разошлись с условием; как смотреть разбор
  - 02-vectors.yaml       # вектор, координаты, размерность d; длина (L2-норма); нормализация, единичная сфера S^{d-1}; скалярное произведение; косинус и угол; ортогональность; матрица как стопка векторов-строк, построчные операции (axis, keepdims)
- title: Случайные векторы почти перпендикулярны (задание 1.1)
  parts:
  - 03-random.yaml        # случайная величина; выборка; нормальное распределение N(μ,σ²); среднее, дисперсия, стандартное отклонение; гистограмма и плотность (density=True); правило трёх сигм; эксцесс (kurtosis); N(0, I_d)
  - 04-concentration.yaml # постановка 1.1; почему нормальный вектор после нормировки равномерен на сфере (а куб нет); вывод E=0 и Var=1/d из симметрии; почему колокол (ЗБЧ, Слуцкий); код sample_cosine_similarities построчно; гистограммы d=16..4096; таблица; σ=0.25 и 0.0156, угол 87.3–92.7°; эксцесс −6/(d+2) и стандартная ошибка √(24/M); вывод
- title: Паразитный конус в Pythia (задание 1.2)
  parts:
  - 05-lm.yaml            # языковая модель; токен, токенизатор, словарь 50 277; эмбеддинг как строка таблицы; матрица 50 304 × 512 и дополнение до кратности 64; embed_in и embed_out; скрытое состояние h; логиты, softmax; кросс-энтропия; обучение
  - 06-cone.yaml          # условие 1.2 и ожидание μ∈[0.15,0.35]; результат embed_in μ=0.005, ×1.45; tie_word_embeddings=False; embed_out μ=0.92, полуугол 17°, 96%; почему конус: градиент (p_t−1)h, LayerNorm β, h почти параллельны (0.99), редкие токены; инвариантность softmax к сдвигу; аналогия с ценами; центрирование; отбеливание; таблица исправлений; остаточный эксцесс; проверка 1.9e-14; RAG
- title: 'Суперпозиция: случайная упаковка (задания 2.1–2.3)'
  parts:
  - 07-toy.yaml           # гипотеза суперпозиции; разреженность; f_i=r_i·b_i, Бернулли, Uniform, S=1−p; сжатие x=Wf, d=10, M=40; чтение Wᵀx; ReLU и порог b; разложение на сигнал и интерференцию; матрица Грама; задача 2.1: W_rand, нормировка столбцов, std 0.312, максимум 0.81; батч N=20 000
  - 08-threshold.yaml     # 2.2: почему при b=0 NMSE≈1.76 (ложные эхо, энергия 1.95·E[r²]); разреженность не спасает; оптимальный порог — компромисс; minimize_scalar; b* растёт 0.31→0.78 (шум √(k/d)); 2.3: ловушка метрики MSE∝Mp/3; NMSE и baseline 1; коллапс не достигнут (0.839, плато 0.85); 20 матриц: 11 из 20, p*≈0.5–0.6, b* упирается в 1
- title: Обученная суперпозиция (задание 2.4)
  parts:
  - 09-training.yaml      # как учится нейросеть: параметры, функция потерь, градиент, градиентный спуск, скорость обучения; батч; Adam; свежие данные на каждом шаге; проекция на шар clamp(min=1); код train_toy_model
  - 10-geometry.yaml      # сравнение NMSE 0.11/0.37 … 0.48/0.75; почему при p>0.2 NMSE падает; чтение матрицы Грама; p≤0.1: 40 живых, положительная интерференция ≤0.23, отрицательная до −0.57 бесплатна; собственные числа WWᵀ≈4=M/d (жёсткий фрейм) против 1.4–7.3 у случайной (Марченко–Пастур); p=0.2: 31 живой; p≥0.3: 20 живых, 10 антиподальных пар, WWᵀ≈2I, ReLU(f_i−f_j); Elhage 2022
- title: 'Sparse Autoencoder: устройство и данные (задание 3)'
  parts:
  - 11-transformer.yaml   # трансформер, слои, residual stream x_l=x_{l−1}+Attn+MLP; Pythia-70m, d=512; нейрон = координата; полисемантичность x_k=Σf_j⟨e_k,w_j⟩; зачем SAE; автоэнкодер; словарь D=2048, K=32; энкодер и декодер; b_dec, b_enc; Top-K против L1 (усадка, λ)
  - 12-sae-data.yaml      # «оптимально»: один проход, без LM-головы, no_grad; forward hook; Pile-10k, окна 128 токенов, 1000 окон; позиция 0: норма 121 против 14 (attention sink); средний косинус 0.35, 20% энергии; перемешивание, 64 000 / 63 000; метрики EV и Dead Latents Ratio
- title: Ремонт SAE (задание 3)
  parts:
  - 13-sae-fix.yaml       # сломанный код построчно: формы тензоров, topk, scatter_; цикл обучения; результат: EV 0.818, 542 мёртвых; ошибка 1 центрирование b_dec; ошибка 2 нет ReLU; ошибка 3 инициализация и нормировка словаря; исправленный класс; результат 0.826 и 0 мёртвых; гистограмма частот (18 перегруженных, 42%); почему EV не упала до 50–60%; вклад каждого исправления; почему мёртвые не оживают
- title: 'Стиринг: нейрон против признака (задание 4)'
  parts:
  - 14-steering.yaml      # идея стиринга; x+αv, единичный v; калибровка E‖x‖=14.04 и сетка α; хук на каждом шаге; KV-кэш и формы [1,12,512] и [1,1,512]; бродкастинг; жадная генерация; эксперимент А: нейрон 42, тексты, дегенерация
  - 15-feature.yaml       # эксперимент Б: проверочный набор 26 предложений, 326 токенов, 36 скобок; условие специфичности; кандидаты; латент 1892; топ-5 на 63 000 токенах; точность и полнота по порогам; эксперимент В: v_SAE, cos с e_42 = −0.027, максимум координаты 0.22; тексты
- title: Контрольные задания (задание 4)
  parts:
  - 16-analysis.yaml      # сравнительная таблица; продвигаемые токены: признак, нейрон, случайное; график CE; ожидание не подтвердилось и почему; фазовый переход 0.3–0.5‖x‖, естественный максимум 3.78 = 0.27‖x‖; геометрия √(1+a²), 45°, LayerNorm; итог
- title: Подготовка к защите
  parts:
  - 17-defense.yaml       # четыре расхождения с условием; вопросы по коду (seed, detach, no_grad, try/finally, clamp, keepdims, scatter_, хук); вопросы по теории работы
  - 18-lecture.yaml       # тренировочные вопросы лекции 010 с ответами: расстояние в шаре √2, проекция k/d, неравенство Леви и ×2, делитель 4, порог RAG 0.05, k-NN и многообразия, глубина не спасает, k=1200 при d=1024, порог 2σ и 0.75, зануление нейронов, норма словаря; карточки
