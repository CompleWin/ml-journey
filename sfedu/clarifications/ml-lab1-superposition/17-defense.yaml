- section: Работа за одну минуту
  say: >-
    Последняя глава, подготовка к защите. Начнём с ответа на вопрос «о чём ваша работа», на одну минуту.
    [+] Задание один. В большой размерности два случайных направления почти перпендикулярны: косинус около нуля с разбросом единица на корень из d. Проверили численно. У Pythia входные эмбеддинги почти честные, а выходные сбились в конус со средним косинусом ноль девяносто два. Это анизотропия, лечится центрированием и отбеливанием.
    [+] Задание два. Сеть может хранить сорок признаков в десяти числах, если признаки редко включаются вместе. Случайная упаковка работает плохо из-за интерференции. Обученная в разы лучше: сеть раскладывает признаки так, чтобы положительные помехи были малы и срезались порогом ReLU.
    [+] Задание три. Разреженный автоэнкодер раскладывает вектор модели на понятные признаки. В выданном коде три ошибки: нет центрирования, нет ReLU, плохая инициализация без нормировки словаря. Из-за них четверть словаря мертва. После починки мёртвых ноль, объяснённая дисперсия выше восьмидесяти процентов.
    [+] Задание четыре. Толчок вдоль нейрона двигает смесь несвязанных тем, а толчок вдоль признака автоэнкодера вносит понятный смысл, то, что пишут после скобки. А за пределом естественного диапазона признака текст скатывается в бред.
  show:
    block: text
    reveal: by-para
    md: |
      1. $\langle u, v\rangle \sim \mathcal{N}(0, 1/d)$ проверено; `embed_out` — конус ($\hat\mu = 0.92$), лечится центрированием + отбеливанием
      2. 40 признаков в 10 числах: обученная упаковка в разы лучше случайной
      3. Top-K SAE: 3 ошибки → мёртвых 542 → 0, EV = 0.826
      4. нейрон — смесь тем; признак SAE — одно понятие; бред за пределом естественного диапазона

- section: Четыре расхождения с условием
  say: >-
    Четыре расхождения с условием. Скажи о них сам, не дожидаясь вопроса: это показывает, что ты понимаешь свои результаты.
    [+] Конус в embed_in не найден, средний косинус ноль ноль ноль пять. Потому что у Pythia входная и выходная таблицы не связаны, а конус болезнь матрицы, через которую идёт softmax. У embed_out он есть, ноль девяносто два.
    [+] Точку коллапса у нашей случайной матрицы найти нельзя, ошибка не выше ноль восьмидесяти четырёх. Точка коллапса зависит от удачи: из двадцати случайных матриц коллапс у одиннадцати, обычно при p около ноль пяти — ноль шести.
    [+] У сломанного автоэнкодера объяснённая дисперсия ноль восемьсот восемнадцать вместо пятидесяти — шестидесяти процентов. b dec обучаемый и сам выучивает среднее, а метрика засчитывает общую компоненту. Поломка видна в словаре: двадцать шесть с половиной процентов мёртвых.
    [+] Вектор признака поднимает перплексию быстрее нейрона, а не медленнее. Потому что кросс-энтропия меряет силу отклонения: признак модель читает, а нейрон размазан по многим признакам и ведёт себя как случайное направление.
  show:
    block: table
    reveal: by-row
    cols: [ожидание условия, что получилось, почему]
    rows:
    - ['конус в `embed_in`', '$\hat\mu = 0.005$; конус в `embed_out`: 0.918', '`tie_word_embeddings = False`; конус — болезнь softmax-матрицы']
    - ['найти $p^*$ коллапса', 'нет: NMSE ≤ 0.84', 'зависит от матрицы: 11 из 20 коллапсируют']
    - ['Broken SAE: EV 50–60%', 'EV = 0.818, мёртвых 26.5%', '$b_{dec}$ учит среднее; поломка — в словаре']
    - ['SAE дольше держит перплексию', 'CE растёт быстрее, чем у нейрона', 'признак модель «читает»; нейрон ≈ случайное направление']

- section: Вопросы по коду — 1
  say: >-
    Вопросы по коду. Их могут задать про любую ячейку.
    [+] Зачем фиксировать зерно? Чтобы результаты воспроизводились. Перед созданием каждого автоэнкодера зерно ставится заново, чтобы сломанная и исправленная версии стартовали в одинаковых условиях.
    [+] Чем NumPy отличается от PyTorch? Оба работают с массивами. В PyTorch есть автоматическое вычисление градиентов и нейросетевые модули, поэтому всё, что обучается, написано на нём, а простой анализ на NumPy.
    [+] Что делает detach? Отцепляет тензор от графа вычислений: по нему больше не считаются градиенты, и не держится лишняя память. А item превращает тензор из одного числа в обычное число Python.
    [+] Зачем no_grad? Там, где мы не обучаем, при сборе активаций, генерации и оценке кросс-энтропии, градиенты не нужны. Так быстрее и экономнее по памяти.
  show:
    block: text
    reveal: by-para
    md: |
      **`default_rng(0)`, `manual_seed(0)`?** Воспроизводимость; одинаковый старт Broken и fixed SAE.

      **NumPy или PyTorch?** PyTorch = массивы + автоградиенты + модули → для обучения.

      **`.detach()`, `.item()`?** Отцепить от графа градиентов; тензор из одного числа → число Python.

      **`torch.no_grad()`?** Без обучения градиенты не нужны: быстрее, меньше памяти.

- section: Вопросы по коду — 2
  say: >-
    Ещё порция.
    [+] Зачем try и finally вокруг хуков? Хук обязательно снимается, даже если внутри случится ошибка. Иначе он залип бы на слое и влиял на все следующие вычисления.
    [+] Что такое nn.Parameter и requires_grad? Пометка «этот тензор обучается»: PyTorch будет считать по нему градиенты, а оптимизатор менять его.
    [+] Почему do_sample равно False? Жадная генерация без случайности: при перезапуске тексты те же, и сравнение нейрона и признака честное.
    [+] Сколько всё работает? На процессоре около четырёх-пяти минут. Пятнадцать игрушечных моделей пятьдесят две секунды, сбор активаций двадцать четыре секунды, каждый автоэнкодер около десяти секунд, сетка кросс-энтропии семьдесят восемь секунд.
  show:
    block: text
    reveal: by-para
    md: |
      **`try / finally` у хуков?** Хук снимется даже при ошибке.

      **`nn.Parameter`, `requires_grad`?** Тензор обучается: по нему считаются градиенты.

      **`do_sample=False`?** Жадная генерация, детерминированный текст.

      **Время?** ~4–5 мин на CPU: toy 52 с, активации 24 с, SAE ~10 с, CE 78 с.

- section: Вопросы по теории работы — 1
  say: >-
    Вопросы по теории работы.
    [+] Что такое концентрация меры? В большой размерности почти вся площадь сферы сосредоточена у экватора любого направления. Поэтому случайные векторы почти перпендикулярны, а значения гладких функций на сфере почти постоянны.
    [+] Почему разброс косинуса единица на d, а не что-то другое? Сумма квадратов координат единичного вектора равна единице, и все d координат равноправны.
    [+] Что такое суперпозиция и зачем разреженность? Хранение большего числа признаков, чем измерений, почти перпендикулярными направлениями. Помехи растут с числом одновременно активных признаков, поэтому работает только при разреженности.
    [+] Почему отрицательная интерференция бесплатна? ReLU превращает отрицательный отклик в ноль, ложного выхода нет.
  show:
    block: text
    reveal: by-para
    md: |
      **Концентрация меры?** Площадь сферы — у экватора; случайные векторы почти ⟂.

      **Почему $\mathrm{Var} = 1/d$?** $\sum v_i^2 = 1$ и симметрия координат.

      **Суперпозиция и разреженность?** $M > d$ почти ⟂ направлений; шум $\propto \sqrt{k/d}$, нужен малый $k$.

      **Отрицательная интерференция?** ReLU → 0: бесплатна.

- section: Вопросы по теории работы — 2
  say: >-
    И ещё четыре.
    [+] Чем Top-K лучше L1? L1 штрафует сумму активаций и занижает сильные признаки, это усадка, и требует подбора лямбды. Top-K оставляет ровно K лучших без штрафа.
    [+] Что такое Feature Ablation из лекции? Обратная стирингу операция: вычесть из вектора его проекцию на направление признака, чтобы модель забыла понятие. Мы её не делали, но механика та же, хук на слой.
    [+] Что такое attention sink? Первый токен окна, на который модель сбрасывает лишнее внимание. Его вектор раздут, у нас длина сто двадцать одна против четырнадцати, поэтому мы его выбросили.
    [+] Зачем мерить альфа в длинах x? Чтобы сила была сравнима с самим вектором и одинакова для нейрона и признака: оба направления единичные.
  show:
    block: text
    reveal: by-para
    md: |
      **Top-K или L1?** L1: усадка и подбор $\lambda$; Top-K: ровно $K$, без штрафа.

      **Feature Ablation?** $x \leftarrow x - \langle x, w\rangle w$ — «стереть» понятие (Л010, стр. 24).

      **Attention sink?** Позиция 0: $\|x\| \approx 121$ против 14 — выброшена из обучения SAE.

      **$\alpha$ в единицах $\|x\|$?** Сравнимая сила для единичных $e_i$ и $v_{SAE}$.

