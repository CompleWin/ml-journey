- section: Тренировочные вопросы лекции 010
  say: >-
    К лекции десять, на которой стоит вся лабораторная, есть одиннадцать тренировочных вопросов. Преподаватель вполне может задать любой из них. Разберём каждый: сначала что нужно, потом проверка.
    [+] Вопрос первый. В размерности четыре тысячи девяносто шесть два вектора случайно выбраны внутри единичного шара. Чему почти наверняка равно расстояние между ними?
    [+] Почти весь объём многомерного шара лежит у поверхности, это эффект тонкой оболочки. Значит, длины обоих векторов почти единица.
    [+] И они почти перпендикулярны, это концентрация меры. Квадрат расстояния равен сумме квадратов длин минус удвоенное скалярное произведение: один плюс один минус ноль, два. Расстояние корень из двух, около одной целой сорока одной сотой.
  show: {block: scene, src: 18-lecture.js, scene: shell}

- say: Проверь себя.
  quiz: {q: '$d = 4096$, $x, y$ равномерно в единичном шаре. К чему близко $\|x - y\|_2$?', answer: 1.414, tol: '1%', hint: 'Длины ≈ 1, векторы почти ⟂.', explain: '$\|x-y\|^2 = \|x\|^2 + \|y\|^2 - 2\langle x,y\rangle \approx 1 + 1 - 0 = 2$, ответ $\sqrt 2$.'}

- section: Вопросы 2 и 3
  say: >-
    Вопрос второй. Точка v равномерна на сфере в размерности сто. Подпространство W размерности двадцать пять. Чему равно ожидание квадрата длины проекции v на W?
    [+] Повернём оси так, чтобы W состояло из первых двадцати пяти координат. Квадрат длины проекции это сумма квадратов этих координат.
    [+] Средний квадрат каждой координаты равен единице, делённой на d, мы выводили это в задании 1.1. Двадцать пять координат дают двадцать пять сотых, одну четверть. Это точный ответ при любом d: k делить на d.
  show:
    block: derivation
    lines:
    - {tex: '\|P_W v\|^2 &= v_1^2 + \dots + v_{25}^2', note: 'оси выбраны вдоль W'}
    - {tex: '\mathbb{E}\|P_W v\|^2 &= 25 \cdot \frac{1}{100} = \frac{k}{d} = 0.25', note: 'E[vᵢ²] = 1/d'}

- say: Проверь себя.
  quiz: {q: '$d = 100$, $k = 25$. Чему равно $\mathbb{E}\|P_W v\|^2$?', answer: 0.25, tol: '1%', explain: '$k/d = 25/100$.'}

- say: >-
    Вопрос третий. Функция g это сумма проекций v на две перпендикулярные единичные оси. Во сколько раз нужно увеличить размерность, чтобы оценка неравенства Леви для g совпала с оценкой для одной проекции?
    [+] Сумма проекций это проекция на сумму осей. Длина суммы двух перпендикулярных единичных векторов корень из двух. Это и есть константа Липшица функции g.
    [+] В неравенстве Леви квадрат константы Липшица стоит в знаменателе показателя экспоненты. Два в знаменателе компенсируется удвоением d. Ответ: в два раза.
  show:
    block: derivation
    lines:
    - {tex: 'g(v) &= \langle u_1, v\rangle + \langle u_2, v\rangle = \langle u_1 + u_2,\ v\rangle, \quad L = \|u_1 + u_2\| = \sqrt{2}', note: 'константа Липшица'}
    - {tex: '\mathbb{P}(|g| \ge \varepsilon) &\le 2\exp\Big(-\frac{c\, d\, \varepsilon^2}{L^2}\Big) = 2\exp\Big(-\frac{c\, d\, \varepsilon^2}{2}\Big) \;\Rightarrow\; d \to 2d', note: 'L² = 2 гасится удвоением d'}

- say: Проверь себя.
  quiz: {q: 'Во сколько раз увеличить $d$ для $g(v) = \langle u_1, v\rangle + \langle u_2, v\rangle$?', answer: 2, tol: 0.01, explain: '$L^2 = 2$ в знаменателе показателя компенсируется $d \to 2d$.'}

- section: Вопросы 4 и 5
  say: >-
    Вопрос четвёртый. Для одной пары векторов вероятность нарушить почти перпендикулярность не больше двух экспонент от минус d эпсилон квадрат пополам. А ёмкость словаря получается только экспонента от d эпсилон квадрат на четыре. Откуда четвёрка?
    [+] Нужно, чтобы условие выполнялось для всех пар сразу. Пар примерно M в квадрате пополам. Неравенство объединения складывает вероятности по всем парам.
    [+] Сумма меньше единицы, когда M в квадрате на экспоненту меньше единицы. Извлекаем корень, и показатель делится на два: двойка превращается в четвёрку. Причина: число пар растёт как квадрат числа векторов.
  show:
    block: derivation
    lines:
    - {tex: '\mathbb{P}(\exists\, i<j: |\langle u_i,u_j\rangle| > \varepsilon) &< \frac{M^2}{2} \cdot 2 e^{-d\varepsilon^2/2}', note: 'неравенство объединения по ~M²/2 парам'}
    - {tex: 'M^2 e^{-d\varepsilon^2/2} < 1 \;&\Rightarrow\; M < e^{d\varepsilon^2/4}', note: 'корень из M² делит показатель на 2'}

- say: >-
    Вопрос пятый, практический. В поиске по эмбеддингам перешли с размерности двести пятьдесят шесть на четыре тысячи девяносто шесть. Старый порог косинуса ноль двадцать. Какой порог даст ту же z-оценку, если пространства центрированы?
    [+] z-оценка это порог, делённый на сигму шума, а сигма равна единице на корень из d. Чтобы z не изменилась, порог должен уменьшиться во столько же раз, во сколько уменьшилась сигма.
    [+] Корень из отношения размерностей: корень из двухсот пятидесяти шести на четыре тысячи девяносто шесть, одна четвёртая. Новый порог ноль ноль пять. Условие центрированности важно: без него, как мы видели, косинусы сдвинуты конусом.
  show:
    block: derivation
    lines:
    - {tex: 'z = \frac{\tau}{\sigma} = \tau \sqrt{d}', note: 'σ = 1/√d у центрированных эмбеддингов'}
    - {tex: '\tau_2 = \tau_1 \sqrt{\frac{d_1}{d_2}} &= 0.20 \cdot \sqrt{\frac{256}{4096}} = 0.20 \cdot \frac{1}{4} = 0.05', note: 'z сохраняется'}

- say: Проверь себя.
  quiz: {q: 'Порог $\tau_1 = 0.20$ при $d_1 = 256$. Какой порог $\tau_2$ при $d_2 = 4096$?', answer: 0.05, tol: '2%', hint: '$\tau \propto 1/\sqrt{d}$.', explain: '$0.20 \cdot \sqrt{256/4096} = 0.05$.'}

- section: Вопросы 6 и 7
  say: >-
    Вопрос шестой. Поиск ближайших соседей в размерности тысяча двадцать четыре. На синтетических векторах с независимыми координатами он неустойчив, а на эмбеддингах документов работает. Почему?
    [+] У независимых координат расстояния концентрируются: квадрат расстояния это сумма d независимых слагаемых, его относительный разброс падает как единица на корень из d. Это теорема Бейера: ближайший и дальний соседи почти на одном расстоянии, и малейший шум меняет состав соседей.
    [+] А реальные эмбеддинги лежат на многообразии малой эффективной размерности внутри большого пространства. Это гипотеза многообразий. Вдоль него контраст расстояний сохраняется. Сравни с заданием 1.2: настоящие эмбеддинги вовсе не случайные векторы.
  show:
    block: compare
    reveal: by-side
    titles: ['синтетика: координаты независимы', 'эмбеддинги текстов']
    left: |
      $\mathrm{CV}(\|X-Y\|^2) \propto 1/\sqrt{d} \to 0$

      все точки почти на одном расстоянии (теорема Бейера) → $k$-NN неустойчив
    right: |
      данные на многообразии $d_{\text{eff}} \ll d$

      контраст расстояний сохраняется → $k$-NN работает

- say: >-
    Вопрос седьмой. Инженер хочет убрать интерференцию, сделав все направления признаков строго перпендикулярными, и для этого увеличить число слоёв. Почему не поможет?
    [+] Residual stream между слоями всё равно вектор размерности d. Глубина добавляет вычисления, но не ширину канала: каждый слой читает и пишет в тот же вектор.
    [+] Строго перпендикулярных направлений в нём не больше d, у LLaMA-3-8B это четыре тысячи девяносто шесть. Больше признаков можно хранить только почти перпендикулярно, то есть в суперпозиции.
  show:
    block: text
    reveal: by-para
    md: |
      **Глубина ≠ ширина:** все слои читают и пишут один и тот же вектор $x \in \mathbb{R}^d$.

      **Строго ⟂ признаков максимум $d = 4096$;** $10^5$ признаков — только в суперпозиции.

- section: Вопросы 8 и 9
  say: >-
    Вопрос восьмой. Размерность тысяча двадцать четыре, признаков сто тысяч, а в специфическом домене одновременно активно тысяча двести признаков. Почему чтение признака проекцией провалится, хотя тысяча двести намного меньше ста тысяч?
    [+] Шум интерференции имеет разброс порядка корня из k, делённого на d, умноженного на среднюю силу признака. Корень из тысячи двухсот на тысячу двадцать четыре больше единицы, около одной целой восьми сотых.
    [+] Шум больше самого сигнала. Важно не то, мало ли k по сравнению с M, а мало ли k по сравнению с d. Ровно это мы видели во втором задании: при росте p суперпозиция ломается.
  show: {block: scene, src: 18-lecture.js, scene: noise}

- say: >-
    Вопрос девятый. Размерность четыре тысячи девяносто шесть, активно шестьдесят четыре признака силы один. Порог выбран равным двум стандартным отклонениям шума неактивного признака. Что получится на выходе активного признака, если его шум равен нулю?
    [+] Стандартное отклонение шума: корень из шестидесяти четырёх на четыре тысячи девяносто шесть, одна восьмая, ноль сто двадцать пять. Порог вдвое больше, ноль двадцать пять.
    [+] Выход активного признака: ReLU от единицы плюс ноль минус ноль двадцать пять, то есть ноль семьдесят пять. Это та самая усадка порогом из задачи 2.2: порог срезает шум, но и сигнал уменьшает на b.
  show:
    block: derivation
    lines:
    - {tex: '\mathrm{std}(\eta) &\approx \sqrt{\frac{k}{d}} = \sqrt{\frac{64}{4096}} = \frac{1}{8} = 0.125, \quad b = 2\,\mathrm{std} = 0.25', note: 'порог — две сигмы шума'}
    - {tex: '\tilde f_i &= \mathrm{ReLU}(1 + 0 - 0.25) = 0.75', note: 'сигнал уменьшен на b'}

- say: Проверь себя.
  quiz: {q: 'Вопрос 9: $d = 4096$, $k = 64$, $f_i = 1$, $b = 2\,\mathrm{std}(\eta)$, $\eta_i = 0$. Чему равно $\tilde f_i$?', answer: 0.75, tol: '1%', hint: '$\mathrm{std} = \sqrt{64/4096}$.', explain: '$b = 0.25$, $\mathrm{ReLU}(1 - 0.25) = 0.75$.'}

- section: Вопросы 10 и 11
  say: >-
    Вопрос десятый. Чтобы убрать нежелательное понятие A, инженеры занулили все нейроны, которые положительны при A. Понятие пропало, но сломались и посторонние вещи, синтаксис Python и факты античной истории. Почему?
    [+] Нейрон это проекция вектора на ось. В неё вносят вклад все признаки, у которых ненулевая проекция на эту ось, а таких очень много. Нейроны полисемантичны.
    [+] Зануляя координату, мы вырезаем из вектора проекции всех этих признаков сразу, а не только A. Правильный способ из лекции: Feature Ablation, вычитание проекции на направление самого признака A, найденное автоэнкодером.
  show:
    block: derivation
    lines:
    - {tex: 'x_k = \langle e_k, x\rangle &= \sum_j f_j \langle e_k, w_j\rangle', note: 'нейрон слышит много признаков'}
    - {tex: 'x_k \leftarrow 0 \;&\Rightarrow\; \text{вырезаны все } f_j \langle e_k, w_j \rangle; \qquad \text{вместо этого: } x \leftarrow x - \langle x, w_A\rangle w_A', note: 'Feature Ablation трогает только A'}

- say: >-
    Вопрос одиннадцатый, прямо про задание три. В автоэнкодере с L1-штрафом забыли зафиксировать единичную длину направлений словаря. К чему приведёт градиентный спуск?
    [+] Произведение силы на направление не меняется, если силу разделить на c, а направление умножить на c. Восстановление остаётся тем же.
    [+] А штраф, лямбда на сумму сил, уменьшается в c раз. Поэтому спуск будет бесконечно растягивать направления и сжимать активации к нулю. Слагаемое восстановления этому не помешает: оно к такой перестановке масштаба нечувствительно. Штраф перестаёт работать, разреженности нет. Поэтому в исправленном коде задания три мы нормируем словарь всегда.
  show:
    block: derivation
    lines:
    - {tex: 'f_i\, d_i &= \Big(\frac{f_i}{c}\Big)(c\, d_i)', note: 'восстановление не меняется'}
    - {tex: '\lambda \sum_i |f_i| \;\to\; \frac{\lambda}{c} \sum_i |f_i|: \quad \|d_i\| &\to \infty,\ \ f_i \to 0', note: 'штраф обманут; нужно ‖dᵢ‖ = 1'}

- say: Проверь себя.
  quiz:
    q: 'Вопрос 11: что будет, если в L1-SAE не фиксировать $\|d_i\| = 1$?'
    options:
    - {text: 'Ничего: восстановление следит за масштабом', why: 'Восстановление не чувствует масштаба: $f_i d_i = (f_i/c)(c\,d_i)$.'}
    - '$\|d_i\| \to \infty$, $f_i \to 0$: штраф уменьшается без потери восстановления'
    - {text: '$\|d_i\| \to 0$, $f_i \to \infty$', why: 'Тогда штраф рос бы, спуск идёт в обратную сторону.'}
    answer: 2
    explain: 'Поэтому в TopKSAE словарь нормируется на каждом шаге (`unit_decoder`).'

