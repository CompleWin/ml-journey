- section: 'Контрольное 2: перплексия'
  say: >-
    Второе контрольное: построить кросс-энтропию на нейтральном корпусе в зависимости от альфа для нейрона и для признака. Для контроля добавлено случайное направление той же длины. Функция language_modeling_loss вызывает модель с аргументом labels, и библиотека сама сдвигает метки на один токен и считает среднюю кросс-энтропию. Без воздействия три целых восемьсот пятьдесят две тысячных.
    [+] Нейрон сорок два: при половине длины вектора четыре целых пятьдесят одна сотая, при длине пять целых восемьдесят семь сотых, при полутора длинах семь целых двадцать три сотых.
    [+] Признак: четыре восемьдесят одна, восемь восемьдесят девять и двенадцать шестьдесят две. Растёт быстрее всех.
    [+] Случайное направление: четыре шестьдесят, шесть сорок шесть и восемь пятьдесят. Почти рядом с нейроном.
  show:
    block: plot
    data: ce
    x: a
    y: [neuron, sae, rnd]
    reveal: by-layer
    xlabel: 'сила воздействия $\alpha / \mathbb{E}\|x\|$'
    ylabel: 'Cross-Entropy на нейтральном корпусе'

- section: Ожидание условия не подтвердилось
  say: >-
    Условие ожидало обратного: что при одинаковой длине добавки вектор признака дольше сохраняет низкую перплексию, чем нейрон. У нас вектор признака поднимает перплексию быстрее. Это четвёртое расхождение. Объяснение из трёх пунктов.
    [+] Первое. Кросс-энтропия на нейтральном тексте меряет, насколько предсказания модели отклонились от нейтрального текста. Направление признака модель по-настоящему читает: это настоящий признак, и следующие слои на него настроены. Вся сила толчка уходит в одно понятие, модель уверенно ждёт сокращений вместо обычных слов, и кросс-энтропия на обычном тексте быстро растёт. Высокая кросс-энтропия здесь означает сильное управляемое воздействие, а не хаос.
    [+] Второе. Нейрон ведёт себя почти как случайное направление, кривые рядом. По концентрации меры из первого задания фиксированная ось имеет проекцию порядка единицы на корень из пятисот двенадцати, около ноль ноль сорока четырёх, на каждое из множества направлений признаков. Толчок размазывается тонким слоем по многим несвязанным признакам, и каждый маленький толчок в основном срезается порогами нелинейностей, как порог b срезал интерференцию во втором задании. Поэтому модель долго почти не реагирует.
    [+] Третье. Утверждение условия про синтаксическую связность генерируемого текста. В этом смысле картина такая: нейрон дольше сохраняет грамматику, но не вносит смысла. Признак вносит смысл, но у него есть порог, за которым связность рушится. В больших моделях с хорошо обученными автоэнкодерами окно между «понятие появилось» и «текст развалился» шире, как у Golden Gate Claude.
  show:
  - {block: scene, src: 16-analysis.js, scene: spread, size: [800, 900]}
  - block: text
    reveal: by-para
    md: |
      **Ожидание:** SAE-вектор дольше держит низкую перплексию. **Факт:** наоборот.

      1. CE на нейтральном тексте мерит **силу** отклонения: признак модель «читает» целиком → сильное управляемое воздействие
      2. нейрон ≈ случайное направление: проекция $\sim 1/\sqrt{512} \approx 0.044$ на многие признаки, толчки срезаются порогами
      3. по связности текста: нейрон держит грамматику, но без смысла; признак вносит смысл до порога

- section: 'Контрольное 3: фазовый переход в бред'
  say: >-
    Третье контрольное: при каком альфа толчок вдоль признака перестаёт вносить понятие и начинает разрушать связность? Ориентир даёт естественный диапазон признака: медиана активации ноль восемьдесят три, максимум три целых семьдесят восемь сотых, это около двадцати семи сотых длины вектора.
    [+] До двух десятых длины, альфа до двух целых восьми десятых, мы внутри естественного диапазона. Текст совпадает с базовым: толчок слабее, чем от настоящей скобки в тексте.
    [+] Три — четыре десятых, альфа от четырёх и двух десятых до пяти и шести десятых, чуть выше естественного максимума. Понятие вносится: продвигаемые токены это сокращения. Генерация попадает в цикл, но такой же цикл даёт и нейрон при двух десятых, так что это скорее неустойчивость жадной генерации маленькой модели.
    [+] От половины длины, альфа от семи, почти вдвое выше естественного максимума: явный бред. «Square square square», а с восьми десятых несвязные символы.
    [+] Ответ: порог между тремя и пятью десятыми длины вектора, альфа примерно от четырёх до семи, сразу за пределами естественного диапазона активаций признака. На левом графике красная линия это естественный максимум.
  show:
    block: figure
    src: figures/nb76-1.png
    reveal: by-mark
    caption: 'Слева: доля уникальных токенов от $\alpha$; справа: геометрия сдвига'
    marks:
    - {at: [0.08, 0.3], text: 'внутри естественного диапазона'}
    - {at: [0.17, 0.75], text: 'цикл'}
    - {at: [0.3, 0.85], text: 'бред'}
    - {at: [0.2, 0.12], text: 'порог: 0.3–0.5‖x‖'}

- section: Геометрия фазового перехода
  say: >-
    С чем это связано геометрически? Две причины.
    [+] Первая. Модель обучалась на векторах из тонкой оболочки длины около четырнадцати, где значение этого признака не превышает трёх целых восьми десятых. При большем альфа у вектора появляется компонента вдоль признака, какой модель никогда не видела. Вектор выходит за пределы распределения данных.
    [+] Вторая. Направление признака почти перпендикулярно x. Тогда по Пифагору длина суммы равна длине x, умноженной на корень из единицы плюс квадрат отношения альфа к длине x. А при альфа, равном длине x, вектор повёрнут на сорок пять градусов и длиннее в одну целую сорок одну сотую раза.
    [+] Следующие слои начинаются с LayerNorm, которая возвращает длину к норме. Значит, собственная информация токена сжимается во столько же раз.
    [+] А добавка одинакова на всех позициях текста. Все токены становятся похожи друг на друга: везде «открытая скобка». Внимание перестаёт их различать, и модель зацикливается и выдаёт мусор. Это тот же механизм, что у канала-выброса при квантовании из лекции про случайные проекции: одна огромная компонента после нормировки подавляет все остальные.
  show: {block: scene, src: 16-analysis.js, scene: phase}

- say: >-
    Формулы к этой картинке.
    [+] Длина вектора после сдвига, по теореме Пифагора, потому что направление признака почти перпендикулярно x.
    [+] Косинус угла между новым и старым вектором.
    [+] При альфа, равном длине x: длиннее в корень из двух раз, угол сорок пять градусов. После LayerNorm доля исходного x в векторе падает во столько же раз.
  show:
    block: derivation
    lines:
    - {tex: '\|x + \alpha v\| &= \|x\| \sqrt{1 + (\alpha/\|x\|)^2}', note: 'v ⟂ x: теорема Пифагора'}
    - {tex: '\cos(x + \alpha v,\ x) &= \frac{1}{\sqrt{1 + (\alpha/\|x\|)^2}}', note: 'поворот к направлению v'}
    - {tex: '\alpha = \|x\| \;&\Rightarrow\; \sqrt{2} \approx 1.41, \quad \theta = 45°', note: 'LayerNorm сжимает информацию токена в 1.41 раза'}

- section: Вывод к заданию 4
  say: >-
    Итог четвёртого задания.
    [+] Толчок вдоль нейрона не вносит понятного смысла: он продвигает смесь несвязанных тем, текст долго почти не меняется, потом разваливается.
    [+] Толчок вдоль признака вносит конкретный смысл: модель начинает ждать то, что пишут после скобки.
    [+] По кросс-энтропии признак действует сильнее нейрона, потому что модель его читает, а нейрон размазан по многим признакам. Ожидание условия о перплексии не подтвердилось, и это объяснено.
    [+] Фазовый переход в бред наступает между тремя и пятью десятыми длины вектора, сразу за естественным диапазоном признака: вектор уходит из распределения данных, а LayerNorm подавляет информацию токенов.
  show:
    block: text
    reveal: by-para
    md: |
      - нейрон 42: смесь тем (`bishop`, `Pence`, `EDTA`…), потом дегенерация
      - признак 1892: одно понятие — «после скобки идёт сокращение»
      - CE: признак 8.89 против нейрона 5.87 при $\alpha = \|x\|$ — модель «читает» признак
      - бред при $\alpha \approx 0.3$–$0.5\|x\|$: за пределом естественного максимума 3.78 ≈ 0.27‖x‖

