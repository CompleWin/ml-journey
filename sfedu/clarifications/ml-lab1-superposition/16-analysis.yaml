- section: 'Контрольное 1: качественный анализ'
  say: >-
    Контрольные задания. Первое: сравнительная таблица текстов при слабом, среднем и сильном воздействии. В ноутбуке выбраны три десятых, половина и одна длина вектора.
    [+] Нейрон сорок два. Слабое: связный текст без нового смысла. Среднее: повторы «a table on which to hold a chair». Сильное: дегенерация в переносы строк.
    [+] Признак тысяча восемьсот девяносто два. Слабое: цикл «a large table with». Среднее: «a large square square square». Сильное: набор символов «MegNiNiNi».
    [+] По двадцати пяти жадно выбранным токенам смысл виден плохо. Модель на семьдесят миллионов параметров при любом заметном вмешательстве легко срывается в повтор. Нужен более чувствительный способ увидеть, какой смысл вносит толчок.
  show:
    block: table
    reveal: by-row
    cols: [воздействие, '$\alpha / \|x\|$', текст]
    rows:
    - ['база', '0', 'a large table and a large table with a large table.⏎⏎"I''m not sure what you''re talking about,']
    - ['нейрон 42: слабое / среднее / сильное', '0.3 / 0.5 / 1.0', 'a table on which to sit and wait… · …to hold a chair… · …⏎gated on the⏎⏎⏎']
    - ['признак 1892: слабое / среднее / сильное', '0.3 / 0.5 / 1.0', 'a large table with a large table with… · a large square square square… · e⏎MegNiNiNiNi…']
    - ['вывод', '', 'по 25 жадным токенам маленькой модели смысл виден плохо']

- section: Какие токены продвигает толчок
  say: >-
    Более чувствительный способ: смотреть прямо на предсказания.
    [+] На нейтральном корпусе усредняем логарифмы вероятностей всех токенов словаря с воздействием и без. Хук тот же, а модель вызывается целиком, с языковой головой.
    [+] Разность показывает, какие токены воздействие делает вероятнее. Берём пятнадцать токенов с наибольшим ростом при слабом толчке, три десятых длины, альфа четыре и две десятых: текст при этом ещё не разрушен.
    [+] Для контроля то же самое для случайного направления такой же длины. Так видно, что эффект не случайный.
  show:
    block: code
    lang: python
    reveal: all
    trace: [[1, 2, 6, 7, 8], [13, 14, 15], 12]
    src: |
      def average_log_probabilities(direction, alpha, batch_size=5):
          handle = add_steering_hook(direction, alpha)
          batch_means = []
          try:
              with torch.no_grad():
                  for start in range(0, len(neutral_windows), batch_size):
                      log_probabilities = torch.log_softmax(language_model(neutral_windows[start:start + batch_size]).logits, dim=-1)
                      batch_means.append(log_probabilities.reshape(-1, log_probabilities.shape[-1]).mean(dim=0))
          finally:
              handle.remove()
          return torch.stack(batch_means).mean(dim=0)[:vocabulary_size]
      random_direction = torch.randn(d_model); random_direction = random_direction / random_direction.norm()
      baseline_log_probabilities = average_log_probabilities(neuron_direction, 0.0)
      change = average_log_probabilities(direction, analysis_alpha) - baseline_log_probabilities
      top_token_ids = torch.topk(change, 15).indices.tolist()

- say: >-
    Результат. Здесь разница видна однозначно.
    [+] Признак автоэнкодера поднимает ровно то, что пишут сразу после открывающей скобки в английских текстах. Аббревиатуры без пробела: RSP, RM, RD, MW, WR, RQ, SP, UE. Слова hereinafter, «далее именуемый», including, Supporting, partial. Это одно связное понятие: «мы внутри скобок, дальше сокращение или уточнение».
    [+] Нейрон поднимает смесь несвязанных тем: gated, епископ и епископы, Пенс, Байден, сенаторы, помилование, химическое вещество EDTA, обрывки gio, Ga, Gi. Церковь, политика США и биохимия сразу. Это и есть полисемантичность.
    [+] Случайное направление поднимает бессмысленные обрывки байтов, нечитаемые символы. Вывод: толчок вдоль признака вносит одно понятное понятие, толчок вдоль нейрона смесь понятий.
  show:
