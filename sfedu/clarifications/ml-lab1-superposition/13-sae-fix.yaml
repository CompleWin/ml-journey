- section: Частоты срабатывания латентов
  say: >-
    Самая наглядная картинка поломки: как часто срабатывает каждый латент за последние тридцать две тысячи векторов. По горизонтали десятичный логарифм доли токенов. Минус два значит одна сотая, минус четыре одна десятитысячная. Мёртвые латенты в гистограмму не попадают.
    [+] Сломанный автоэнкодер, синий. Кроме пятисот сорока двух мёртвых, ещё около девятисот латентов сработали всего от одного до пяти раз, это столбики слева, около минус четырёх. А восемнадцать латентов срабатывают больше чем на половине всех токенов. Двадцать самых частых забирают сорок два процента всех срабатываний.
    [+] Исправленный, оранжевый: аккуратный колокол около минус двух, латент срабатывает примерно на трёх десятых — трёх процентах токенов. Перегруженных нет, двадцать самых частых забирают четырнадцать процентов. Нагрузка распределена по всему словарю.
  show:
