- section: 'Ошибка 1: нет центрирования'
  say: >-
    Ошибка первая: вход не центрирован. В энкодер подаётся сырой x, а b dec инициализирован нулём и из входа не вычитается.
    [+] Мы видели, что векторы третьего слоя анизотропны: у всех токенов есть большая общая часть, средний вектор. На неё приходится двадцать процентов энергии, средний косинус между токенами ноль тридцать пять.
    [+] Предактивация латента это скалярное произведение x с его детектором. Разложим x на общую часть и индивидуальную. Вклад общей части одинаков для всех токенов. Латенты, чей детектор смотрит вдоль среднего вектора, получают большую добавку на любом токене и выигрывают Top-K всегда. Остальные проигрывают и умирают.
    [+] Исправление: инициализировать b dec средним вектором данных и подавать в энкодер x минус b dec. Тогда общая часть вычитается, и побеждают латенты, которые реагируют на особенности конкретного токена. Так и написано в лекции: b dec центрирует активации относительно среднего вектора.
  show: {block: scene, src: 13-sae-fix.js, scene: nocenter}

- section: 'Ошибка 2: нет ReLU'
  say: >-
    Ошибка вторая: нет ReLU, активации могут быть отрицательными.
    [+] topk выбирает тридцать два самых больших числа в строке, даже если какие-то из них отрицательные. Тогда латент с отрицательным значением всё равно попадает в код.
    [+] Получается, что один латент кодирует и понятие, и «анти-понятие» со знаком минус. Это нарушает первую опору суперпозиции из лекции: сила признака неотрицательна.
    [+] Исправление: ReLU перед Top-K, как в формуле энкодера из задания четыре. Отрицательные предактивации становятся нулями и в код не попадают.
  show: {block: scene, src: 13-sae-fix.js, scene: norelu}

- section: 'Ошибка 3: инициализация и нормировка словаря'
  say: >-
    Ошибка третья: энкодер и декодер инициализированы независимо, и словарь не нормирован.
    [+] Посмотрим на один латент. Его детектор, столбец энкодера, решает, когда латент включается. А его направление записи, строка декодера, это то, что латент добавляет в восстановление. При независимой случайной инициализации они смотрят в несвязанные стороны. Латент включается на одно, а пишет другое, и многие латенты с самого начала не выигрывают Top-K и не получают градиента.
    [+] Вторая половина проблемы: длины направлений словаря не зафиксированы. Можно умножить силу латента на c и разделить направление на c, восстановление не изменится. Это неоднозначность масштаба из вопроса одиннадцать к лекции: активации разных латентов становятся несравнимыми, а Top-K сравнивает именно их.
    [+] Исправление по статье OpenAI две тысячи двадцать четвёртого года: направления словаря инициализируются единичными векторами, энкодер их транспонированием, то есть детектор совпадает с направлением записи. А в декодере строки всегда нормируются на единичную длину.
  show: {block: scene, src: 13-sae-fix.js, scene: tied}

- section: Исправленный класс
  say: >-
    Исправленный класс TopKSAE.
    [+] Словарь: случайные векторы, нормированные на единичную длину. Энкодер инициализирован транспонированным словарём, декодер самим словарём. Это ошибка три.
    [+] b dec инициализирован средним вектором обучающих данных. Это ошибка один.
    [+] unit_decoder при каждом вызове делит строки декодера на их длины, поэтому направления словаря всегда единичные. Тоже ошибка три.
    [+] В энкодере из x вычитается b dec, а перед topk стоит ReLU. Ошибки один и два.
    [+] Декодер использует нормированный словарь.
  show:
    block: code
    lang: python
    reveal: all
    trace: [[5, 6, 7, 9], 10, [11, 12], 14, 19]
    src: |
      class TopKSAE(nn.Module):
          def __init__(self, data_mean, d_model=512, d_sae=2048, k=32):
              super().__init__()
              self.k = k
              dictionary = torch.randn(d_sae, d_model)
              dictionary = dictionary / dictionary.norm(dim=1, keepdim=True)
              self.W_enc = nn.Parameter(dictionary.T.clone())
              self.b_enc = nn.Parameter(torch.zeros(d_sae))
              self.W_dec = nn.Parameter(dictionary.clone())
              self.b_dec = nn.Parameter(data_mean.clone())
          def unit_decoder(self):
              return self.W_dec / self.W_dec.norm(dim=1, keepdim=True)
          def encode(self, x):
              pre_acts = torch.relu((x - self.b_dec) @ self.W_enc + self.b_enc)
              val, idx = torch.topk(pre_acts, self.k, dim=-1)
              acts = torch.zeros_like(pre_acts).scatter_(-1, idx, val)
              return acts
          def decode(self, acts):
              return acts @ self.unit_decoder() + self.b_dec

