- section: Почему EV не упала до 50–60%
  say: >-
    Теперь честный ответ про расхождение с условием. Условие ожидало, что у сломанной модели объяснённая дисперсия не поднимется выше пятидесяти — шестидесяти процентов. У нас ноль восемьсот восемнадцать. Почему?
    [+] Функция потерь это только восстановление, а b dec обучаемый параметр. За время обучения сломанная модель сама выучивает в нём средний вектор, и общая часть восстанавливается.
    [+] Кроме того, дисперсия в формуле считается вдоль координат каждого вектора. Такая метрика засчитывает и восстановление большой общей компоненты. В отдельной проверке вне ноутбука дисперсия по батчу, где общая часть не засчитывается, дала около ноль семидесяти четырёх — ноль семидесяти семи у обеих моделей.
    [+] Поэтому поломка проявляется прежде всего в словаре: четверть латентов мертва, ещё около сорока пяти процентов почти не работают, а горстка перегруженных срабатывает на всё подряд. Такие латенты невозможно интерпретировать, а именно это нужно в четвёртом задании.
  show:
    block: text
    reveal: by-para
    md: |
      - потеря — только восстановление; $b_{dec}$ обучается и сам выучивает $\mathbb{E}[x]$
      - EV «вдоль координат» засчитывает общую компоненту; по батчу (`var(dim=0)`) обе модели ≈ 0.74–0.77
      - поломка — в **словаре**: 26.5% мёртвых, ~45% почти мёртвых, 18 перегруженных

- section: Что даёт каждое исправление
  say: >-
    На защите могут спросить, какое исправление самое важное. В дополнительном эксперименте вне ноутбука каждое исправление включали по отдельности, по три запуска. Числа чуть отличаются от ноутбука, потому что данные перемешаны иначе.
    [+] Только центрирование сильнее всего поднимает объяснённую дисперсию, до ноль восьмисот пятидесяти трёх, и убирает большую часть мёртвых: остаётся восемь — десять процентов.
    [+] Только ReLU на цифры не влияет совсем. Он нужен не для метрик, а для смысла: признак должен быть неотрицательной силой.
    [+] Только связанная единичная инициализация с нормировкой оставляет один процент мёртвых.
    [+] Все три вместе дают ноль мёртвых. Связанная инициализация добивает мёртвые латенты, но немного снижает объяснённую дисперсию: с единичными векторами Adam учит направления медленнее.
