- section: Сломанный код построчно
  say: >-
    Вот исходный автоэнкодер из условия, построчно, с формами тензоров.
    [+] В конструкторе четыре параметра. nn.Parameter помечает тензор как обучаемый: оптимизатор будет его менять. Матрица энкодера пятьсот двенадцать на две тысячи сорок восемь и матрица декодера две тысячи сорок восемь на пятьсот двенадцать заполнены случайными числами, умноженными на ноль ноль два, то есть маленькими. Оба смещения нулевые.
    [+] Энкодер умножает батч, шестьдесят четыре вектора по пятьсот двенадцать чисел, на матрицу энкодера и прибавляет смещение. Получаются предактивации: шестьдесят четыре на две тысячи сорок восемь.
    [+] topk находит в каждой строке тридцать два самых больших значения и их номера.
    [+] scatter раскладывает эти значения по их номерам в тензор из нулей той же формы. Остальные две тысячи шестнадцать латентов зануляются.
    [+] Декодер умножает разреженный код на матрицу декодера и прибавляет смещение. Восстановление снова шестьдесят четыре на пятьсот двенадцать.
  show:
  - {block: scene, src: 13-sae-fix.js, scene: shapes, size: [800, 900]}
  - block: code
    lang: python
    reveal: all
    trace: [[5, 6, 7, 8], 10, 11, 12, 15]
    src: |
      class BrokenTopKSAE(nn.Module):
          def __init__(self, d_model=512, d_sae=2048, k=32):
              super().__init__()
              self.k = k
              self.W_enc = nn.Parameter(torch.randn(d_model, d_sae) * 0.02)
              self.b_enc = nn.Parameter(torch.zeros(d_sae))
              self.W_dec = nn.Parameter(torch.randn(d_sae, d_model) * 0.02)
              self.b_dec = nn.Parameter(torch.zeros(d_model))
          def encode(self, x):
              pre_acts = x @ self.W_enc + self.b_enc
              val, idx = torch.topk(pre_acts, self.k, dim=-1)
              acts = torch.zeros_like(pre_acts).scatter_(-1, idx, val)
              return acts
          def decode(self, acts):
              return acts @ self.W_dec + self.b_dec

- section: Цикл обучения и замер
  say: >-
    Цикл обучения один для обеих версий.
    [+] Adam со скоростью обучения одна тысячная. На каждом шаге берём следующие шестьдесят четыре вектора из обучающей выборки.
    [+] Потеря это только ошибка восстановления: сумма квадратов по координатам, среднее по батчу. Как и положено у Top-K автоэнкодера, никакого штрафа за разреженность.
    [+] Обычные три строки: обнулить градиенты, посчитать их, сделать шаг.
    [+] А для метрик на каждом шаге запоминаем объяснённую дисперсию, а в последние пятьсот шагов для каждого латента копим, сколько раз его активация была ненулевой. Латент с нулевым счётчиком мёртвый.
  show:
    block: code
    lang: python
    reveal: all
    trace: [[1, 3, 4], 5, [7, 8, 9], [10, 11, 12, 13]]
    src: |
      optimizer = torch.optim.Adam(sae.parameters(), lr=1e-3)
      for step in range(steps):
          x = activations[step * batch_size:(step + 1) * batch_size]
          x_hat, acts = sae(x)
          loss = ((x - x_hat) ** 2).sum(dim=-1).mean()

          optimizer.zero_grad()
          loss.backward()
          optimizer.step()
          with torch.no_grad():
              explained_variance_history.append(explained_variance(x, x_hat).item())
              if step >= steps - measured_steps:
                  activation_counts += (acts != 0).sum(dim=0)

