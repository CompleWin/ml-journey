- section: 'Задача 2.2: что требуется'
  say: >-
    Задача 2.2 про порог b. Для каждого значения p нужно сделать три вещи.
    [+] Объяснить теоретически, почему без порога, при b равном нулю, модель с ReLU ошибается неприемлемо сильно даже при сверхразреженных данных, когда p одна сотая.
    [+] Найти оптимальный общий порог b со звёздочкой, при котором средняя ошибка восстановления минимальна.
    [+] И построить график зависимости оптимального порога от p, объяснив, как и почему он меняется.
  show:
    block: text
    reveal: by-para
    md: |
      1. почему при $b = 0$ ошибка огромна даже при $p = 0.01$?
      2. $b^*(p) = \arg\min_b \; \mathbb{E}\big[\|f - \mathrm{ReLU}(W^\top W f - b)\|_2^2\big]$
      3. график $b^*(p)$: как и почему он меняется

- section: Ошибка восстановления в коде
  say: >-
    Сначала три функции.
    [+] reconstruct считает матрицу Грама, умножает её на все примеры сразу, вычитает порог и применяет ReLU, то есть берёт максимум с нулём. reshape превращает порог в столбец, чтобы он вычитался из каждой строки, это снова бродкастинг.
    [+] reconstruction_error это MSE: для каждого примера сумма квадратов ошибок по сорока признакам, затем среднее по всем примерам.
    [+] normalized_error делит эту ошибку на среднюю энергию самих признаков. Зачем это нужно, увидим в задаче 2.3.
  show:
    block: code
    lang: python
    reveal: all
    trace: [[1, 2, 3], [5, 6], [8, 9]]
    src: |
      def reconstruct(features, directions, threshold):
          gram_matrix = directions.T @ directions
          return np.maximum(gram_matrix @ features - np.reshape(threshold, (-1, 1)), 0)

      def reconstruction_error(features, directions, threshold):
          return np.mean(np.sum((features - reconstruct(features, directions, threshold)) ** 2, axis=0))

      def normalized_error(features, directions, threshold):
          return reconstruction_error(features, directions, threshold) / np.mean(np.sum(features ** 2, axis=0))

- section: Почему без порога плохо
  say: >-
    Теперь ответ на первый вопрос. При нулевом пороге нормированная ошибка около одной целой семидесяти шести сотых: модель хуже, чем если бы она просто выдала нули. Посмотрим, почему. Пусть горит один признак j со значением r.
    [+] Его собственный выход восстановится точно: r плюс ноль.
    [+] А каждый из остальных тридцати девяти признаков получает отклик: r, умноженное на косинус между направлениями. У случайной схемы эти косинусы разбросаны вокруг нуля с сигмой около ноль трёх десятых.
    [+] ReLU отрезает отрицательную половину, но положительная проходит. На каждый настоящий признак модель выдаёт около двадцати ложных эхо.
  show: {block: scene, src: 08-threshold.js, scene: echo}

- say: >-
    Оценим энергию этих эхо.
    [+] Ложных выходов тридцать девять, примерно половина положительна.
    [+] Средний квадрат косинуса между случайными направлениями в размерности десять равен одной десятой, мы вывели это в первом задании.
    [+] Итого энергия эхо около одной целой девяноста пяти сотых от энергии сигнала, почти вдвое больше самого сигнала. Отсюда нормированная ошибка около двух, а в эксперименте одна целая семьдесят шесть сотых.
    [+] И разреженность здесь не помогает. При меньшем p эхо появляется реже, но ровно во столько же раз реже появляется и сам сигнал, а их отношение не меняется. Поэтому при нулевом пороге ошибка почти одинакова при любом p.
  show:
    block: derivation
    lines:
    - {tex: '\text{эхо: } \hat f_i &= \mathrm{ReLU}\big((w_i^\top w_j)\, r\big), \quad i \ne j', note: '39 ложных выходов, ~половина положительна'}
    - {tex: '\mathbb{E}\big[(w_i^\top w_j)^2\big] &= \frac{1}{d} = \frac{1}{10}', note: 'дисперсия косинуса из задания 1'}
    - {tex: '\text{энергия эхо} &\approx 39 \cdot \tfrac{1}{2} \cdot \tfrac{1}{10}\, \mathbb{E}[r^2] \approx 1.95\, \mathbb{E}[r^2]', note: 'почти вдвое больше сигнала'}
    - {tex: '\mathrm{NMSE}(b = 0) &\approx 2 \quad (\text{эксперимент: } 1.76)', note: 'отношение не зависит от p'}

- section: Порог — компромисс
  say: >-
    Что делает порог? Вот выходы при одном примере: высокий настоящий сигнал и низкие ложные эхо.
    [+] Поднимаем порог. Всё, что ниже него, становится нулём: эхо исчезают.
    [+] Но и настоящий сигнал уменьшается на b, а слабые настоящие сигналы, ниже порога, пропадают целиком. Слишком высокий порог убивает полезное, слишком низкий пропускает шум. Значит, у ошибки как функции порога есть минимум.
  show: {block: scene, src: 08-threshold.js, scene: cut}

- say: >-
    Ищем этот минимум.
    [+] Функция minimize_scalar из SciPy ищет минимум функции одной переменной на отрезке от нуля до единицы. Метод bounded, ограниченный, ей хватает около двадцати пяти вычислений ошибки, а перебор по сетке из двухсот одной точки потребовал бы двести одно. Это работает, потому что у ошибки как функции порога один минимум.
    [+] На левом графике из ноутбука видна эта форма: ошибка от порога для разных p. Каждая кривая сначала падает, потом растёт, и у каждой свой минимум. Пунктир на единице это уровень модели, которая выдаёт нули.
  show:
  - block: code
    lang: python
    reveal: all
    trace: [[1, 2, 3]]
    src: |
      def find_optimal_threshold(features, directions):
          result = minimize_scalar(lambda threshold: reconstruction_error(features, directions, threshold), bounds=(0.0, 1.0), method="bounded")
          return result.x
  - block: figure
    src: figures/nb25-1.png
    reveal: by-mark
    caption: 'Слева: NMSE от порога $b$ для разных $p$. Справа: $b^*(p)$'
    marks:
    - {at: [0.25, 0.55], text: 'у каждой кривой свой минимум'}

- section: Как растёт оптимальный порог
  say: >-
    Ответ на третий вопрос. Оптимальный порог монотонно растёт с ростом p.
    При p одна сотая он ноль тридцать один, при одной десятой ноль сорок четыре, при одной второй ноль семьдесят восемь.
    Почему? При малом p шум у молчащего признака обычно создаёт один активный сосед, и хватает порога около ноль трёх. С ростом p одновременно горит около M на p признаков, и их эхо складываются. Стандартное отклонение шума растёт как корень из числа активных признаков, делённого на d. Это формула из лекции, и по ней порог должен расти примерно так же.
    Цена этого: при больших p высокий порог срезает уже и многие настоящие сигналы, и модель приближается к тривиальному занулению.
  show:
    block: plot
    data: toy
    x: p
    y: b
    reveal: by-layer
    xlabel: 'вероятность активации $p$'
    ylabel: 'оптимальный порог $b^*$'
    yrange: [0, 1.2]

- section: 'Задача 2.3: ловушка метрики'
  say: >-
    Задача 2.3: построить качество восстановления в зависимости от p. И здесь условие предупреждает о ловушке.
    [+] Если рисовать сырую ошибку MSE, она монотонно растёт.
    [+] Но растёт и сама энергия входа: средняя сумма квадратов признаков равна M на p на одну треть. В эксперименте совпадение идеальное: ноль тысяча триста тридцать семь против ноль тысячи трёхсот тридцати трёх при p одна сотая и шесть шестьсот шестьдесят девять против шести шестисот шестидесяти семи при p одна вторая. Рост MSE ничего не говорит о качестве: сигнала просто стало больше.
  show:
    block: plot
    data: toy
    x: p
    y: [mseb, energy]
    reveal: by-layer
    xlabel: 'вероятность активации $p$'
    ylabel: 'среднее на пример'

- section: Нормированная ошибка
  say: >-
    Правильная метрика это нормированная ошибка, NMSE.
    [+] Делим среднюю ошибку на среднюю энергию признаков. Это относительная ошибка: какую долю энергии сигнала мы потеряли.
    [+] Удобный ориентир: модель, которая всегда выдаёт нули. Её ошибка равна энергии самого сигнала, значит её NMSE ровно единица. Это базовый уровень, baseline. Всё, что ниже единицы, лучше, чем ничего. Всё, что выше, хуже, чем ничего.
  show:
    block: derivation
    lines:
    - {tex: '\mathrm{NMSE}(p) &= \frac{\mathbb{E}\big[\|f - \hat f\|_2^2\big]}{\mathbb{E}\big[\|f\|_2^2\big]}', note: 'доля потерянной энергии сигнала'}
    - {tex: '\hat f_{zero} = 0 \;&\Rightarrow\; \mathrm{NMSE} = \frac{\mathbb{E}\|f\|^2}{\mathbb{E}\|f\|^2} = 1', note: 'baseline: «выдать нули»'}

- section: Кривые NMSE
  say: >-
    Вот кривые нормированной ошибки.
    [+] С нулевым порогом ошибка выше единицы при всех p: хуже нулей, как мы и объяснили.
    [+] С оптимальным порогом ошибка растёт от ноль тридцати семи при p одна сотая до ноль восьмидесяти четырёх при одной второй. Даже в самом разреженном режиме теряется тридцать семь процентов энергии.
    [+] Линия на единице это baseline, модель нулей. С ростом p кривая с оптимальным порогом к ней приближается.
    [+] А линия на ноль девяноста пяти это порог коллапса из следующего пункта задания.
  show:
    block: plot
    data: toy
    x: p
    y: [nmse0, nmseb]
    reveal: by-layer
    fn: [{f: '1 + 0*x', label: 'baseline $\hat f = 0$'}, {f: '0.95 + 0*x', label: 'порог коллапса 0.95'}]
    yrange: [0, 2]
    xlabel: 'вероятность активации $p$'
    ylabel: NMSE

- section: Точка коллапса
  say: >-
    Второй пункт задачи 2.3: найти точку коллапса, то значение p, где NMSE достигает ноль девяноста пяти. Там модель перестаёт превосходить тривиальное зануление.
    [+] У нашей случайной матрицы в диапазоне до одной второй коллапса нет: максимум ноль восемьсот тридцать девять. Это второе расхождение с ожиданием условия.
    [+] Мы продлили сетку до p, равного единице. Коллапса нет и там: ошибка выходит на плато около ноль восьмидесяти пяти. Оптимальный порог растёт примерно до ноль восьмидесяти пяти и пропускает только самые сильные выходы, а они почти всегда настоящие. Поэтому модель чуть-чуть, но лучше нулей.
  show:
    block: figure
    src: figures/nb29-1.png
    reveal: by-mark
    caption: 'NMSE с оптимальным порогом на расширенной сетке $p \in [0.01, 1]$'
    marks:
    - {at: [0.4, 0.4], text: 'до p = 0.5: максимум 0.839'}
    - {at: [0.78, 0.33], text: 'плато ≈ 0.85'}

- section: Ловушка случайной матрицы
  say: >-
    Значит ли это, что коллапса не бывает? Нет. Точка коллапса зависит от того, как именно легли сорок случайных векторов. Поэтому в ноутбуке поиск повторён для двадцати разных случайных матриц.
    [+] Коллапс при p до одной второй у пяти матриц из двадцати. При p до единицы у одиннадцати из двадцати, обычно около ноль пяти — ноль шести. У девяти коллапса нет вовсе.
    [+] И у всех коллапсирующих оптимальный порог упёрся в границу единица из условия: модель хотела бы срезать сильнее, но не может, и ошибка уходит даже выше единицы. Результат зависит от удачи: в каждой случайной матрице есть пары с косинусом ноль восемь — ноль девять, почти одинаковые признаки, которые глушат друг друга. Это и есть ловушка случайной матрицы, о которой говорит задача 2.4.
  show:
    block: figure
    src: figures/nb31-1.png
    reveal: by-mark
    caption: 'NMSE(p) для 20 разных случайных матриц $W_{rand}$'
    marks:
    - {at: [0.6, 0.25], text: 'у разных матриц — разные кривые'}
    - {at: [0.85, 0.12], text: 'выше 0.95: коллапс'}

- section: Вывод к задачам 2.2 и 2.3
  say: >-
    Подведём итог.
    [+] Без порога ReLU пропускает положительную половину интерференции, около двадцати ложных эхо на каждый признак, и ошибка около одной целой семидесяти шести сотых при любом p.
    [+] Оптимальный порог растёт с p, от ноль тридцати одной до ноль семидесяти восьми, потому что шум растёт как корень из числа активных признаков, делённого на d.
    [+] Сырой MSE обманчив, нужен нормированный. С оптимальным порогом NMSE от ноль тридцати семи до ноль восьмидесяти четырёх.
    [+] Коллапс у нашей матрицы не достигнут, а по двадцати матрицам он случается примерно в половине случаев. Случайная упаковка ненадёжна.
  show:
    block: text
    reveal: by-para
    md: |
      - $b = 0$: ~20 ложных эхо на признак, NMSE ≈ 1.76 при любом $p$
      - $b^*$: 0.31 → 0.44 → 0.78 при $p$ = 0.01 → 0.1 → 0.5; шум $\propto \sqrt{k/d}$
      - MSE растёт вместе с $\mathbb{E}\|f\|^2 = Mp/3$; NMSE(b*) от 0.37 до 0.84
      - коллапс: у нашей $W_{rand}$ нет; у 11 из 20 случайных матриц при $p \le 1$

