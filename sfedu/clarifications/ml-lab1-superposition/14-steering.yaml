- section: Идея стиринга
  say: >-
    Четвёртое задание проверяет, чем отличаются нейрон и признак автоэнкодера на деле. Инструмент называется стиринг, то есть руление.
    [+] Во время генерации к вектору residual stream на выбранном слое прибавляем добавку: амплитуду альфа, умноженную на единичный вектор направления v.
    [+] Neuron Steering: v это базисная ось e с номером i, один нейрон.
    [+] Feature Steering: v это направление признака из словаря автоэнкодера.
    [+] Ожидание по теории: нейрон полисемантичен, толчок вдоль него двигает смесь понятий. А признак автоэнкодера моносемантичен и должен вносить одно понятие. В лекции знаменитый пример: Anthropic нашли в модели Claude признак моста Золотые Ворота, и, усилив его, получили модель, которая сводила любой разговор к этому мосту.
  show:
    block: text
    reveal: by-para
    md: |
      $$x_{\text{steered}} = x + \alpha \cdot v, \qquad \|v\|_2 = 1$$

      - **Neuron Steering:** $v = e_i$ — ось одного нейрона
      - **Feature Steering:** $v = d_j / \|d_j\|$ — направление признака SAE
      - ожидание: нейрон — смесь понятий, признак — одно понятие (Golden Gate Claude)

- section: Калибровка силы толчка
  say: >-
    Первая задача: калибровка. Условие запрещает брать произвольные числа вроде плюс пятидесяти, ведь непонятно, много это или мало. Масштаб нужно привязать к типичной длине вектора.
    [+] Меряем среднюю длину вектора на слое три на нейтральных текстах. Нейтральный корпус в ноутбуке: сорок документов из другой половины Pile-10k, только веб-тексты и Википедия, без кода. Позицию ноль снова исключаем. Средняя длина четырнадцать и четыре сотых.
    [+] Сетка альфа от одной десятой до полутора средних длин, пятнадцать значений: от одной целой четырёх десятых до двадцати одной целой одной десятой.
    [+] И главное: v единичный и у нейрона, и у признака. Значит, при одинаковом альфа добавка одной и той же длины. Это честное сравнение: одинаковая мощность воздействия.
  show: {block: scene, src: 14-steering.js, scene: calib}

- section: Хук для стиринга
  say: >-
    Как прибавить добавку во время генерации? Снова хуком на выход слоя три.
    [+] Функция хука прибавляет сдвиг к первому элементу выхода слоя и возвращает новый кортеж. Если хук что-то возвращает, PyTorch подставляет это вместо настоящего выхода. Так добавка попадает во все следующие слои.
    [+] Почему не изменить тензор заранее, до вызова generate? Генерация двадцати пяти токенов это двадцать пять отдельных проходов модели. Правка до generate подействовала бы только на первый проход и первый токен. Хук срабатывает на каждом проходе.
    [+] Генерация жадная: do_sample равно False, на каждом шаге берётся самый вероятный токен. Поэтому результат детерминирован, перезапуск даёт тот же текст. Хук снимается в finally.
  show:
  - {block: scene, src: 14-steering.js, scene: steerloop, size: [800, 900]}
  - block: code
    lang: python
    reveal: all
    trace: [[2, 4, 5, 6, 7, 9], [11, 12, 15], [17, 19, 20]]
    src: |
      def add_steering_hook(direction, alpha):
          shift = alpha * direction

          def add_shift(module, inputs, output):
              if isinstance(output, tuple):
                  return (output[0] + shift,) + output[1:]
              return output + shift

          return target_layer.register_forward_hook(add_shift)

      def generate_with_steering(direction, alpha, new_tokens=25):
          handle = add_steering_hook(direction, alpha)
          try:
              with torch.no_grad():
                  output_ids = language_model.generate(
                      prompt_ids, attention_mask=torch.ones_like(prompt_ids),
                      max_new_tokens=new_tokens, do_sample=False,
                      pad_token_id=tokenizer.eos_token_id)
          finally:
              handle.remove()
          return tokenizer.decode(output_ids[0, prompt_ids.shape[1]:])

- section: KV-кэш и формы тензоров
  say: >-
    Условие отдельно предупреждает о формах тензоров. Посмотрим, что видит хук.
    [+] На первом проходе модель обрабатывает весь промпт, двенадцать токенов. Тензор на слое: один на двенадцать на пятьсот двенадцать.
    [+] На следующих шагах модель обрабатывает только один новый токен. Ключи и значения внимания для предыдущих токенов она уже посчитала и хранит в кэше, его называют KV-кэшем. Тензор один на один на пятьсот двенадцать.
    [+] Наш сдвиг имеет форму просто пятьсот двенадцать. По правилам бродкастинга он прибавляется к каждому вектору и в той, и в другой форме, поэтому один и тот же хук работает на всех шагах. В ноутбуке формы проверены отдельным хуком: один на двенадцать на пятьсот двенадцать, затем три раза один на один на пятьсот двенадцать.
  show: {block: scene, src: 14-steering.js, scene: kvcache}

- section: 'Эксперимент А: нейрон 42'
  say: >-
    Эксперимент А. Берём базисную ось нейрона сорок два и генерируем продолжение фразы «In the middle of the room there was a large table with», двадцать пять новых токенов. Базовая модель без воздействия пишет: «a large table and a large table with a large table», и дальше «I'm not sure what you're talking about». Маленькая модель и сама склонна к повторам.
    [+] При слабом толчке, три десятых длины вектора, текст остаётся грамматичным английским, но съезжает: «a table on which to sit and wait».
    [+] При половине длины: «a table on which to hold a chair», с повтором. Новой темы нет, модель продолжает про стол и комнату.
    [+] При девяти десятых: «held on to the door». Модель путается в грамматике, «to held».
    [+] При сильном толчке, от длины вектора и выше, начинается дегенерация: «gated on the» и дальше одни переносы строк.
  show:
    block: table
    reveal: by-row
    cols: ['$\alpha / \|x\|$', 'текст (Neuron Steering, $e_{42}$)', 'уникальных токенов']
    rows:
    - ['0 (база)', 'a large table and a large table with a large table.⏎⏎"I''m not sure what you''re talking about,', '0.72']
    - ['0.3', 'a table on which to sit and wait.⏎⏎The table was covered with a small plate of paper…', '0.72']
    - ['0.5', 'a table on which to hold a chair and a table on which to hold a chair.⏎⏎The table was covered by', '0.56']
    - ['0.9', 'a large plate on which to held on to the door, which was held on to the door…', '0.52']
    - ['1.2–1.5', '⏎gated on the⏎⏎⏎⏎⏎⏎⏎⏎⏎⏎…', '0.86']

- section: Доля уникальных токенов
  say: >-
    В последнем столбце простая метрика, доля уникальных токенов среди новых. Если модель зацикливается и повторяет одно и то же, доля падает. Например, при двух десятых длины модель выдала «a large table with» шесть раз подряд, и доля упала до ноль шестнадцати. А при дегенерации в переносы строк доля, наоборот, высокая, ноль восемьдесят шесть: токенов мало, всего семь, и почти все разные. Поэтому метрику читают вместе с самим текстом.

- section: Ответы к эксперименту А
  say: >-
    Ответы на вопросы задания к эксперименту А.
    [+] Удаётся ли интерпретировать тему текста? Нет. Новой темы толчок вдоль нейрона не вносит.
    [+] Полисемантичность или дегенерация? Хаотичного переключения между темами нет. Наблюдается постепенная потеря связности, переходящая в дегенерацию.
    [+] Где же тогда полисемантичность? Она видна не в тексте, а в том, какие токены нейрон делает вероятнее. Это мы посчитаем в контрольных заданиях: епископ, Пенс, Байден, сенаторы, помилование, химическое вещество EDTA, обрывки вроде gio. Несвязанные темы сразу. Толчки в разные стороны гасят друг друга, и модель не переключается ни на одну тему. Ровно как в лекции: значение нейрона складывается из проекций многих признаков, и толкать вдоль оси нейрона значит понемногу толкать их все.
  show:
    block: text
    reveal: by-para
    md: |
      - **тема:** не интерпретируется, новой темы нет
      - **поведение:** не переключение тем, а потеря связности → дегенерация при $\alpha \ge \|x\|$
      - **полисемантичность** — в продвигаемых токенах: `bishop`, `Pence`, `Biden`, `senators`, `pardon`, `EDTA`, `gio`…

