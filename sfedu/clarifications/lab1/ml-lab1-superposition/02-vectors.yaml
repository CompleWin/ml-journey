- section: Вектор
  say: >-
    Начнём с азбуки, без неё дальше никак. Вектор это просто упорядоченный список чисел.
    [+] Например, три и четыре.
    [+] Его удобно рисовать стрелкой из начала координат: три шага вправо и четыре вверх. Числа в списке называются координатами вектора.
  show: {block: scene, src: 02-vectors.js, scene: vec2d, id: plane}

- section: Размерность
  say: >-
    Сколько чисел в списке, такова размерность пространства. Её обозначают буквой d. У нашей стрелки d равно двум, это плоскость.
    [+] Три числа дают привычное трёхмерное пространство.
    [+] А дальше нарисовать уже нельзя, но считать можно точно так же. В модели Pythia каждый токен описан вектором из пятисот двенадцати чисел, значит d равно пятистам двенадцати. В первом задании встретится и d, равное четырём тысячам девяноста шести. Запись «x принадлежит R в степени d» означает: x это список из d вещественных чисел.
  show: {block: scene, src: 02-vectors.js, scene: dims}

- section: Длина вектора
  say: >-
    Длину стрелки находим по теореме Пифагора. Катеты три и четыре.
    [+] Корень из суммы квадратов: три в квадрате девять, четыре в квадрате шестнадцать, вместе двадцать пять, корень из двадцати пяти равен пяти.
    [+] В d измерениях всё то же самое: возводим в квадрат каждую координату, складываем и извлекаем корень. Такая длина называется евклидовой нормой, или L2-нормой. Пишут её двумя вертикальными чертами с маленькой двойкой внизу.
  show: {block: scene, src: 02-vectors.js, scene: plane2, id: plane2}

- section: Нормировка и единичная сфера
  say: >-
    Часто нам важна не длина вектора, а только его направление. Тогда вектор делят на его длину.
    [+] Три и четыре делим на пять, получаем ноль шесть и ноль восемь. Направление то же, а длина стала равна единице.
    [+] Все векторы длины один образуют окружность радиуса один. В пространстве размерности d это единичная сфера. Её обозначают S с индексом d минус один. Минус один потому, что сама поверхность на одно измерение тоньше пространства: окружность это линия на плоскости.
    [+] Такая операция называется нормировкой. В лабе она встречается постоянно: прежде чем сравнивать направления, векторы приводят к единичной длине.
  show: {use: plane2, scene: unit}

- section: Скалярное произведение
  say: >-
    Теперь главная операция всей работы, скалярное произведение двух векторов. Возьмём u: один, два, ноль, минус один. И v: два, ноль, три, один.
    [+] Перемножаем координаты попарно: один на два это два, два на ноль ноль, ноль на три ноль, минус один на один минус один.
    [+] И складываем: два плюс ноль плюс ноль минус один, получается один. Это и есть скалярное произведение. Его пишут в угловых скобках: u, v.
  show: {block: scene, src: 02-vectors.js, scene: dotcalc}

- say: >-
    Запишем в общем виде.
    [+] Скалярное произведение это сумма произведений соответствующих координат по всем d координатам.
    [+] А если умножить вектор сам на себя, получится сумма квадратов, то есть квадрат длины. Отсюда видно, что длина и скалярное произведение тесно связаны.
  show:
    block: derivation
    lines:
    - {tex: '\langle u, v \rangle &= u_1 v_1 + u_2 v_2 + \dots + u_d v_d = \sum_{i=1}^{d} u_i v_i', note: 'попарные произведения, сложенные вместе'}
    - {tex: '\langle x, x \rangle &= x_1^2 + \dots + x_d^2 = \|x\|_2^2', note: 'вектор на себя — квадрат длины'}

- section: Косинус угла
  say: >-
    У скалярного произведения есть геометрический смысл: оно равно длине первого вектора, умноженной на длину второго и на косинус угла между ними.
    [+] Для векторов длины один остаётся только косинус. Поэтому скалярное произведение нормированных векторов называют косинусным сходством. Оно показывает, насколько похожи направления.
    [+] Если векторы смотрят в одну сторону, косинус равен единице.
    [+] Если они перпендикулярны, косинус равен нулю.
    [+] Если смотрят в противоположные стороны, минус единице. Запомни эту шкалу: от минус одного до одного.
  show: {block: scene, src: 02-vectors.js, scene: cos}

- section: Ортогональность и базис
  say: >-
    Векторы с нулевым скалярным произведением называют ортогональными, то есть перпендикулярными. Вот две оси плоскости: e один и e два.
    [+] На плоскости можно выбрать только два взаимно перпендикулярных направления, в трёхмерии три, а в пространстве размерности d ровно d. Это оси координат, их называют базисом. У вектора e с номером i единица стоит на i-м месте, а остальные координаты нули.
    [+] Запомни две вещи. В задании четыре отдельный нейрон модели это как раз такая ось e с номером i. А главный сюрприз первого задания: почти перпендикулярных направлений в большой размерности бывает гораздо больше, чем d.
  show: {block: scene, src: 02-vectors.js, scene: basis}

- section: Матрица — стопка векторов
  say: >-
    Когда векторов много, их складывают в матрицу, то есть в таблицу чисел. Матрицу из M строк и d столбцов записывают так: X принадлежит R в степени M на d.
    [+] В нашей лабе каждая строка матрицы это отдельный вектор. Операция вдоль строки в NumPy задаётся параметром axis, равным единице.
    [+] А столбец это одна и та же координата у всех векторов. Операция вдоль столбца задаётся параметром axis, равным нулю. Например, среднее по столбцам даёт средний вектор всего облака. Он понадобится, когда будем убирать паразитный конус.
  show: {block: scene, src: 02-vectors.js, scene: matrix}

- section: Построчные операции в коде
  say: >-
    Вот как это выглядит в коде.
    [+] Первая строка создаёт матрицу из M строк по d случайных чисел, то есть сразу M случайных векторов.
    [+] Вторая считает длину каждой строки. axis, равный единице, значит «вдоль строки». keepdims оставляет результат столбцом размера M на один, иначе NumPy не поймёт, как делить.
    [+] Третья делит каждую строку на её собственную длину. Столбец длин как бы растягивается на всю ширину матрицы, это называется бродкастингом. Все векторы становятся единичными.
    [+] Четвёртая перемножает две такие матрицы поэлементно и складывает по строкам. Получается M скалярных произведений сразу, без единого цикла. Это и есть векторизация, которую требует условие: одна команда над целым массивом.
  show:
  - {block: scene, src: 02-vectors.js, scene: rowops, size: [800, 900]}
  - block: code
    lang: python
    reveal: all
    trace: [1, 2, 3, 4]
    src: |
      X = rng.standard_normal((M, d))
      norms = np.linalg.norm(X, axis=1, keepdims=True)
      U = X / norms
      s = np.sum(U * V, axis=1)

- say: Проверим.
  quiz: {q: 'Чему равна длина вектора $(6, 8)$?', answer: 10, tol: 0.01, hint: 'Корень из суммы квадратов координат.', explain: '$\sqrt{36 + 64} = \sqrt{100} = 10$.'}

- say: И ещё один вопрос.
  quiz:
    q: Скалярное произведение двух единичных векторов равно нулю. Что это значит?
    options:
    - {text: 'Векторы совпадают', why: 'Для совпадающих единичных векторов скалярное произведение равно 1.'}
    - 'Векторы перпендикулярны'
    - {text: 'Один из векторов нулевой', why: 'Единичный вектор не бывает нулевым: его длина 1.'}
    answer: 2
    explain: Для единичных векторов скалярное произведение — это косинус угла, а косинус равен нулю при 90°.
