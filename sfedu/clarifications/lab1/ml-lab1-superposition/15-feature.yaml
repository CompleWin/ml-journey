- section: 'Эксперимент Б: что ищем'
  say: >-
    Эксперимент Б. Нужно найти в словаре автоэнкодера латент, который кодирует одну узкую вещь. Мы искали «программный синтаксис и скобки».
    [+] Проверочный набор: двадцать шесть предложений. Двенадцать похожи на код и полны скобок, четырнадцать обычные английские фразы про погоду, музей, рецепт.
    [+] Прогоняем их через Pythia до третьего слоя и через энкодер автоэнкодера. Всего триста двадцать шесть токенов, из них тридцать шесть целевых, то есть содержащих открывающую скобку: круглую, фигурную или квадратную.
    [+] Условие специфичности из задания. Средняя активация латента на целевых токенах должна быть заметно больше нуля. А на остальных токенах латент должен молчать в девяноста девяти процентах случаев.
  show:
    block: text
    reveal: by-para
    md: |
      - 26 предложений: 12 «кодовых» (`def compute(x, y): …`, `for (int i = 0; …) { … }`) и 14 обычных
      - 326 токенов, из них 36 целевых: `(`, `{`, `[`
      - условие: $\;\mathbb{E}[f_j(x_{\text{target}})] \gg 0$
      - и $\;f_j(x_{\text{neutral}}) = 0$ на 99% остальных токенов

- section: Поиск кандидатов
  say: >-
    Код поиска.
    [+] Для каждого латента считаем среднюю активацию на скобках, долю скобок, где он сработал, и долю остальных токенов, где он сработал.
    [+] Специфичным считаем латент, который срабатывает не больше чем на одном проценте нецелевых токенов. Оценка латента это средняя активация на скобках, умноженная на признак специфичности. Неспецифичные получают ноль.
    [+] Берём пять лучших по оценке.
  show:
    block: code
    lang: python
    reveal: all
    trace: [[1, 2, 3], [4, 5], 6]
    src: |
      mean_on_targets = probe_latents[is_target_token].mean(dim=0)
      firing_rate_on_targets = (probe_latents[is_target_token] > 0).float().mean(dim=0)
      firing_rate_on_neutral = (probe_latents[~is_target_token] > 0).float().mean(dim=0)
      is_specific = firing_rate_on_neutral <= 0.01
      specificity_score = mean_on_targets * is_specific
      candidates = torch.topk(specificity_score, 5).indices

- say: >-
    Пять кандидатов.
    Лидер, латент тысяча восемьсот девяносто два: средняя активация на скобках ноль семьсот семнадцать, сработал на шестидесяти четырёх процентах скобок и только на трёх десятых процента остальных токенов. Условие выполнено.
    Остальные кандидаты заметно слабее: средняя активация от ноль двадцати семи до ноль десяти. Выбираем тысяча восемьсот девяносто второй.
  show:
    block: table
    reveal: all
    highlight: [1]
    cols: ['латент j', 'среднее $f_j$ на скобках', 'доля скобок, где $f_j > 0$', 'доля остальных, где $f_j > 0$']
    rows:
