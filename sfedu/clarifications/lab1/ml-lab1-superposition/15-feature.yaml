    [+] Три — четыре десятых: цикл «a large table with a large table with».
    [+] Половина — семь десятых: «a large square square square». Восемь десятых: «drawing from the floor» и ряд кавычек.
    [+] От девяти десятых и дальше несвязные символы: «e0e0e0», «MegNiNiNi», «erefieeee».
