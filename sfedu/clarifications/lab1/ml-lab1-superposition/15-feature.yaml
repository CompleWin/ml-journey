    - ['34', '0.189', '0.306', '0.0034']
    - ['503', '0.107', '0.194', '0.0069']
    - ['176', '0.105', '0.111', '0.0000']

- section: Топ-5 активаций
  say: >-
    Условие предупреждает: если выбрать латент по максимальной активации на одном предложении, легко ошибиться и взять «пунктуацию вообще» или латент плотности текста. Поэтому нужно посмотреть топ-5 токенов, на которых латент срабатывает сильнее всего. Смотрим на отложенной выборке, на шестидесяти трёх тысячах токенов, которых автоэнкодер не видел.
    [+] Первое место, активация три целых семьдесят восемь сотых: «Partnership Project, скобка, 3GPP».
    [+] «Luteinizing hormone, скобка, LH».
    [+] «Body mass index, скобка, BMI».
    [+] «Growth factor beta 1, скобка, TGF-beta».
    [+] «American Society for Reproductive Medicine, скобка, ASRM». Все пять это открывающая круглая скобка с пробелом, и каждый раз перед сокращением. Узкое понятие: открывающая скобка перед аббревиатурой или уточнением.
  show:
    block: table
    reveal: by-row
    cols: ['$f_j$', 'контекст, ⟦токен⟧']
    rows:
    - ['3.78', '…generation of mobile communication technology for the 3rd Generation Partnership Project⟦ (⟧3GPP)…']
    - ['3.68', '…opioid antagonist naltrexone can increase luteinizing hormone⟦ (⟧LH) and follic…']
    - ['3.67', '…phantom with a body mass index⟦ (⟧BMI) of approximately…']
    - ['3.55', '…bFGF-2), and transforming growth factor beta 1⟦ (⟧TGF-beta…']
    - ['3.55', '…American Society for Reproductive Medicine⟦ (⟧ASRM)⏎…']

- section: Точность и полнота
  say: >-
    Насколько латент чистый? Две меры из классификации.
    [+] Точность: из всех токенов, где латент сработал, какая доля действительно скобки. Полнота: из всех скобок, какая доля включила латент.
    [+] Если считать любое срабатывание, больше нуля, точность всего ноль сорок семь: латент иногда слабо срабатывает на переносе строки, точке, запятой.
    [+] Но точность быстро растёт с силой активации. Больше единицы: девяносто пять процентов срабатываний это скобки.
    [+] Больше полутора: девяносто девять и семь десятых процента. А полнота при этом падает: сильно латент реагирует не на каждую скобку, а именно на скобку перед сокращением.
    [+] Вывод: латент моносемантичен в своём рабочем диапазоне. Слабый хвост это остаточная интерференция, ведь автоэнкодер учился всего на шестидесяти четырёх тысячах токенов. Естественный диапазон активации: медиана ноль восемьдесят три, максимум три целых семьдесят восемь сотых. Это пригодится при стиринге.
  show:
  - {block: scene, src: 15-feature.js, scene: precision, size: [800, 900]}
  - block: table
    reveal: by-row
    cols: [условие, 'доля токенов', 'точность: доля скобок среди срабатываний', 'полнота: доля скобок, где сработал']
    rows:
    - ['$f_j > 0$', '1.8%', '0.474', '0.692']
    - ['$f_j > 0.5$', '1.5%', '0.586', '0.691']
    - ['$f_j > 1.0$', '0.8%', '**0.948**', '0.592']
    - ['$f_j > 1.5$', '0.5%', '**0.997**', '0.429']
    - ['$f_j > 2.0$', '0.3%', '1.000', '0.241']

- section: 'Эксперимент В: стиринг вдоль признака'
  say: >-
    Эксперимент В. Берём направление признака тысяча восемьсот девяносто два в словаре декодера.
    [+] В условии матрица декодера записана как d на D, и направление это её столбец. В нашем коде матрица хранится транспонированной, D на d, поэтому это строка. Мы берём её из нормированного декодера, так что длина уже единица.
    [+] Косинус между направлением признака и осью нейрона сорок два минус ноль ноль двадцать семь. Направления почти перпендикулярны, как и положено двум случайным направлениям в размерности пятьсот двенадцать по первому заданию.
    [+] Самая большая координата направления признака по модулю ноль двадцать две, а у оси нейрона одна координата равна единице. Признак размазан по многим нейронам, а не сидит в одном. Это и есть суперпозиция вживую.
  show: {block: scene, src: 15-feature.js, scene: featvec}

- say: >-
