- section: Обученная против случайной
  say: >-
    Результат обучения. Кривая обученной модели поверх кривой случайной.
    [+] Случайная схема с оптимальным порогом, мы её уже видели.
    [+] Обученная лучше в разы при тех же d и M. Ноль одиннадцать против ноль тридцати семи при p одна сотая. Ноль двадцать пять против ноль пятидесяти трёх при пяти сотых. Ноль тридцать восемь против ноль шестидесяти четырёх при одной десятой. Ноль сорок восемь против ноль семидесяти пяти при двух десятых. До коллапса она не доходит нигде.
    [+] Странная деталь: после p две десятых ошибка обученной модели даже немного падает, до ноль сорока трёх при одной второй. Значит, модель меняет стратегию. Разберёмся, какую, по матрицам Грама.
  show:
    block: plot
    data: toy
    x: p
    y: [nmseb, nmset]
    reveal: by-layer
    fn: [{f: '1 + 0*x', label: 'baseline $\hat f = 0$'}]
    yrange: [0, 1.1]
    xlabel: 'вероятность активации $p$'
    ylabel: NMSE

- section: Матрицы Грама
  say: >-
    Вот матрицы Грама из ноутбука: случайная схема и обученные при разных p. Красное положительная интерференция, синее отрицательная, белое ноль.
    [+] У случайной матрицы пятна обоих цветов вперемешку.
    [+] У обученных при малых p красного почти нет, а синего много.
    [+] А при p от трёх десятых картина совсем другая: половина матрицы белая, и видны тёмно-синие пятна. Разберём оба режима.
  show:
    block: figure
    src: figures/nb36-1.png
    reveal: by-mark
    caption: 'Матрица Грама $G = W^\top W$: случайная $W$ и обученные при $p$ = 0.01 … 0.5'
    marks:
    - {at: [0.13, 0.28], text: 'случайная'}
    - {at: [0.36, 0.28], text: 'p = 0.01: почти нет красного'}
    - {at: [0.6, 0.72], text: 'p ≥ 0.3: половина выключена'}

- section: 'Режим p ≤ 0.1: суперпозиция'
  say: >-
    Режим малых p, до одной десятой, это настоящая суперпозиция. Все сорок признаков живы, длина каждого направления единица.
    [+] Модель сама расположила векторы так, что положительная интерференция маленькая: максимум ноль двадцать одна — ноль двадцать три. Это того же порядка, что и выученный порог, ноль пятнадцать — ноль двадцать шесть. Значит, положительные эхо срезаются порогом.
    [+] А отрицательная интерференция большая, до минус ноль пятидесяти семи. И это не страшно. Отрицательный отклик ReLU всё равно превращает в ноль. Отрицательная интерференция бесплатна.
    [+] Вот трюк обучения: раз за отрицательные косинусы платить не надо, модель «прячет» тесноту в них, а положительные косинусы держит ниже порога. Случайная схема так не умеет: у неё положительные косинусы доходят до ноль восьми.
  show: {block: scene, src: 10-geometry.js, scene: freeneg}

- section: Жёсткий фрейм
  say: >-
    Ещё одна проверка геометрии: собственные числа матрицы W на W транспонированное, размером десять на десять. Собственное число показывает, сколько энергии всех направлений признаков приходится на соответствующую ось пространства. Их сумма равна сумме квадратов длин всех направлений, то есть сорока. Значит, в среднем на ось приходится сорок делить на десять, четыре.
    [+] У случайной схемы собственные числа разбросаны от одной целой тридцати восьми сотых до семи целых трёх десятых. Одни оси перегружены признаками, другие почти пусты. Такой разброс для случайных матриц предсказывает закон Марченко — Пастура из лекции тридцать.
    [+] У обученной модели при малых p все десять собственных чисел почти равны четырём: от трёх целых восьмидесяти восьми сотых до четырёх целых шестнадцати сотых. Сорок векторов равномерно накрывают все десять измерений, ни одна ось не перегружена. Такую конструкцию называют жёстким фреймом.
  show: {block: scene, src: 10-geometry.js, scene: eig}

- section: 'Режим p ≥ 0.3: антиподальные пары'
  say: >-
    Теперь большие p. При двух десятых переходный режим: тридцать один признак жив, девять выключены, длина их направлений ушла почти в ноль. Вот где пригодился шар вместо сферы.
    [+] А при p от трёх десятых живы ровно двадцать признаков. Они образуют десять пар, в каждой два направления смотрят строго в противоположные стороны, косинус минус единица. Это антиподальные пары.
    [+] Все остальные пары перпендикулярны. В ноутбуке почти ортогональных пар сто восемьдесят: из двадцати признаков можно составить сто девяносто пар, минус десять антиподальных. А W на W транспонированное почти равно двум единичным матрицам: каждое из десяти измерений хранит ровно два признака.
  show:
    block: figure
    src: figures/nb37-1.png
    reveal: by-mark
    caption: 'Упорядоченные матрицы Грама: $p$ = 0.01, 0.2, 0.5'
    marks:
    - {at: [0.5, 0.75], text: 'p = 0.2: 31 живой'}
    - {at: [0.83, 0.3], text: 'p = 0.5: 10 пар wᵢ ≈ −wⱼ'}

- say: >-
    Как два признака живут на одной оси? Благодаря ReLU.
    [+] Признак i записывается вдоль направления w, а его пара j вдоль минус w. Скрытое значение это f i минус f j.
    [+] Если горит только i, на выходе i получаем ReLU от f i, то есть точно f i. А выход j получает минус f i, и ReLU его обнуляет.
    [+] Если горит только j, всё симметрично. Ошибка появляется, только когда горят оба сразу, и то частично. Положительной интерференции нет совсем: максимум около трёх сотых.
  show: {block: scene, src: 10-geometry.js, scene: antipodal}

- section: Почему модель меняет стратегию
  say: >-
    Почему при больших p модель выбирает такую стратегию? Когда признаки часто горят одновременно, интерференция в суперпозиции становится слишком дорогой. Выгоднее идеально хранить двадцать признаков и пожертвовать остальными двадцатью, чем плохо хранить все сорок. Поэтому ошибка при больших p даже снижается: модель отказалась от суперпозиции. На графике норм направлений это видно напрямую: при p одна сотая все сорок длин единичные, при одной второй половина ушла в ноль.
  show:
    block: figure
    src: figures/nb37-2.png
    reveal: all
    caption: 'Длины направлений $\|w_i\|$ при $p$ = 0.01, 0.2, 0.5'

- section: Сводная таблица геометрии
  say: >-
    Сводная таблица из ноутбука, удобно держать перед глазами на защите. Число живых признаков, антиподальные пары, наибольшая положительная и наименьшая отрицательная интерференция, средний выученный порог и разброс собственных чисел.
  show:
    block: table
    reveal: all
    cols: [величина, 'W_rand', 'p = 0.01', 'p = 0.1', 'p = 0.2', 'p = 0.3', 'p = 0.5']
    rows:
    - ['живых признаков', '40', '40', '40', '31', '20', '20']
    - ['антиподальных пар', '0', '0', '0', '0', '10', '10']
    - ['макс. положит. интерференция', '0.81', '0.21', '0.23', '0.37', '0.015', '0.026']
    - ['мин. интерференция', '−0.76', '−0.57', '−0.57', '−0.85', '−1.00', '−0.95']
    - ['средний порог b живых', '—', '0.15', '0.26', '0.15', '−0.02', '−0.10']
    - ['собств. числа WWᵀ', '1.38 … 7.30', '3.88 … 4.16', '3.85 … 4.15', '2.61 … 3.08', '1.96 … 2.04', '1.82 … 1.92']

- section: Вывод к задаче 2.4
  say: >-
    Вывод.
    [+] Обученная модель в разы лучше случайной и не коллапсирует ни при каком p.
    [+] При разреженных признаках это суперпозиция: все сорок признаков живы, положительная интерференция ниже порога, отрицательная бесплатна, собственные числа равны четырём, жёсткий фрейм.
    [+] При плотных признаках модель уходит от суперпозиции: двадцать признаков в десяти антиподальных парах, остальные выключены.
    [+] Это ровно картина из статьи «Игрушечные модели суперпозиции» Эльхаге и соавторов: при разреженных признаках сеть упаковывает больше направлений, чем измерений, а при плотных возвращается почти к одному признаку на измерение, здесь к двум через антиподальный трюк.
  show:
    block: text
    reveal: by-para
    md: |
      - обученная $W$: NMSE 0.11 / 0.25 / 0.38 / 0.48 против 0.37 / 0.53 / 0.64 / 0.75 у случайной
      - $p \le 0.1$: 40 живых, положит. интерференция $\le 0.23 \approx b$, отрицательная бесплатна, $\lambda(WW^\top) \approx 4 = M/d$
      - $p \ge 0.3$: 20 живых, 10 пар $w_i \approx -w_j$, $WW^\top \approx 2I$
      - Elhage et al., 2022: разреженность включает суперпозицию

- say: Проверка.
  quiz:
    q: Почему отрицательная интерференция «бесплатна» для модели с ReLU?
    options:
    - {text: 'Потому что она всегда маленькая', why: 'Она бывает большой: до −0.57 при p = 0.01.'}
    - 'Отрицательный отклик ReLU превращает в ноль, ложного выхода не возникает'
    - {text: 'Потому что порог b отрицательный', why: 'При малых p выученный порог положительный: 0.15–0.26.'}
    answer: 2
    explain: 'Неактивный признак получает отрицательную добавку, ReLU даёт 0 — ошибки нет.'

- say: И ещё.
  quiz: {q: 'Чему равно среднее собственное число $WW^\top$ при $M = 40$ единичных столбцах в $d = 10$?', answer: 4, tol: 0.01, hint: 'Сумма собственных чисел — след $WW^\top$, то есть $\sum \|w_i\|^2$.', explain: '$40 / 10 = 4$. У обученной модели при малых $p$ все они ≈ 4.'}
