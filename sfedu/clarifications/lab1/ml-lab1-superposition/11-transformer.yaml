- section: Что требует задание 3
  say: >-
    Задание третье. Мы поняли, что модель упаковывает признаки в суперпозицию. Теперь инструмент, который их распаковывает: разреженный автоэнкодер.
    [+] В условии дан прототип Top-K автоэнкодера, который перехватывает внутренние векторы третьего слоя модели Pythia. Размерность вектора пятьсот двенадцать, словарь две тысячи сорок восемь понятий, одновременно включено тридцать два.
    [+] В коде три критические ошибки, из-за которых модель коллапсирует. По условию объяснённая дисперсия не поднимается выше пятидесяти — шестидесяти процентов, а больше сорока процентов признаков становятся «мёртвыми».
    [+] Нужно оптимально запрограммировать обучение на процессоре, тысяча шагов по шестьдесят четыре вектора. Замерить две метрики за последние пятьсот шагов. И исправить класс так, чтобы объяснённая дисперсия была не меньше восьмидесяти процентов, а мёртвых не больше пяти процентов.
  show:
    block: text
    reveal: by-para
    md: |
      - Top-K SAE на residual stream слоя 3 Pythia-70m: $d = 512$, $D = 2048$, $K = 32$
      - в коде **3 ошибки**: EV ≤ 50–60%, мёртвых > 40%
      - обучение на CPU: 1000 шагов, `batch_size = 64`; метрики за последние 500 шагов
      - цель: **EV ≥ 80%**, **Dead Latents ≤ 5%** (не больше ~100 из 2048)

- section: Residual stream
  say: >-
    Сначала что такое residual stream, по-русски остаточный поток. Это главный канал трансформера.
    [+] У каждого токена есть вектор из пятисот двенадцати чисел. Он едет через все слои модели, как по конвейеру.
    [+] Каждый слой ничего не заменяет, а только считывает этот вектор и прибавляет к нему свою добавку. В слое два блока. Attention, внимание, позволяет токену заглянуть в предыдущие токены и взять у них информацию. MLP обрабатывает вектор каждого токена отдельно, как маленькая нейросеть.
    [+] Получается формула: вектор после слоя равен вектору до слоя плюс добавка внимания плюс добавка MLP. В Pythia-70m шесть слоёв, а мы будем перехватывать поток после слоя с номером три, примерно в середине модели.
  show: {block: scene, src: 11-transformer.js, scene: stream}

- section: Нейрон — это ось
  say: >-
    В residual stream нейроном называют одну координату вектора, то есть его проекцию на базисную ось e с номером k. Почему отдельные нейроны трудно понять?
    [+] Вспомним суперпозицию: вектор это сумма направлений активных признаков с их силами.
    [+] Значение нейрона k это скалярное произведение оси с этой суммой, то есть сумма по всем признакам: сила признака, умноженная на его проекцию на ось.
    [+] Проекции на ось не равны нулю у огромного числа направлений признаков. Значит, нейрон реагирует на любой признак, у которого проекция положительна. Это полисемантичность: один нейрон срабатывает на совершенно несвязанные вещи. В лекции пример: имя Юлия Цезаря, строка кода init в Python и описание кимчи.
  show:
    block: derivation
    lines:
    - {tex: 'x &= \sum_{j} f_j\, w_j', note: 'суперпозиция признаков'}
    - {tex: 'x_k = \langle e_k, x \rangle &= \sum_{j} f_j\, \langle e_k, w_j \rangle', note: 'нейрон k — проекция на ось e_k'}
    - {tex: '\langle e_k, w_j \rangle &\ne 0 \ \text{для многих}\ j', note: 'нейрон слышит много признаков сразу: полисемантичность'}

- say: >-
    Картинка того же.
    [+] Ось нейрона k и направления трёх разных признаков. Ни одно не совпадает с осью.
    [+] Но у каждого есть положительная проекция на ось. Поэтому нейрон загорается и на Цезаря, и на код, и на кимчи. Изучать такой нейрон в отрыве от остальных бесполезно.
    [+] Лекция приводит аналогию со светом. Если смотреть на цветную картинку через два случайно повёрнутых чёрно-белых датчика, ярко-красный и ярко-зелёный могут дать одинаковый отклик. Нужно перейти от случайных осей прибора к правильным цветовым осям. Для языковых моделей таким переходом служат разреженные автоэнкодеры.
  show: {block: scene, src: 11-transformer.js, scene: poly}

- section: Автоэнкодер
  say: >-
    Что такое автоэнкодер? Это нейросеть, которая учится повторять свой вход на выходе, пропуская его через промежуточный код.
    [+] Энкодер превращает вектор x в код. В нашем случае код шире входа: две тысячи сорок восемь чисел вместо пятисот двенадцати. Это переполненный словарь.
    [+] Но код разреженный: включены только тридцать два числа из двух тысяч сорока восьми, остальные нули.
    [+] Декодер собирает приближение x с крышкой как сумму тридцати двух направлений словаря, каждое умножено на силу. Если словарь удачный, каждое его направление это один понятный признак. Такие признаки называют моносемантичными, а элементы кода латентами.
  show: {block: scene, src: 11-transformer.js, scene: sae}

- section: Формулы SAE
  say: >-
    Формулы автоэнкодера из лекции и из условия.
    [+] Энкодер: из x вычитаем вектор b dec, умножаем на матрицу энкодера, прибавляем порог b enc и применяем ReLU. Строки матрицы энкодера это детекторы признаков. b dec центрирует вход: вычитает средний вектор активаций. b enc это обучаемые пороги отсечения шума интерференции.
    [+] Декодер: сумма направлений словаря d i с силами f i, плюс b dec обратно. Направления словаря это столбцы матрицы декодера, и по лекции они должны иметь единичную длину.
    [+] Отношение размера словаря к размерности модели называют коэффициентом расширения. У нас две тысячи сорок восемь делить на пятьсот двенадцать, четыре. В больших моделях берут в шестнадцать и тридцать два раза.
  show:
    block: derivation
    lines:
    - {tex: 'f(x) &= \mathrm{ReLU}\big(W_{enc}(x - b_{dec}) + b_{enc}\big)', note: 'энкодер: детекторы признаков, пороги b_enc'}
    - {tex: '\hat x &= W_{dec}\, f(x) + b_{dec} = \sum_{i=1}^{D} f_i(x)\, d_i + b_{dec}, \quad \|d_i\|_2 = 1', note: 'декодер: сумма направлений словаря'}
    - {tex: 'D / d &= 2048 / 512 = 4', note: 'коэффициент расширения'}

- section: L1 или Top-K
  say: >-
    Как заставить код быть разреженным? Есть два способа.
    [+] Классический, с L1-штрафом. К ошибке восстановления прибавляют лямбда, умноженную на сумму активаций. Штраф давит на каждую активацию с постоянной силой, и модель учится выключать лишнее. Но у него дефект, усадка: даже сильные настоящие признаки систематически занижаются. И коэффициент лямбда приходится подбирать.
    [+] Top-K, предложенный OpenAI в две тысячи двадцать четвёртом году. Просто оставляем K самых больших предактиваций, а остальные зануляем. Разреженность задана жёстко, штрафа нет, в функции потерь только ошибка восстановления. Нет ни лямбды, ни усадки.
  show:
    block: compare
    reveal: by-side
    titles: ['L1-SAE (Anthropic, 2023)', 'Top-K SAE (OpenAI, 2024)']
    left: |
      $\mathcal{L} = \|x - \hat x\|^2 + \lambda \sum_i |f_i|$

      - разреженность через штраф
      - **усадка**: сильные признаки занижаются
      - нужно подбирать $\lambda$
    right: |
      $f = \mathrm{TopK}(\cdot,\ K)$, $\;\mathcal{L} = \|x - \hat x\|^2$

      - ровно $K$ активных на вектор
      - нет усадки
      - нет $\lambda$

- say: >-
    Как работает Top-K на одном векторе.
    [+] Энкодер выдал две тысячи сорок восемь предактиваций, здесь показаны сорок из них.
    [+] Находим K самых больших. В нашем коде K тридцать два, на картинке для наглядности восемь.
    [+] Остальные зануляем. В PyTorch это две операции: topk находит значения и номера самых больших, а scatter раскладывает эти значения по их номерам в вектор из нулей.
  show: {block: scene, src: 11-transformer.js, scene: topk}

- say: Проверка.
  quiz:
    q: Почему отдельный нейрон residual stream обычно полисемантичен?
    options:
    - {text: 'Потому что модель плохо обучена', why: 'Полисемантичность — неизбежное следствие суперпозиции, а не ошибка обучения.'}
    - 'Нейрон — проекция на ось $e_k$, а на неё дают ненулевую проекцию направления многих признаков'
    - {text: 'Потому что у нейрона нет порога', why: 'Дело в геометрии: $x_k = \sum_j f_j \langle e_k, w_j\rangle$.'}
    answer: 2
    explain: 'Ось нейрона не совпадает ни с одним направлением признака, но «слышит» многие из них.'

- say: И числовой вопрос.
  quiz: {q: 'Словарь $D = 2048$, включено $K = 32$. Какой процент латентов активен на одном векторе?', answer: 1.5625, tol: '3%', unit: '%', hint: '$32 / 2048$.', explain: '$32 / 2048 = 1/64 \approx 1.56\%$.'}
