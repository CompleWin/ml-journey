- section: 'Задача 2.4: что требуется'
  say: >-
    Задача 2.4 исправляет ловушку случайной матрицы.
    [+] Вместо случайных направлений обучаем матрицу W и вектор порогов b градиентным спуском, на PyTorch, оптимизатором Adam, от двух до пяти тысяч шагов, отдельно под каждое p: одна сотая, пять сотых, одна десятая и две десятых.
    [+] После каждого шага столбцы W возвращаем в единичный шар: длина каждого не больше единицы.
    [+] Затем рисуем кривую ошибки обученной модели поверх кривой случайной и смотрим на матрицу Грама обученной W: видны ли структуры, например ортогональные подпространства или антиподальные пары, направления, смотрящие строго в противоположные стороны.
  show:
    block: text
    reveal: by-para
    md: |
      - обучить $W$ и $b \in \mathbb{R}^{M}$: PyTorch, Adam, ~2000–5000 шагов, $p \in \{0.01, 0.05, 0.1, 0.2\}$
      - после каждого шага: $\|w_i\|_2 \le 1$
      - сравнить NMSE с случайной моделью; матрица Грама $G = W^\top W$: структуры?

- section: Что значит «обучить»
  say: >-
    Раз задание требует обучения, разберёмся, как учится нейросеть. Это главное понятие машинного обучения.
    [+] Модель это формула с настраиваемыми числами, параметрами. У нас параметры это матрица W, десять на сорок, четыреста чисел, и сорок порогов b. Всего четыреста сорок.
    [+] Функция потерь L это одно число, которое говорит, насколько плохо модель работает при данных параметрах. У нас это средняя ошибка восстановления.
    [+] Обучить значит найти такие параметры, при которых потеря минимальна. Представь рельеф местности: координаты это параметры, высота это потеря. Нужно спуститься в низину.
  show: {block: scene, src: 09-training.js, scene: landscape, id: land}

- section: Градиентный спуск
  say: >-
    Как спускаться, не видя всей местности? Смотреть под ноги.
    [+] Производная по параметру показывает наклон: в какую сторону и насколько быстро растёт потеря. Для многих параметров производные собирают в вектор, градиент. Он указывает в сторону самого крутого подъёма.
    [+] Значит, делаем шаг в противоположную сторону: вычитаем из параметров градиент, умноженный на маленькое число эта, скорость обучения. Наклон стал меньше, повторяем. Шаг за шагом шарик скатывается в низину.
    [+] Скорость обучения важна. Слишком маленькая, и спуск длится вечность. Слишком большая, и шарик перепрыгивает через низину и скачет по склонам. В нашем коде она одна сотая.
  show: {use: land, scene: descent}

- say: >-
    Запишем формулой.
    [+] Градиент это вектор частных производных потери по всем параметрам.
    [+] Шаг градиентного спуска: новые параметры равны старым минус эта, умноженная на градиент. Минус потому, что идём вниз, против подъёма.
  show:
    block: derivation
    lines:
    - {tex: '\nabla L &= \Big(\frac{\partial L}{\partial \theta_1}, \dots, \frac{\partial L}{\partial \theta_n}\Big)', note: 'направление самого крутого подъёма'}
    - {tex: '\theta &\leftarrow \theta - \eta\, \nabla L', note: 'шаг вниз; η — скорость обучения (learning rate)'}

- section: Батч и свежие данные
  say: >-
    Точную потерю пришлось бы считать по бесконечному числу примеров. Поэтому на каждом шаге берут батч, пачку примеров, в нашем коде тысячу двадцать четыре, и считают градиент по ней. Он шумный, зато дешёвый, и в среднем указывает правильно. Это стохастический градиентный спуск.
    [+] Особенность нашей задачи: мы знаем, как порождаются данные, поэтому на каждом шаге генерируем свежий батч. Модель ни разу не видит один и тот же пример дважды и учит закон распределения, а не конкретные примеры. Переобучиться, то есть зазубрить обучающие примеры, ей просто не на чем.
  show:
    block: compare
    reveal: by-side
    titles: ['Один и тот же набор', 'Свежий батч каждый шаг']
    left: |
      - модель может **зазубрить** примеры
      - нужна отдельная проверочная выборка
    right: |
      - $3000 \times 1024 \approx 3$ млн разных примеров
      - модель учит **закон**, по которому рождаются признаки

- section: Оптимизатор Adam
  say: >-
    В коде используется не простой спуск, а оптимизатор Adam, самый популярный в глубоком обучении.
    [+] Он помнит сглаженное среднее прошлых градиентов, это инерция, как у тяжёлого шара: шум отдельных батчей гасится, а устойчивое направление ускоряется.
    [+] И помнит средний квадрат градиентов для каждого параметра отдельно, и делит шаг на его корень. Поэтому у каждого параметра свой подходящий размер шага: где градиенты большие, шаг осторожный, где маленькие, смелее. Скорость обучения одна сотая задаёт общий масштаб шагов.
  show:
    block: derivation
    lines:
    - {tex: 'm &\leftarrow \beta_1 m + (1 - \beta_1)\, \nabla L', note: 'инерция: сглаженный градиент'}
    - {tex: 'v &\leftarrow \beta_2 v + (1 - \beta_2)\, (\nabla L)^2, \qquad \theta \leftarrow \theta - \eta\, \frac{m}{\sqrt{v} + \epsilon}', note: 'свой масштаб шага у каждого параметра'}

- section: Проекция на шар
  say: >-
    Условие требует после каждого шага возвращать столбцы W в единичный шар.
    [+] Если после шага направление стало длиннее единицы, его укорачивают до единицы, делят на длину.
    [+] А если оно короче единицы, его не трогают. В коде это деление на длину, ограниченную снизу единицей: clamp с минимумом один.
    [+] Почему шар, а не сфера, то есть не ровно единица? Так модель может выключить признак, уменьшив его направление почти до нуля. Скоро увидим, что при больших p она этим пользуется.
  show: {block: scene, src: 09-training.js, scene: ballproj}

- section: Код обучения
  say: >-
    Теперь функция train_toy_model целиком.
    [+] Направления инициализируются случайно и нормируются, как в задаче 2.1. requires_grad говорит PyTorch: за этим тензором нужно следить и считать по нему градиенты. Пороги начинаются с нуля. Adam получает оба тензора и скорость обучения одну сотую.
    [+] Каждый шаг генерирует свежий батч, тысячу двадцать четыре примера по сорок признаков. Здесь примеры это строки, поэтому формула записана как f, умноженное на W транспонированное, умноженное на W. Это та же операция, что и раньше, только в транспонированном виде.
    [+] Потеря это сумма квадратов ошибок по признакам, усреднённая по батчу. zero_grad обнуляет старые градиенты, иначе PyTorch их накапливает. backward вычисляет градиенты всех параметров автоматически, это обратное распространение ошибки. step делает шаг Adam.
    [+] И проекция на шар внутри no_grad, чтобы эта операция сама не попала в вычисление градиентов. Пятнадцать моделей, по одной на каждое p, обучились за пятьдесят две секунды. Обучали все пятнадцать значений, а не только четыре из условия, чтобы получить полную кривую.
  show:
    block: code
    lang: python
    reveal: all
    trace: [[2, 3, 4, 5, 6], [8, 9, 10, 11], [12, 14, 15, 16], [18, 19]]
    src: |
      def train_toy_model(probability, steps=3000, batch_size=1024, learning_rate=1e-2):
          directions = torch.randn(hidden_dimension, number_of_features)
          directions = directions / directions.norm(dim=0, keepdim=True)
          directions.requires_grad_(True)
          bias = torch.zeros(number_of_features, requires_grad=True)
          optimizer = torch.optim.Adam([directions, bias], lr=learning_rate)
          for step in range(steps):
              magnitudes = torch.rand(batch_size, number_of_features)
              is_active = torch.rand(batch_size, number_of_features) < probability
              features = magnitudes * is_active
              reconstruction = torch.relu(features @ directions.T @ directions - bias)
              loss = ((features - reconstruction) ** 2).sum(dim=1).mean()

              optimizer.zero_grad()
              loss.backward()
              optimizer.step()

              with torch.no_grad():
                  directions /= directions.norm(dim=0, keepdim=True).clamp(min=1.0)

- say: Проверка.
  quiz:
    q: Зачем в цикле обучения вызывается `optimizer.zero_grad()`?
    options:
    - {text: 'Чтобы обнулить веса модели', why: 'Веса не трогаются — обнуляются только градиенты.'}
    - 'PyTorch накапливает градиенты; без обнуления шаг учитывал бы градиенты прошлых шагов'
    - {text: 'Чтобы ускорить обучение в два раза', why: 'Это не ускорение, а корректность шага.'}
    answer: 2
    explain: '`backward()` прибавляет новый градиент к уже лежащему в `.grad`, поэтому перед каждым шагом его обнуляют.'

- say: И ещё.
  quiz:
    q: 'Что делает строка `directions /= directions.norm(dim=0, keepdim=True).clamp(min=1.0)`?'
    options:
    - {text: 'Делает все столбцы ровно единичными', why: 'Короткие столбцы делятся на 1 и не меняются.'}
    - 'Укорачивает столбцы длиннее 1 до единицы, короткие не трогает — проекция на шар'
    - {text: 'Обнуляет короткие столбцы', why: 'Наоборот, короткие остаются как есть.'}
    answer: 2
    explain: 'Делитель $\max(\|w_i\|, 1)$: длинные векторы становятся единичными, короткие не меняются.'
