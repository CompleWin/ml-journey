- section: Главный вопрос работы
  say: >-
    Это разбор первой лабораторной по машинному обучению. Название у неё пугающее: «Геометрия суперпозиции и разреженные автоэнкодеры в трансформерах». Но за ним стоит один понятный вопрос.
    [+] Внутри языковой модели каждое слово описано набором чисел. В нашей модели их пятьсот двенадцать. А понятий, которые модель различает, гораздо больше: части речи, темы текста, скобки в коде, имена, города. Как всё это помещается в пятьсот двенадцать чисел?
    [+] И второй вопрос: можно ли эти понятия достать наружу, увидеть по отдельности и даже подкрутить, чтобы модель начала писать по-другому? Лабораторная отвечает на оба вопроса, шаг за шагом.
  show: {block: scene, src: 01-intro.js, scene: question}

- section: Цель работы по условию
  say: >-
    В условии цель записана так.
    [+] Первое: исследовать суперпозицию признаков в пространствах высокой размерности. Суперпозиция значит наложение. Много понятий хранятся в одних и тех же числах одновременно, а не каждое в своей ячейке.
    [+] Второе: понять, откуда в трансформерах берётся анизотропия. Это слово значит, что векторы смотрят не во все стороны одинаково, а сбиваются в одну сторону.
    [+] Третье: написать и починить разреженный автоэнкодер Top-K. Это инструмент, который раскладывает числа модели обратно на отдельные понятия.
    [+] И четвёртое: сравнить, насколько хорошо получается управлять текстом, если толкать модель вдоль одного нейрона и вдоль найденного понятия. Не страшно, если пока это просто слова. Каждое из них разберём с нуля.
  show:
    block: text
    reveal: by-para
    md: |
      - **Суперпозиция** признаков в пространствах высокой размерности
      - **Анизотропия** в трансформерах: откуда она берётся
      - **Top-K Sparse Autoencoder** (SAE): реализовать и починить
      - **Feature Steering против Neuron Steering**: чем лучше управлять генерацией

- section: Четыре задания одной картой
  say: >-
    Работа состоит из четырёх заданий. Посмотрим на них как на карту. Задание первое, про геометрию.
    [+] Берём два случайных направления в пространстве с большим числом измерений и меряем угол между ними. Оказывается, он почти всегда очень близок к девяноста градусам. Это явление называется концентрацией меры.
    [+] Потом смотрим на настоящую языковую модель Pythia и видим, что у неё это правило нарушено: векторы слов сбились в узкий конус. Надо понять почему и исправить.
  show: {block: scene, src: 01-intro.js, scene: map1, id: map}

- say: >-
    Задание второе, игрушечная модель суперпозиции.
    [+] Берём сорок признаков и сжимаем их всего в десять чисел, а потом пытаемся восстановить. Если признаки включаются редко, это получается. На рисунке для наглядности пять направлений на плоскости: их больше, чем измерений, но они всё равно расходятся в разные стороны.
    [+] Сначала направления выбираем случайно, и восстановление выходит плохим. Потом даём нейросети самой научиться их раскладывать, и ошибка падает в разы.
  show: {use: map, scene: map2}

- say: >-
    Задание третье, разреженный автоэнкодер. По-английски Sparse Autoencoder, коротко SAE.
    [+] Это маленькая нейросеть. Она берёт пятьсот двенадцать чисел из середины модели Pythia и раскладывает их по словарю из двух тысяч сорока восьми понятий.
    [+] При этом одновременно разрешено включиться только тридцати двум из них. В условии дан код с тремя ошибками, из-за которых заметная часть словаря «умирает» и не работает. Надо найти ошибки и починить.
  show: {use: map, scene: map3}

- say: >-
    И задание четвёртое, управление моделью. Его называют стирингом, от английского steering, руление.
    [+] К внутреннему вектору модели прибавляем добавку, толчок в выбранном направлении.
    [+] Сравниваем два вида толчков: вдоль одного нейрона и вдоль понятия, найденного автоэнкодером. И смотрим, как меняется текст, который пишет модель.
  show: {use: map, scene: map4}

- section: Одна история
  say: >-
    Задания складываются в одну историю.
    [+] В многомерном пространстве случайные направления почти перпендикулярны. Значит, места для почти независимых направлений там очень много.
    [+] Поэтому сеть может упаковать туда больше понятий, чем измерений. Это и есть суперпозиция.
    [+] Упакованное можно распаковать автоэнкодером.
    [+] А распакованным понятием можно рулить. Держи эту нить в голове: на защите она помогает ответить на вопрос «зачем всё это».
  show: {use: map, scene: map5}

- section: Главные результаты
  say: >-
    Вот что получилось, коротко. Сейчас это обзор, подробности будут в главах.
    [+] В первом задании разброс косинуса совпал с теорией с точностью около процента. А у выходных эмбеддингов Pythia средний косинус оказался ноль девяносто два вместо нуля. Это конус. Центрирование и отбеливание вернули картину к теории.
    [+] Во втором задании обученная упаковка ошибается в разы меньше случайной. При самых редких признаках нормированная ошибка ноль одиннадцать против ноль тридцати семи.
    [+] В третьем сломанный автоэнкодер терял пятьсот сорок два понятия из двух тысяч сорока восьми. После починки потерь ноль, а объяснённая дисперсия ноль восемьсот двадцать шесть.
    [+] В четвёртом толчок вдоль нейрона двигает смесь несвязанных тем, а толчок вдоль признака автоэнкодера вносит один понятный смысл: то, что обычно пишут после открывающей скобки.
  show:
    block: table
    reveal: by-row
    cols: [Задание, Что получилось]
    rows:
    - ['1. Концентрация меры и конус', '$\hat\sigma^2 \approx 1/d$ с точностью ~1%; у `embed_out` $\hat\mu = 0.92$, после центрирования и отбеливания $\approx 0$']
    - ['2. Суперпозиция', 'обученная $W$: NMSE 0.11 против 0.37 у случайной при $p = 0.01$']
    - ['3. Top-K SAE', 'мёртвых латентов 542 → 0, EV = 0.826']
    - ['4. Стиринг', 'нейрон 42 — смесь тем; признак 1892 — «что идёт после скобки»']

- section: Где результаты разошлись с условием
  say: >-
    Отдельно запомни четыре места, где результаты разошлись с ожиданиями условия. На защите про них спросят в первую очередь. Это нормально: это результаты эксперимента, и у каждого есть объяснение.
    [+] Условие ждало конус во входных эмбеддингах, а он нашёлся в выходных.
    [+] Условие просило найти точку коллапса, а у нашей случайной матрицы коллапса нет совсем.
    [+] Условие обещало, что у сломанного автоэнкодера объяснённая дисперсия будет пятьдесят — шестьдесят процентов, а у нас около восьмидесяти двух. Поломка видна в другом месте, в словаре.
    [+] И условие ожидало, что вектор автоэнкодера дольше сохраняет связность текста, чем нейрон. У нас наоборот. Каждое объяснение разберём в своей главе.
  show:
    block: table
    reveal: by-row
    cols: [Ожидание условия, Что получилось]
    rows:
    - ['конус в `embed_in`, $\mu \in [0.15, 0.35]$', '$\hat\mu = 0.005$ в `embed_in`, конус в `embed_out`: $\hat\mu = 0.92$']
    - ['найти точку коллапса $p^*$', 'у нашей $W_{rand}$ NMSE $\le 0.84$, коллапса нет']
    - ['сломанный SAE: EV 50–60%', 'EV = 0.818, но 26.5% мёртвых латентов']
    - ['SAE-вектор дольше держит низкую перплексию', 'наоборот: CE растёт быстрее, чем у нейрона']

- section: Инструменты
  say: >-
    Работа написана на языке Python в Jupyter-ноутбуке. Ноутбук это документ, где чередуются кусочки кода, их называют ячейками, и результаты их работы: числа, таблицы, графики.
    [+] NumPy работает с массивами чисел: векторами и матрицами. Одна команда обрабатывает сразу весь массив.
    [+] PyTorch умеет то же самое, но ещё сам считает градиенты, то есть подсказки, как менять параметры. Поэтому всё, что обучается, написано на нём.
    [+] Библиотека transformers скачивает готовую модель Pythia, а datasets загружает корпус текстов.
    [+] SciPy даёт статистику и поиск минимума, pandas собирает результаты в таблицы, matplotlib рисует графики.
  show:
    block: table
    reveal: by-row
    cols: [Библиотека, Для чего в работе]
    rows:
    - ['`numpy`', 'массивы, задания 1 и 2']
    - ['`torch` (PyTorch)', 'обучение: toy-модель, SAE; хуки в задании 4']
    - ['`transformers`, `datasets`', 'модель Pythia-70m и корпус Pile-10k']
    - ['`scipy`, `pandas`, `matplotlib`', 'статистика и оптимизация, таблицы, графики']

- say: Короткая проверка.
  quiz:
    q: Что значит «суперпозиция признаков»?
    options:
    - {text: 'Каждое понятие хранится в своём отдельном нейроне', why: 'Это как раз противоположная идея: «один нейрон — одно понятие».'}
    - 'Понятий больше, чем чисел, и они хранятся наложением в одних и тех же числах'
    - {text: 'Признаки отсортированы по важности', why: 'Порядок тут ни при чём, речь о том, как много понятий делят одни и те же числа.'}
    answer: 2
    explain: Суперпозиция — наложение. Понятий больше, чем измерений, и каждое записано направлением, а не отдельной ячейкой.
