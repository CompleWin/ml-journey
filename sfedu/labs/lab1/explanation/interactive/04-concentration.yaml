- section: Что требует задание 1.1
  say: >-
    Теперь можно читать задание 1.1. Его смысл: проверить на компьютере, что два случайных направления в большой размерности почти перпендикулярны.
    [+] Генерируем две матрицы X и Y по двадцать тысяч строк, каждая строка это случайный вектор из d нормальных чисел.
    [+] Каждую строку нормируем, то есть делаем единичной длины. Получаем двадцать тысяч пар случайных направлений u и v.
    [+] Для каждой пары считаем скалярное произведение, то есть косинус угла между ними.
    [+] Повторяем для пяти размерностей: шестнадцать, шестьдесят четыре, двести пятьдесят шесть, пятьсот двенадцать и четыре тысячи девяносто шесть. Для каждой рисуем гистограмму и поверх неё теоретическую кривую N от нуля и единицы, делённой на d. И сводим в таблицу дисперсию, среднее и эксцесс.
  show:
    block: text
    reveal: by-para
    md: |
      - $X, Y \in \mathbb{R}^{M\times d}$ из $\mathcal{N}(0, 1)$, $M = 20\,000$ пар
      - нормировка строк: $u_i = X_i/\|X_i\|_2$, $\;v_i = Y_i/\|Y_i\|_2$
      - косинусы пар: $s_i = \langle u_i, v_i \rangle$
      - $d \in \{16, 64, 256, 512, 4096\}$: гистограмма $s_i$ поверх $\mathcal{N}(0, 1/d)$; таблица $1/d$, $\hat\sigma^2$, $\hat\mu$, эксцесс

- section: Как получить случайное направление
  say: >-
    Как получить направление, равномерно случайное во все стороны? Условие говорит: взять вектор из нормального распределения и нормировать.
    [+] Каждую точку облака делим на её длину, и точка переезжает на окружность. Точки ложатся равномерно, потому что облако было круглым.
    [+] А если взять точки, равномерно разбросанные в квадрате, и сделать то же самое, на окружности они сгустятся у углов квадрата, вдоль диагоналей. В квадрате вдоль диагонали просто больше места.
    [+] Поэтому для равномерной точки на сфере берут именно нормальный вектор. Это частый вопрос на защите: почему не равномерные числа от минус одного до одного? Потому что куб не круглый.
  show: {block: scene, src: 04-concentration.js, scene: project}

- say: >-
    Теперь то же строго.
    [+] Координаты независимы, поэтому плотность вектора равна произведению плотностей координат.
    [+] Экспоненты перемножаются, их показатели складываются, и в показателе получается сумма квадратов координат, то есть квадрат длины. Плотность зависит только от длины вектора, а от направления не зависит.
    [+] Значит, после деления на длину все направления равновероятны. Получаем равномерное распределение на единичной сфере.
  show:
    block: derivation
    lines:
    - {tex: 'p(x) &= \prod_{i=1}^{d} \frac{1}{\sqrt{2\pi}}\, e^{-x_i^2/2}', note: 'координаты независимы — плотности перемножаются'}
    - {tex: '&= \frac{1}{(2\pi)^{d/2}} \exp\Big(-\frac{\|x\|_2^2}{2}\Big)', note: 'сумма квадратов в показателе — квадрат длины'}
    - {tex: 'u &= \frac{X}{\|X\|_2} \sim \mathrm{Unif}\big(\mathbb{S}^{d-1}\big)', note: 'от направления плотность не зависит'}

- section: 'Вывод: среднее и дисперсия косинуса'
  say: >-
    Выведем, каким должен получиться разброс косинуса. Нарисуем два случайных направления u и v.
    [+] Распределение не меняется при повороте, поэтому повернём всю картинку так, чтобы u лёг вдоль первой оси. Тогда у u первая координата единица, а остальные нули.
    [+] Скалярное произведение превращается просто в первую координату вектора v, в v один. Значит, вопрос сводится к тому, как распределена одна координата случайной точки на сфере.
  show: {block: scene, src: 04-concentration.js, scene: fixu}

- say: >-
    Сначала среднее.
    [+] Скалярное произведение равно первой координате v.
    [+] Точка на сфере с одинаковой вероятностью может оказаться и справа, и слева, распределение симметрично относительно нуля. Поэтому среднее значение v один равно нулю.
  show:
    block: derivation
    lines:
    - {tex: '\langle u, v \rangle &= 1 \cdot v_1 + 0 \cdot v_2 + \dots + 0 \cdot v_d = v_1', note: 'u = (1, 0, …, 0) после поворота'}
    - {tex: '\mathbb{E}[v_1] &= 0', note: 'v₁ и −v₁ равновероятны'}

- say: >-
    Теперь дисперсия, и тут красивый трюк.
    [+] Вектор v лежит на единичной сфере, поэтому сумма квадратов его координат ровно единица. Всегда, для любой точки.
    [+] Возьмём среднее от обеих частей. Все d координат равноправны, у них одинаковый средний квадрат. Значит, d умножить на средний квадрат v один равно единице.
    [+] Дисперсия это средний квадрат минус квадрат среднего. Среднее ноль, остаётся единица, делённая на d. Это точный результат при любом d, а не приближение. Чем больше размерность, тем уже разброс косинуса.
  show:
    block: derivation
    lines:
    - {tex: 'v_1^2 + v_2^2 + \dots + v_d^2 &= 1', note: 'v на единичной сфере'}
    - {tex: 'd \cdot \mathbb{E}[v_1^2] &= 1 \;\Rightarrow\; \mathbb{E}[v_1^2] = \frac{1}{d}', note: 'среднее от обеих частей; координаты равноправны'}
    - {tex: '\mathrm{Var}\,\langle u, v \rangle &= \mathbb{E}[v_1^2] - \big(\mathbb{E}[v_1]\big)^2 = \frac{1}{d}', note: 'дисперсия = средний квадрат − квадрат среднего'}

- section: Почему получается колокол
  say: >-
    Осталось понять, почему форма распределения нормальная.
    [+] Первая координата точки на сфере это X один, делённое на длину всего вектора X. Умножим на корень из d и перепишем знаменатель через среднее квадратов координат.
    [+] По закону больших чисел среднее многих квадратов стандартных нормальных чисел стремится к их ожиданию, к единице. Как среднее многих бросков кубика стремится к трём с половиной.
    [+] Знаменатель становится единицей, и остаётся просто X один, стандартное нормальное число. Строго это обосновывает теорема Слуцкого: если знаменатель стремится к константе, дробь ведёт себя как числитель.
    [+] Делим обратно на корень из d и получаем: косинус примерно нормален со средним ноль и дисперсией один делить на d. Запомни разницу: дисперсия один делить на d точная при любом d, а нормальность только при больших d.
  show:
    block: derivation
    lines:
    - {tex: '\sqrt{d}\, v_1 &= \frac{X_1}{\sqrt{\frac{1}{d}\sum_{i=1}^{d} X_i^2}}', note: 'v₁ = X₁/‖X‖, домножили на √d'}
    - {tex: '\frac{1}{d}\sum_{i=1}^{d} X_i^2 &\longrightarrow \mathbb{E}[X_i^2] = 1', note: 'закон больших чисел'}
    - {tex: '\sqrt{d}\, v_1 &\longrightarrow X_1 \sim \mathcal{N}(0, 1)', note: 'знаменатель → 1, теорема Слуцкого'}
    - {tex: '\langle u, v \rangle &\approx \mathcal{N}\Big(0,\ \frac{1}{d}\Big)', note: 'делим на √d: дисперсия 1/d, σ = 1/√d'}

- section: Что это значит в углах
  say: >-
    Переведём в углы. По правилу трёх сигм почти все косинусы лежат в пределах трёх сигм от нуля.
    [+] При d, равном шестнадцати, сигма равна одной четвёртой, ноль двадцать пять. Три сигмы это ноль семьдесят пять, и угол между случайными векторами гуляет примерно от сорока одного до ста тридцати девяти градусов. Косинус плюс-минус ноль пять у случайной пары тут обычное дело.
    [+] При d, равном четырём тысячам девяноста шести, сигма одна шестьдесят четвёртая, примерно ноль ноль один шесть. Три сигмы около ноль ноль сорока семи, и угол зажат между восемьюдесятью семью и тремя десятыми и девяноста двумя и семью десятыми градуса. Случайные векторы в большой размерности практически перпендикулярны. Это и называется концентрацией меры.
  show: {block: scene, src: 04-concentration.js, scene: angles}

- section: Код функции
  say: >-
    Теперь код. Функция принимает размерность и число пар, по умолчанию двадцать тысяч.
    [+] Две строки генерируют две матрицы нормальных чисел, двадцать тысяч строк на d столбцов. Генератор random_generator создан в начале ноутбука с зерном ноль, поэтому при каждом запуске числа одни и те же. Тип float32, одинарная точность: при d четыре тысячи девяносто шесть одна матрица занимает около трёхсот тридцати мегабайт, а в двойной точности было бы вдвое больше.
    [+] Деление с присваиванием нормирует каждую строку прямо на месте, без копии матрицы. axis равный единице и keepdims мы уже разбирали.
    [+] Последняя строка перемножает матрицы поэлементно и суммирует по строкам: двадцать тысяч косинусов за одну команду. Результат переводится во float64, чтобы дисперсию и эксцесс считать с полной точностью.
  show:
  - {block: scene, src: 04-concentration.js, scene: pipeline, size: [800, 900]}
  - block: code
    lang: python
    reveal: all
    trace: [1, [2, 3], [4, 5], 6]
    src: |
      def sample_cosine_similarities(dimension, number_of_pairs=20000):
          first_vectors = random_generator.standard_normal((number_of_pairs, dimension), dtype=np.float32)
          second_vectors = random_generator.standard_normal((number_of_pairs, dimension), dtype=np.float32)
          first_vectors /= np.linalg.norm(first_vectors, axis=1, keepdims=True)
          second_vectors /= np.linalg.norm(second_vectors, axis=1, keepdims=True)
          return np.sum(first_vectors * second_vectors, axis=1).astype(np.float64)

- say: >-
    Эксперимент и графики.
    [+] Словарь собирает косинусы для всех пяти размерностей: ключ это d, значение массив из двадцати тысяч чисел.
    [+] Теоретическая сигма равна единице, делённой на корень из d.
    [+] hist рисует гистограмму с восемьюдесятью корзинами, density равное True делает площадь единичной. А plot рисует поверх неё теоретическую плотность. Обрати внимание: в scale передаётся сигма, а не дисперсия.
  show:
    block: code
    lang: python
    reveal: all
    trace: [[1, 2], 3, [4, 5]]
    src: |
      dimensions = [16, 64, 256, 512, 4096]
      similarities_by_dimension = {dimension: sample_cosine_similarities(dimension) for dimension in dimensions}
      theoretical_std = 1 / np.sqrt(dimension)
      axis.hist(similarities, bins=80, density=True, alpha=0.6)
      axis.plot(grid, stats.norm.pdf(grid, loc=0, scale=theoretical_std))

- section: Результат
  say: >-
    Вот результат на общей шкале от минус одного до одного, так сужение видно лучше всего.
    [+] d шестнадцать: широкий колокол, сигма ноль двадцать пять.
    [+] Шестьдесят четыре: сигма вдвое меньше, ноль сто двадцать пять.
    [+] Двести пятьдесят шесть: ноль ноль шестьдесят два.
    [+] Пятьсот двенадцать: ноль ноль сорок четыре. Это размерность модели Pythia, она нам скоро понадобится.
    [+] И четыре тысячи девяносто шесть: почти игла у нуля. Каждый раз, когда d растёт вчетверо, ширина колокола уменьшается вдвое, как единица на корень из d.
