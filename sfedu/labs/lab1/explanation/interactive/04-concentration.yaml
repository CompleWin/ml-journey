- section: Каверзные вопросы по заданию 1.1
  say: >-
    Ещё несколько вопросов, которые любят задавать.
    [+] Зачем keepdims? Без него длины получаются плоским массивом формы M, и деление матрицы M на d на него не согласуется по формам. С keepdims длины лежат столбцом M на один и делят каждую строку.
    [+] Чем стандартное отклонение отличается от дисперсии? Дисперсия это сигма в квадрате, один делить на d. Сигма это корень, один делить на корень из d. В stats.norm.pdf параметр scale это сигма.
    [+] Почему выборочная дисперсия не равна теории точно? Потому что выборка конечная, двадцать тысяч пар. Отличия порядка процента это нормальный статистический шум.
    [+] Зачем фиксировать зерно генератора? Чтобы результаты воспроизводились: при каждом запуске ноутбука получаются те же числа.
  show:
    block: text
    reveal: by-para
    md: |
      **Зачем `keepdims=True`?** Чтобы длины были столбцом $(M, 1)$ и делили каждую строку.

      **$\sigma$ или $\sigma^2$?** $\sigma^2 = 1/d$, $\sigma = 1/\sqrt{d}$; `scale` в SciPy — это $\sigma$.

      **Почему не точно $1/d$?** Конечная выборка: отличия ~1% — шум оценки.

      **Зачем зерно `default_rng(0)`?** Воспроизводимость: те же числа при каждом запуске.
