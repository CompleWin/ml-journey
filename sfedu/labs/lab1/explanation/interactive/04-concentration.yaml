- section: Таблица
  say: >-
    Теперь таблица.
    Главный столбец: отношение выборочной дисперсии к теоретической. Оно от ноль девяноста девяти до одного и одной сотой при любом d. Совпадение с единицей, делённой на d, с точностью около процента.
    А выборочное среднее везде практически ноль, тысячные доли и меньше. Небольшие отклонения от точных значений это шум конечной выборки: двадцать тысяч пар не бесконечность.
  show:
    block: table
    data: conc
    cols: [d, vth, v, ratio, mu]
    reveal: all
    highlight: [ratio]

- section: Эксцесс в таблице
  say: >-
    Эксцесс проверяет, стала ли форма нормальной.
    При d шестнадцать выборочный эксцесс минус ноль триста пятьдесят четыре. Для косинуса случайных векторов есть точная формула: минус шесть, делённое на d плюс два. Это минус ноль триста тридцать три, очень близко. Эксцесс отрицательный, потому что косинус не может выйти за отрезок от минус одного до одного: хвосты обрезаны и тоньше гауссовых.
    С ростом d эксцесс стремится к нулю, распределение становится нормальным.
    При d от пятисот двенадцати отличия от точной формулы не больше четырёх сотых. Это шум оценки. Даже у идеальной нормальной выборки из двадцати тысяч чисел эксцесс гуляет вокруг нуля примерно на корень из двадцати четырёх, делённого на M, это около ноль ноль тридцати пяти. Это называется стандартной ошибкой.
  show:
    block: table
    data: conc
    cols: [d, kurt, kexact]
    reveal: all
    highlight: [kurt]

- section: Вывод к заданию 1.1
  say: >-
    Вывод, который стоит сказать на защите.
    [+] Выборочная дисперсия совпала с единицей, делённой на d, с точностью около процента при любом d. Это точный результат, он следует из симметрии сферы.
    [+] Разброс сужается как единица на корень из d. При d четыре тысячи девяносто шесть угол между случайными векторами лежит между восемьюдесятью семью и тремя десятыми и девяноста двумя и семью десятыми градуса.
    [+] Эксцесс показывает переход к нормальному закону: при малых d он отрицательный и близок к минус шести на d плюс два, а при больших d стремится к нулю.
  show:
    block: text
    reveal: by-para
    md: |
      - $\hat\sigma^2 \approx 1/d$ с точностью ~1% при любом $d$; $\hat\mu \approx 0$
      - разброс $\sigma = 1/\sqrt{d}$: при $d = 4096$ угол $\in [87.3°, 92.7°]$
      - эксцесс $\approx -6/(d+2) \to 0$: распределение становится нормальным

