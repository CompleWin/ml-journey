- section: Данные для SAE
  say: >-
    Автоэнкодер учится на векторах residual stream. Откуда их взять? Условие просит запрограммировать всё оптимально. В ноутбуке это сделано так.
    [+] Прогоняем Pythia через корпус текстов один раз и сохраняем векторы третьего слоя в один тензор. Дальше автоэнкодер учится на готовых векторах, и модель больше не нужна.
    [+] Модель запускаем без языковой головы, то есть без умножения на выходную таблицу из пятидесяти тысяч токенов: эти логиты нам не нужны. И внутри no_grad, без подготовки к вычислению градиентов.
    [+] Корпус NeelNanda pile-10k: первые десять тысяч документов The Pile, того самого набора текстов, на котором обучалась Pythia. Берём тысячу окон по сто двадцать восемь токенов. Получается тензор тысяча на сто двадцать восемь на пятьсот двенадцать, сто двадцать восемь тысяч векторов. Сбор занимает двадцать четыре секунды.
  show:
    block: text
    reveal: by-para
    md: |
      - **один проход** Pythia → сохранить активации слоя 3 → учить SAE на готовых векторах
      - без LM-головы (`language_model.gpt_neox`), под `torch.no_grad()`
      - `NeelNanda/pile-10k`: 1000 окон × 128 токенов → тензор $(1000, 128, 512)$, 24 с

- section: Forward hook
  say: >-
    Как достать векторы из середины модели? Хуком, по-русски крючком.
    [+] register_forward_hook вешает на слой нашу функцию. PyTorch вызывает её каждый раз после того, как слой посчитал свой выход, и передаёт ей сам слой, его вход и его выход.
    [+] Наша функция просто складывает выход в список. Выход слоя в Pythia это кортеж, поэтому берём его первый элемент, тензор скрытых состояний.
    [+] После прохода хук обязательно снимаем методом remove. Это сделано в блоке finally: даже если внутри случится ошибка, хук не останется висеть на слое и не испортит следующие вычисления. Если функция хука что-то возвращает, этот результат заменяет выход слоя. Это мы используем в четвёртом задании для стиринга.
  show:
  - {block: scene, src: 12-sae-data.js, scene: hook, size: [800, 900]}
  - block: code
    lang: python
    reveal: all
    trace: [3, [2, 3], [8, 9]]
    src: |
      def residual_stream(token_ids, batch_size=50):
          captured_batches = []
          handle = target_layer.register_forward_hook(lambda module, inputs, output: captured_batches.append(hidden_states_of(output).detach()))
          try:
              with torch.no_grad():
                  for start in range(0, len(token_ids), batch_size):
                      language_model.gpt_neox(token_ids[start:start + batch_size])
          finally:
              handle.remove()
          return torch.cat(captured_batches)

- section: Что внутри этих векторов
  say: >-
    Прежде чем учить автоэнкодер, в ноутбуке проверена геометрия собранных векторов. Нашлись две важные особенности.
    [+] Первая: у вектора на позиции ноль, то есть у самого первого токена окна, средняя длина сто двадцать одна, а у всех остальных позиций около четырнадцати. Почти в девять раз больше. Это известное явление, attention sink, «сток внимания»: модель использует первый токен как место, куда сбрасывает лишнее внимание, и его вектор раздувается.
    [+] Вторая: та же анизотропия, что в первом задании. Средний косинус между случайными токенами ноль тридцать пять вместо нуля. Длина среднего вектора восемь и семь десятых, и на общую часть приходится двадцать процентов энергии векторов. Больше всего выделяется координата сто пятьдесят шесть, её среднее семь и четыре десятых.
  show:
    block: figure
    src: figures/nb42-1.png
    reveal: by-mark
    caption: 'Средняя длина вектора слоя 3 по позиции в окне (логарифмическая шкала)'
    marks:
    - {at: [0.12, 0.2], text: 'позиция 0: ‖x‖ ≈ 121'}
    - {at: [0.6, 0.62], text: 'остальные: ≈ 14'}

- section: Подготовка обучающей выборки
  say: >-
    Что с этим делаем.
    [+] Позицию ноль выбрасываем. Её векторы почти в девять раз длиннее, в квадратичной ошибке они бы доминировали, и словарь учился бы описывать сток внимания, а не текст.
    [+] Остаётся сто двадцать семь тысяч векторов. Перемешиваем их в случайном порядке.
    [+] Первые шестьдесят четыре тысячи идут в обучение: тысяча шагов по шестьдесят четыре, каждый вектор используется ровно один раз. Остальные шестьдесят три тысячи откладываем. Это отложенная выборка, на ней в четвёртом задании проверим найденный признак на данных, которых автоэнкодер не видел.
  show: {block: scene, src: 12-sae-data.js, scene: split}

- section: 'Метрика 1: объяснённая дисперсия'
  say: >-
    Теперь две метрики из условия. Первая, Explained Variance, объяснённая дисперсия.
    [+] Берём ошибку восстановления, разность x и x с крышкой, и считаем её дисперсию вдоль пятисот двенадцати координат.
    [+] Делим на дисперсию самого x. Это доля разброса, которую автоэнкодер не смог воспроизвести.
    [+] Единица минус эта доля и есть объяснённая дисперсия. Единица значит идеальное восстановление, ноль значит модель не лучше, чем просто среднее значение. Требование условия: не меньше восьмидесяти процентов. В коде дисперсии каждого вектора считаются по последней оси и суммируются по всему батчу.
  show:
  - block: derivation
    lines:
    - {tex: '\mathrm{Var}(x - \hat x)', note: 'разброс ошибки по координатам'}
    - {tex: '\frac{\mathrm{Var}(x - \hat x)}{\mathrm{Var}(x)}', note: 'доля необъяснённого разброса'}
    - {tex: 'EV = 1 - \frac{\mathrm{Var}(x - \hat x)}{\mathrm{Var}(x)} \;\ge\; 0.8', note: 'требование условия'}
  - block: code
    lang: python
    reveal: all
    src: |
      def explained_variance(x, x_hat):
          return 1 - (x - x_hat).var(dim=-1).sum() / x.var(dim=-1).sum()

- section: 'Метрика 2: мёртвые латенты'
  say: >-
    Вторая метрика, доля мёртвых латентов.
    [+] За последние пятьсот шагов обучения через автоэнкодер проходит пятьсот на шестьдесят четыре, тридцать две тысячи векторов. Для каждого из двух тысяч сорока восьми латентов считаем, сколько раз он попал в Top-K.
    [+] Латент, который не попал ни разу, мёртвый. Это потерянный элемент словаря: он занимает место и ничего не объясняет. Требование: мёртвых не больше пяти процентов, примерно сотни из двух тысяч сорока восьми.
    [+] Почему мёртвый латент не оживает сам? Если он не входит в Top-K, его выход ноль, и градиент через него не течёт. Его веса не меняются, поэтому и на следующем шаге он не выиграет. Это ловушка без выхода.
  show: {block: scene, src: 12-sae-data.js, scene: dead}

