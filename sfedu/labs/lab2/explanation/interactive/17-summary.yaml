- section: Как рассказать всю лабу за минуту
  say: >-
    Осталось собрать всё в короткий рассказ для защиты. Главная мысль: даже чистый шум в многомерном пространстве даёт не одно собственное число, а целый непрерывный спектр — балк Марченко–Пастура, и всё, что лежит за его краем, уже структура. [+] В первом задании мы этот балк воспроизвели, разобрались с нулевыми собственными числами при пэ больше эн и с нормировкой плотности, а флуктуации края описали распределением Трейси–Видома. [+] Во втором задании спрятали в шум сигнал и показали фазовый переход бэ-бэ-пэ: ниже порога, корня из пэ на эн, метод главных компонент сигнала не видит совсем, а выше видит, но завышает его силу. Это завышение мы убрали, обратив формулу бэ-бэ-пэ. [+] В третьем задании применили ту же теорию к весам ResNet-18. Показатель хвоста оценили методом максимального правдоподобия, потому что МНК по гистограмме зависит от числа бинов. А по положению спектра относительно границы шума, стабильному рангу и альфе отличили случайный слой, коллапсированный и слой в «зоне Златовласки».
  show:
    block: text
    reveal: by-para
    md: |
      - **Идея.** Шум даёт целый спектр — балк Марченко–Пастура; всё, что за его краем, — структура.

      - **Задание 1.** Закон МП воспроизведён; нули при $p > n$ отсечены порогом, кривая умножена на $\gamma$; флуктуации края — распределение Трейси–Видома.

      - **Задание 2.** Переход BBP с порогом $\theta_c = \sqrt{p/n}$; наивная оценка силы сигнала завышена, калибровка обращает формулу BBP.

      - **Задание 3.** $\alpha$ — по Хиллу, а не МНК; граница $\lambda_+$, stable rank и $\alpha$ различают шум, коллапс и «зону Златовласки».

- say: >-
    И напоследок — карточки для повторения перед защитой. Прочитайте вопрос, ответьте вслух и щёлкните по карточке, чтобы проверить себя. Если ответ не вспоминается, вернитесь к нужной главе через оглавление.
  show:
    block: cards
    items:
    - ['Что такое $\gamma$?', 'Отношение числа признаков к числу наблюдений: $\gamma = p/n$.']
    - ['Что означает собственное число ковариации?', 'Дисперсию данных вдоль соответствующей главной оси.']
    - ['Границы спектра шума по закону МП?', '$\lambda_\pm = \sigma^2(1 \pm \sqrt{\gamma})^2$; при $\gamma = 0{,}5$ это 0,0858 и 2,914.']
    - ['Почему при $p > n$ есть нулевые собственные числа?', 'Ранг $XX^T/n$ не больше $n$, поэтому не меньше $p - n$ чисел равны нулю.']
    - ['Как отсечь машинные нули?', 'Порогом $\varepsilon_{mach} \cdot \lambda_{max} \cdot p \approx 2{,}6\cdot10^{-12}$ — как в `matrix_rank`.']
    - ['Зачем умножать кривую МП на $\gamma$ при $\gamma > 1$?', 'Непрерывная часть МП имеет площадь $1/\gamma$, а гистограмма ненулевых чисел — 1: это условная плотность $\gamma\rho_{MP}$.']
    - ['Почему $\lambda_{max}$ иногда выходит за $\lambda_+$?', '$\lambda_+$ — предел при $n \to \infty$; при конечном $n$ край размыт на $s \sim n^{-2/3}$, флуктуации — Трейси–Видом.']
    - ['Почему при $p = n$ $\lambda_{max} \to 4$?', '$\lambda_+ = (1+1)^2 = 4$: PCA выбирает направление по тем же данным — переобучение на шум; след сохраняется, дисперсия перераспределяется.']
    - ['Порог фазового перехода BBP?', '$\theta_c = \sqrt{\gamma} = \sqrt{p/n}$; при $\gamma = 0{,}5$ это ≈ 0,707.']
    - ['Что происходит выше порога BBP?', '$\hat\lambda_1 \to (1+\theta)(1+\gamma/\theta)$, перекрытие $\to (1-\gamma/\theta^2)/(1+\gamma/\theta) < 1$.']
    - ['Почему наивная оценка $\hat\lambda_1 - 1$ завышена?', 'Она равна $\theta + \gamma + \gamma/\theta$: шум выталкивает собственное число вверх.']
    - ['Зачем guard clause в `calibrate`?', 'При $\hat\lambda_1 \le \lambda_+$ корень не определён, а такое значение шум даёт и без сигнала.']
    - ['Почему МНК по гистограмме не годится для $\alpha$?', 'Ответ зависит от числа бинов (2,20 → 0,88): одиночные бины дают «пол», нарушены условия МНК.']
    - ['Формула Хилла?', '$\alpha = 1 + N_{tail}/\sum \ln(\lambda_i/\lambda_{min})$; погрешность $\approx (\alpha-1)/\sqrt{N_{tail}}$.']
    - ['Как выбирают $\lambda_{min}$?', 'Перебором: берут порог с наименьшим расстоянием Колмогорова–Смирнова $D$ (алгоритм Клаузе–Шализи–Ньюмана).']
    - ['Что такое stable rank?', '$\sum\lambda_i/\lambda_{max} = \|W\|_F^2/\|W\|_2^2$ — на сколько направлений распределена энергия слоя.']
    - ['Как отличить случайный слой?', 'Все собственные числа внутри $[\lambda_-, \lambda_+]$, за край не выходит ни одно — какое бы $\alpha$ ни вернула подгонка.']
    - ['Что такое «зона Златовласки»?', '$2 < \alpha \le 4$: тяжёлый хвост, хорошее обобщение. В лабе это слой `fc`, $\alpha = 3{,}38$.']
