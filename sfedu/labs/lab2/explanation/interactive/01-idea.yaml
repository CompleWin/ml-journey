- section: Идея всей лабораторной
  say: >-
    Начнём с главной мысли всей лабораторной. [+] Представьте таблицу чистого шума: случайные числа без всякой закономерности, и у каждого признака истинная дисперсия равна единице. [+] Если посчитать по такой таблице ковариационную матрицу и её собственные числа, наивно ждёшь, что все они окажутся около единицы: шум ведь одинаков во всех направлениях. Что это за числа, мы подробно разберём чуть позже, а пока достаточно знать, что каждое из них — это разброс данных вдоль одного направления. [+] Но на деле собственные числа не собираются в одну точку, а размазываются по целому отрезку. В нашем опыте — от 0,09 до 2,9. [+] Теория случайных матриц точно описывает, какой ширины этот отрезок и как числа по нему распределены. Вот эта оранжевая кривая и есть теоретический «спектр шума».
  show: {block: scene, src: 01-idea.js, scene: smear, id: smear}

- say: >-
    Зачем знать, как выглядит спектр шума? [+] Если мы знаем его правую границу, то собственное число, которое оказалось далеко за ней, шумом уже не объяснить. [+] Значит, там настоящая структура: например, сигнал, спрятанный в шуме, или знания, которые нейросеть записала в свои веса. Так теория случайных матриц отделяет структуру от шума, и вся лабораторная построена вокруг этой идеи.
  show: {use: smear, scene: beyond}

- say: >-
    Лабораторная состоит из трёх заданий, и каждое опирается на предыдущее. [+] В первом мы смотрим на спектр чистого шума и проверяем закон Марченко–Пастура. [+] Во втором прячем в шум слабый сигнал и выясняем, начиная с какой силы метод главных компонент его вообще видит. Это фазовый переход бэ-бэ-пэ, название составлено из первых букв фамилий авторов. [+] В третьем применяем ту же теорию к весам настоящей нейросети: по спектру матрицы весов отличаем обученный слой от необученного и от выродившегося, причём без всяких тестовых данных. Это теория Мартина и Махони.
  show:
    block: diagram
    direction: lr
    nodes: ['t1: Задание 1. Шум — закон Марченко–Пастура', 't2: Задание 2. Сигнал в шуме — переход BBP', 't3: Задание 3. Веса ResNet-18 — теория Мартина–Махони']
    edges: ['t1 -> t2', 't2 -> t3']
    reveal: by-node

- say: Быстрая проверка.
  quiz:
    q: 'Что на самом деле происходит с собственными числами выборочной ковариации чистого шума с истинной дисперсией 1?'
    options:
    - {text: 'Все они примерно равны 1', why: 'Это наивное ожидание. На деле числа размазываются по отрезку: в нашем опыте от 0,09 до 2,9.'}
    - 'Они размазываются по отрезку определённой ширины'
    - {text: 'Все они равны 0', why: 'Нулевые собственные числа появляются, только когда признаков больше, чем наблюдений, и то не все.'}
    answer: 2
    explain: 'Верно. Ширину и форму этого «спектра шума» описывает теория случайных матриц — закон Марченко–Пастура.'
