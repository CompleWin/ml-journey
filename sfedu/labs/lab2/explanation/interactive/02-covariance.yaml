- section: Минимум теории
  say: >-
    Теперь минимум теории, без которого дальше не обойтись. Начнём с данных. Данные хранятся в матрице, её обозначают буквой икс. [+] В этой лабораторной строки матрицы — это признаки, их пэ штук. Одна строка — одна измеренная величина, например рост, сразу у всех людей. [+] А столбцы — это наблюдения, их эн штук. Один столбец — один объект, например один человек со всеми его признаками. [+] Учтите, что в библиотеках машинного обучения, например в sklearn, обычно наоборот: объекты лежат в строках. Здесь договорились так, и все формулы дальше записаны для такой ориентации.
  show: {block: scene, src: 02-covariance.js, scene: mat, id: mat}

- say: >-
    Главный параметр всей теории — отношение числа признаков к числу наблюдений. Его обозначают греческой буквой гамма: гамма равна пэ, делённому на эн. [+] Пример. Пусть признаков 500, а наблюдений 1000. Тогда гамма равна одной второй: на каждый признак приходится по два наблюдения, и матрица получается широкой. [+] А если признаков 2000 при той же тысяче наблюдений, гамма равна двум: признаков вдвое больше, чем наблюдений, и матрица высокая. [+] Интуиция такая: чем больше гамма, тем меньше данных приходится на один признак и тем сильнее шум искажает картину. Именно эти два случая мы и разберём в первом задании.
  show: {use: mat, scene: gamma}

- say: >-
    Следующий объект — выборочная ковариация. Сначала два понятия, из которых она состоит. [+] Дисперсия признака — это средний квадрат его значений, то есть насколько сильно он разбросан вокруг нуля. На картинке каждому значению соответствует квадрат со стороной, равной этому значению, и дисперсия — это средняя площадь таких квадратов. У нашего шума среднее и так равно нулю, поэтому квадраты считаем прямо от значений. [+] Ковариация двух признаков — это среднее произведение их значений. Если признаки растут и падают вместе, их произведения в основном положительные, ковариация больше нуля, и облако точек вытянуто по диагонали. [+] Если признаки никак не связаны, положительные и отрицательные произведения гасят друг друга, ковариация близка к нулю, и облако круглое.
  show: {block: scene, src: 02-covariance.js, scene: cov}

- say: >-
    Теперь соберём всё в одну матрицу. Выборочная ковариация обозначается сигмой с крышкой и равна икс, умноженной на икс транспонированную и делённой на эн. Откуда такая формула? [+] Возьмём пару признаков, например рост и вес. Элемент ковариации для этой пары получается так: берём строку роста и строку веса, перемножаем их значения у каждого наблюдения, складываем и делим на эн. Это и есть среднее произведение, то есть ковариация. Именно это и делает произведение матрицы на её транспонированную. [+] Если взять одну и ту же строку дважды, получится средний квадрат, то есть дисперсия. Поэтому на диагонали стоят дисперсии признаков, [+] а вне диагонали — ковариации между разными признаками. [+] Матрица получается квадратной, пэ на пэ: по строке и по столбцу на каждый признак.
  show: {block: scene, src: 02-covariance.js, scene: xxt}

- say: >-
    Проверим на маленьком примере: два признака и четыре наблюдения. Первый признак принимает значения один, минус один, один, минус один, второй — те же самые. [+] Дисперсия первого признака: все квадраты равны единице, их среднее — тоже единица. [+] Ковариация: все произведения тоже равны единице, среднее — единица. Признаки полностью согласованы. [+] А если второй признак — один, один, минус один, минус один, то произведения равны плюс один, минус один, минус один и плюс один, а их среднее — ноль. Такие признаки не связаны.
  show:
    block: derivation
    lines:
    - 'x_1 = (1,\,-1,\,1,\,-1),\qquad x_2 = (1,\,-1,\,1,\,-1)'
    - {tex: '\hat\Sigma_{11} = \tfrac14\,(1 + 1 + 1 + 1) = 1', note: 'дисперсия — средний квадрат'}
    - {tex: '\hat\Sigma_{12} = \tfrac14\,(1 + 1 + 1 + 1) = 1', note: 'ковариация — среднее произведение'}
    - {tex: 'x_2 = (1,\,1,\,-1,\,-1):\quad \hat\Sigma_{12} = \tfrac14\,(1 - 1 - 1 + 1) = 0', note: 'признаки не связаны'}

- say: Быстрая проверка.
  quiz:
    q: 'Признаков 300, наблюдений 1200. Чему равна $\gamma$?'
    answer: 0.25
    tol: 0.01
    hint: '$\gamma = p / n$'
    explain: '$300 / 1200 = 0{,}25$: на каждый признак приходится четыре наблюдения.'

- say: И ещё один вопрос.
  quiz:
    q: 'Что стоит на диагонали выборочной ковариации $\hat\Sigma = XX^T/n$?'
    options:
    - {text: 'Ковариации между разными признаками', why: 'Ковариации стоят вне диагонали: там встречаются строки двух разных признаков.'}
    - 'Дисперсии признаков'
    - {text: 'Число наблюдений $n$', why: 'На $n$ мы делим, но в самой матрице его нет.'}
    answer: 2
    explain: 'На диагонали строка умножается сама на себя: получается средний квадрат, то есть дисперсия.'
