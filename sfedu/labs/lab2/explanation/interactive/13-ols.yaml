- section: Наивная оценка α (МНК по гистограмме) не работает
  say: >-
    Как найти альфу? Сначала идея, которая приходит в голову первой. Пусть плотность равна константе, умноженной на лямбду в степени минус альфа. [+] Тогда её логарифм равен логарифму константы минус альфа, умноженное на логарифм лямбды: логарифм произведения — это сумма логарифмов, а логарифм степени — показатель, умноженный на логарифм. [+] Значит, в осях «логарифм лямбды — логарифм плотности» степенной закон превращается в прямую с наклоном минус альфа. Можно построить гистограмму, взять логарифмы и провести через точки прямую методом наименьших квадратов, сокращённо МНК. Этот метод подбирает прямую так, чтобы сумма квадратов вертикальных отклонений точек от неё была наименьшей. Наклон прямой и даст альфу.
  show:
    block: derivation
    lines:
    - '\rho(\lambda) = C\,\lambda^{-\alpha}'
    - {tex: '\ln\rho = \ln C - \alpha\,\ln\lambda', note: 'логарифм произведения и степени'}
    - {tex: 'y = \ln\rho,\ x = \ln\lambda:\quad y = c - \alpha\, x', note: 'прямая с наклоном $-\alpha$'}

- say: >-
    Так и сделали для спектра слоя layer4.1.conv2, меняя только число бинов гистограммы, то есть интервалов, на которые режется ось. При десяти бинах альфа получилась 2,20. [+] При двадцати — 1,69. [+] При пятидесяти — 1,29. [+] При ста — 1,07. [+] А при двухстах — всего 0,88. Данные одни и те же, а оценка меняется в два с половиной раза в зависимости от того, как нарезали ось. Значит, это не свойство слоя, а артефакт метода.
  show:
    block: table
    cols: ['бинов', '$\alpha$ (МНК)']
    rows: [['10', '2,20'], ['20', '1,69'], ['50', '1,29'], ['100', '1,07'], ['200', '0,88']]
    reveal: by-row

- say: >-
    Почему так? Первая причина — линейные бины и редкий хвост. [+] Вот точки для двадцати бинов: по горизонтали логарифм лямбды, по вертикали логарифм плотности, и прямая через них. [+] А вот двести бинов. В хвосте собственных чисел мало, и почти все хвостовые бины либо пустые, либо содержат одно-два числа. [+] Пустые бины приходится выбрасывать, потому что логарифма нуля не существует. [+] А бины с одним числом все дают одну и ту же высоту и выстраиваются в горизонтальный «пол». Над ним — ряды для двух, трёх и четырёх чисел. [+] Чем больше бинов, тем больше точек на полу, тем положе прямая и тем меньше альфа.
  show: {block: scene, src: 13-ols.js, scene: floor}

- say: >-
    Может, взять логарифмические бины, которые расширяются вправо? Тогда в хвостовые бины попадёт больше точек. Например, бины от одного до двух, от двух до четырёх, от четырёх до восьми: каждый следующий вдвое шире, то есть ширина растёт пропорционально лямбде. [+] Число точек в бине — это плотность, умноженная на ширину: лямбда в степени минус альфа, умноженная на лямбду. Получается лямбда в степени один минус альфа. [+] Если забыть поделить счётчик на ширину бина, наклон сдвинется на единицу, и вместо альфы получится альфа минус один. [+] А если поделить, наклон правильный, но остаются шум и зависимость от того, как выбраны бины.
  show:
  - {block: scene, src: 13-ols.js, scene: logbins, size: [800, 900]}
  - block: derivation
    lines:
    - {tex: '[1,2],\ [2,4],\ [4,8]:\quad \Delta\lambda \propto \lambda', note: 'логарифмические бины'}
    - {tex: 'N_{\text{bin}} \approx \rho(\lambda)\,\Delta\lambda \propto \lambda^{-\alpha}\cdot\lambda = \lambda^{1-\alpha}', note: 'счётчик = плотность × ширина'}
    - {tex: '\ln N_{\text{bin}} = c + (1 - \alpha)\ln\lambda', note: 'наклон сдвинут на 1: получим $\alpha - 1$'}
    - {tex: 'N_{\text{bin}} / \Delta\lambda \propto \lambda^{-\alpha}', note: 'деление чинит наклон, но шум и выбор бинов остаются'}

- say: >-
    Третья причина — нарушены условия самого метода наименьших квадратов. [+] Он предполагает, что ошибки у всех точек независимы и имеют одинаковый разброс. [+] Но посмотрите на логарифм маленького счётчика. Если в бине вместо одного числа оказалось два, логарифм прыгает на 0,69. А если вместо ста — сто одно, логарифм меняется всего на одну сотую. [+] Значит, разброс огромен как раз в хвосте, где и решается наклон. [+] К тому же точки гистограммы — не независимые наблюдения, а результат нашей группировки. Поэтому оценка несостоятельна: даже с ростом данных она не сходится к истинному альфа.
  show: {block: scene, src: 13-ols.js, scene: logcount}

- say: >-
    В ноутбуке это два графика. [+] Слева двадцать бинов: прямая с наклоном, который даёт альфу 1,69. [+] Справа двести: хорошо видны горизонтальные ряды точек, и прямая заметно положе, альфа всего 0,88.
  show:
    block: figure
    src: figures/task3_ols.png
    marks: [{at: [0.25, 0.12], text: 'bins = 20: α = 1,69'}, {at: [0.84, 0.82], text: '«пол» из одиночных бинов'}]
    reveal: by-mark

- say: Быстрая проверка.
  quiz:
    q: 'Что происходит с МНК-оценкой $\alpha$ по гистограмме с линейными бинами, если увеличивать число бинов?'
    options:
    - {text: 'Растёт', why: 'Наоборот: растёт число точек на горизонтальном «полу», и прямая становится положе.'}
    - 'Уменьшается: больше точек на «полу», прямая положе'
    - {text: 'Не меняется', why: 'В опыте она менялась от 2,20 до 0,88 — в два с половиной раза.'}
    answer: 2
    explain: 'Одиночные бины дают одинаковую высоту. Чем их больше, тем положе прямая и тем меньше $\alpha$.'
