- section: Слепой тест на четырёх слоях
  say: >-
    Финальная проверка — слепой тест. Берём четыре слоя, состояние которых мы знаем заранее, и смотрим, различит ли их диагностика без всяких данных. [+] Первый, layer1.0.conv1: его веса заменили шумом из нормального распределения с тем же сигма, что у настоящих весов. Это имитация необученного слоя. [+] Второй, layer2.0.conv1, оставили без изменений. [+] Третий, layer3.0.conv1, испортили: через сингулярное разложение оставили только два старших сингулярных числа, а остальные занулили. Получилась матрица ранга два. [+] Четвёртый — выходной полносвязный слой fc, тоже без изменений.
  show: {block: scene, src: 15-layers.js, scene: four}

- say: >-
    Как сделать матрицу ранга два? [+] Раскладываем её в произведение у, эс, вэ транспонированное. На диагонали эс стоят сингулярные числа по убыванию; у этого слоя первые из них 2,89, 2,14, 2,08 и так далее. [+] Оставляем первые два, а все остальные заменяем нулями. [+] Собираем матрицу обратно. Теперь у неё только два ненулевых сингулярных числа, а значит, и только два ненулевых собственных числа.
  show: {block: scene, src: 15-layers.js, scene: rank2}

- say: >-
    Для каждого слоя считаем три величины. Первая — стабильный ранг, по-английски stable rank. [+] Это сумма всех собственных чисел, делённая на наибольшее из них. [+] Сумма — это вся энергия слоя, а наибольшее число — энергия самого сильного направления. Через нормы матрицы это квадрат нормы Фробениуса, то есть сумма квадратов всех весов, делённый на квадрат спектральной нормы, то есть наибольшего растяжения. Отношение показывает, на сколько направлений энергия реально распределена. [+] Если все собственные числа одинаковые, например четыре единицы, стабильный ранг равен четырём, то есть их количеству. [+] А если одно число равно четырём, а остальные нулю, стабильный ранг равен единице, как у матрицы ранга один.
  show: {block: scene, src: 15-layers.js, scene: srank}

- say: >-
    Вторая величина — показатель альфа по оценщику Хилла, как мы только что разобрали. Третья — граница шума для этого слоя. [+] Она считается по формуле Марченко–Пастура: сигма квадрат на квадрат единицы плюс корень из гаммы. [+] Здесь гамма — меньший размер матрицы, делённый на больший. [+] А сигма квадрат — дисперсия весов слоя. Для обученного слоя такая сигма квадрат даже завышена: в неё входит не только шум, но и выученная структура. Значит, настоящая граница шума ещё левее, и всё, что правее нашей лямбда плюс, точно не шум.
  show:
    block: formula
    reveal: by-part
    parts:
    - {tex: '\lambda_+ = \sigma^2\,(1 + \sqrt{\gamma})^2', note: 'граница шума по закону МП'}
    - {tex: ',\quad \gamma = \dfrac{\min(M, K)}{\max(M, K)}', note: 'меньший размер к большему'}
    - {tex: ',\quad \sigma^2 = \mathrm{Var}(W)', note: 'с запасом: включает и структуру'}

- say: >-
    Вот спектры четырёх слоёв. Высота столбиков в логарифмическом масштабе, чтобы были видны одиночные собственные числа, а пунктир — граница шума лямбда плюс. [+] Случайный слой: все собственные числа левее границы. [+] Штатный слой: часть чисел перешла границу и тянется вправо. [+] Коллапсированный: огромный столбец около нуля и два одиноких числа далеко справа. [+] Выходной слой: длинный хвост уходит далеко за границу.
  show: {block: scene, src: 15-layers.js, scene: panels}

- say: >-
    Числа сведены в таблицу. [+] У случайного слоя стабильный ранг 37,5, альфа около десяти, в хвосте 14 точек, за границу не вышло ни одно из 64 чисел, а максимум равен 0,96 от границы. [+] У штатного стабильный ранг 31,8, альфа 9,4, в хвосте 10 точек, за границей 18 чисел из 128, а максимум в 1,86 раза больше границы. [+] У коллапсированного стабильный ранг 1,55, альфы нет, за границей 2 числа из 256, а максимум почти в 80 раз больше границы. [+] У выходного стабильный ранг 34,6, альфа 3,38, в хвосте 59 точек, за границей 35 чисел из 512, и максимум в 5 раз больше границы.
  show:
    block: table
    cols: ['слой', 'srank', '$\alpha$', 'точек в хвосте', '$\lambda > \lambda_+$', '$\lambda_{max}/\lambda_+$']
    rows:
    - ['layer1.0.conv1 (случайный)', '37,47', '10,02', '14', '0 из 64', '0,96']
    - ['layer2.0.conv1 (штатный)', '31,78', '9,38', '10', '18 из 128', '1,86']
    - ['layer3.0.conv1 (коллапс)', '1,55', '—', '0', '2 из 256', '79,67']
    - ['fc (выходной)', '34,60', '3,38', '59', '35 из 512', '5,03']
    reveal: by-row

- say: >-
    Почему у случайного слоя хвоста нет, хотя альфа посчиталась? [+] Алгоритм подгонки всегда что-нибудь возвращает. Здесь он взял в «хвост» 14 самых правых чисел и выдал альфу около десяти. [+] Строгая проверка — граница Марченко–Пастура. У случайной матрицы все собственные числа лежат внутри отрезка от лямбда минус до лямбда плюс и выходят за край разве что на флуктуации порядка эн в степени минус две третьих. Оранжевая кривая — плотность Марченко–Пастура для этого слоя, и гистограмма идёт по ней. [+] Наибольшее число составляет 0,96 от границы, то есть меньше её: ни одно из 64 чисел за край не вышло. [+] Степенной хвост — это собственные числа далеко за лямбда плюс, как у выходного слоя, где максимум в пять раз больше границы. Значит, подгонка описала просто правый край балка, где плотность падает до нуля как корень из лямбда плюс минус лямбда. Хвоста здесь нет.
  show: {block: scene, src: 15-layers.js, scene: randz}

- say: >-
    А почему у коллапсированного слоя альфы нет совсем? [+] Ненулевых собственных чисел всего два. Остальные 254 — машинные нули, и их отбросила та же функция drop zeros, что в первом задании. [+] По двум точкам степенной закон не оценить. [+] Само отсутствие непрерывного спектра — признак коллапса. Его подтверждает и стабильный ранг 1,55: почти вся энергия слоя сосредоточена в одном направлении.
  show: {block: scene, src: 15-layers.js, scene: collz}

- say: Быстрая проверка.
  quiz:
    q: 'Собственные числа слоя: 3, 1, 1, 1. Чему равен stable rank?'
    answer: 2
    tol: 0.01
    hint: 'srank = сумма / наибольшее'
    explain: '$(3 + 1 + 1 + 1)/3 = 2$: энергия распределена примерно по двум направлениям.'

- say: И ещё один вопрос.
  quiz:
    q: 'Слой: 0 из 64 собственных чисел за $\lambda_+$, $\lambda_{max}/\lambda_+ = 0{,}96$, а подгонка дала $\alpha \approx 10$. Есть ли у него степенной хвост?'
    options:
    - {text: 'Да, ведь $\alpha$ посчиталась', why: 'Подгонка возвращает число всегда. Хвост — это собственные числа далеко за $\lambda_+$, а здесь их нет.'}
    - 'Нет: весь спектр внутри балка, подгонка описала его правый край'
    - {text: 'Да, и это «зона Златовласки»', why: 'Зона Златовласки — $2 < \alpha \le 4$, и только при настоящем хвосте за $\lambda_+$.'}
    answer: 2
    explain: 'Строгая проверка — граница МП: ни одно число за неё не вышло, значит, это чистый шум, фаза Random-like.'
