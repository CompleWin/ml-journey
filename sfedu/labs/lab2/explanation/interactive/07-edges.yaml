- section: Почему эксперимент не совпал с теорией точно
  say: >-
    Почему эксперимент совпал с теорией не до последнего знака? Приблизим правый край спектра режима А. [+] Формулы для краёв — это пределы, к которым всё стремится, когда размер матрицы растёт до бесконечности. Лямбда плюс, равная 2,9142, — именно такой предел. [+] У нас же эн равно тысяче. Это много, но не бесконечность, поэтому наибольшее число вышло 2,9048, и расхождение появилось в третьем знаке. [+] Говорят, что у спектра «мягкие» края. Наибольшее собственное число — случайная величина: если повторить опыт с новым шумом, оно немного сдвинется и будет гулять вокруг лямбда плюс, то чуть левее, то чуть правее.
  show: {block: scene, src: 07-edges.js, scene: edge}

- say: >-
    Насколько сильно гуляет максимум? Масштаб этих колебаний задаёт формула. [+] Первый множитель: сигма квадрат на единицу плюс корень из гаммы в степени четыре третьих. [+] Второй: гамма в степени минус одна шестая. [+] И главный: эн в степени минус две третьих. Чем больше матрица, тем меньше колебания. [+] Для гаммы одна вторая и эн, равного тысяче, получается примерно 0,023. Тысяча в степени минус две третьих — это одна сотая, а первые два множителя вместе дают примерно 2,3.
  show:
    block: formula
    reveal: by-part
    parts:
    - {tex: 's = \sigma^2(1+\sqrt{\gamma})^{4/3}', note: '$\approx 2{,}04$ при $\gamma = 0{,}5$'}
    - {tex: '\cdot\,\gamma^{-1/6}', note: '$\approx 1{,}12$'}
    - {tex: '\cdot\,n^{-2/3}', note: '$1000^{-2/3} = 0{,}01$'}
    - {tex: '\approx 0{,}023'}

- say: >-
    Чтобы увидеть, как именно гуляет максимум, ноутбук повторяет режим А двести раз, каждый раз с новым шумом. [+] В каждом повторе берём наибольшее собственное число, вычитаем лямбда плюс и делим на масштаб эс. Получается нормированное отклонение: на сколько масштабов максимум не дотянул до края или перелетел его. [+] Каждый повтор — одна точка, и точки складываются в гистограмму. [+] Теория говорит, что при больших эн это отклонение подчиняется распределению Трейси–Видома. Его обозначают тэ-вэ один, и его кривая нарисована оранжевым.
  show: {block: scene, src: 07-edges.js, scene: tw, id: tw}

- say: >-
    Что получилось. [+] Среднее нормированного отклонения минус 1,29, стандартное отклонение 1,18. [+] У распределения Трейси–Видома эти числа минус 1,21 и 1,27. Совпадение хорошее. [+] Примерно в двенадцати процентах повторов максимум оказался правее лямбда плюс. [+] Распределение несимметричное: правый хвост у него длиннее левого. Поэтому выбросы за лямбда плюс случаются регулярно.
  show: {use: tw, scene: tw2}

- say: >-
    Это и есть ответ на вопрос задания, почему максимум иногда «вылезает» за предел. [+] При конечном эн у спектра нет жёсткой стенки в точке лямбда плюс: край размыт примерно на величину эс. [+] А в нашем основном запуске максимум, наоборот, чуть не дотянул: 2,9048 меньше, чем 2,9142. [+] Это тоже нормально. Среднее распределения Трейси–Видома отрицательное, поэтому при таких размерах максимум чаще немного не доходит до края.
  show: {use: tw, scene: tw3}

- say: >-
    Практический вывод пригодится во втором задании. [+] Если собственное число вышло за лямбда плюс на величину порядка эс, это ещё ничего не доказывает: так бывает и у чистого шума. [+] Чтобы уверенно объявить, что найден сигнал, нужен запас в несколько эс. [+] В конспекте эта поправка обозначена дельта эн и берётся по квантилю распределения Трейси–Видома: порог сдвигают вправо настолько, чтобы чистый шум перелетал его лишь изредка.
  show:
    block: text
    reveal: by-para
    md: |
      - Превышение $\lambda_+$ на величину порядка $s$ — так бывает и у чистого шума.

      - Чтобы объявить сигнал, нужен запас в несколько $s$.

      - В конспекте это поправка $\delta_n$ по квантилю $TW_1$.

- say: >-
    Так этот опыт выглядит в ноутбуке. [+] По горизонтали нормированное отклонение, по вертикали плотность. [+] Пунктир — положение лямбда плюс: большая часть повторов левее него, но правый хвост за него заходит.
  show:
    block: figure
    src: figures/task1_tracy_widom.png
    marks: [{at: [0.5, 0.93], text: '(λmax − λ₊) / s'}, {at: [0.63, 0.12], text: 'λ₊'}]
    reveal: by-mark

- say: Быстрая проверка.
  quiz:
    q: 'Шум, $n = 1000$, $\gamma = 0{,}5$. Наибольшее собственное число вышло за $\lambda_+$ на 0,01. Это доказывает наличие сигнала?'
    options:
    - {text: 'Да: у шума все собственные числа левее $\lambda_+$', why: 'Это верно только в пределе $n \to \infty$. При конечном $n$ край размыт, и в 12 % повторов шум перелетал $\lambda_+$.'}
    - 'Нет: это меньше масштаба флуктуаций $s \approx 0{,}023$'
    - {text: 'Да, если повторить опыт дважды', why: 'Повторы ничего не меняют: превышение на долю $s$ — обычное поведение шума.'}
    answer: 2
    explain: 'Превышение порядка $s$ — обычная флуктуация края (распределение Трейси–Видома). Для сигнала нужен запас в несколько $s$.'
