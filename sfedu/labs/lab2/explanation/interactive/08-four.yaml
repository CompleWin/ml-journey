- section: Почему при p = n максимум стремится к 4, а не к 1
  say: >-
    Последний вопрос первого задания: почему при равном числе признаков и наблюдений наибольшее собственное число стремится к четырём, а не к единице? Подставим гамму, равную единице, в формулу края: единица плюс корень из единицы, в квадрате, — это два в квадрате, четыре. [+] Эксперимент это подтверждает: для пэ и эн, равных тысяче, получилось 4,02. [+] А ведь истинная дисперсия в любом направлении равна единице! Метод главных компонент нашёл направление, где дисперсия вчетверо больше настоящей. Разберёмся, как такое возможно, с двух сторон: статистической и геометрической.
  show:
    block: derivation
    lines:
    - '\gamma = 1:\quad \lambda_+ = (1 + \sqrt{1})^2 = 4'
    - {tex: '\hat\lambda_{max} = 4{,}02', note: 'эксперимент, $p = n = 1000$'}
    - {tex: '\sigma^2 = 1', note: 'истинная дисперсия в любом направлении'}

- say: >-
    Сначала статистический смысл. [+] Возьмём одно направление, выбранное заранее, до того как мы увидели данные. Выборочная дисперсия вдоль него — это среднее из тысячи случайных квадратов, и по закону больших чисел она близка к единице. [+] Вот дисперсии вдоль двенадцати случайных направлений для нашей матрицы тысяча на тысячу: все около единицы. [+] Но метод главных компонент выбирает направление не заранее, а по тем же самым данным. Он перебирает все направления тысячемерного пространства и берёт то, где разброс максимален. [+] А максимум по огромному числу направлений всегда цепляется за случайные совпадения в выборке. Вот и получается четыре. По сути, это переобучение на шум: метод подстроился под случайности конкретной выборки.
  show: {block: scene, src: 08-four.js, scene: dirs}

- say: >-
    То же можно объяснить через ошибки отдельных элементов матрицы. [+] Каждый элемент выборочной ковариации ошибается совсем чуть-чуть, примерно на единицу, делённую на корень из эн. При эн, равном тысяче, это около трёх сотых. [+] Но элементов в матрице примерно пэ квадрат пополам, для тысячи признаков это полмиллиона. [+] Маленькие ошибки всех этих элементов складываются в собственных числах. Поэтому, когда пэ растёт вместе с эн, выборочная ковариация не сходится к единичной матрице, сколько бы данных ни было.
  show: {block: scene, src: 08-four.js, scene: errs}

- say: >-
    Теперь геометрический смысл. [+] Мы ожидаем, что облако шума — идеальный шар: во всех направлениях одинаковый разброс, и все полуоси равны единице. [+] Но облако из тысячи точек в тысячемерном пространстве похоже не на шар, а на сильно сплюснутый эллипсоид. [+] Его полуоси равны корням из собственных чисел и разбросаны от почти нуля до двух: корень из четырёх — это два.
  show: {block: scene, src: 08-four.js, scene: ball, id: geo}

- say: >-
    При этом среднее всех собственных чисел остаётся равным единице. Здесь сорок столбиков — собственные числа нашей матрицы, взятые через равные промежутки от самого маленького до самого большого. [+] Почему среднее не меняется? Сумма собственных чисел равна следу матрицы, то есть сумме её диагональных элементов. [+] А на диагонали стоят выборочные дисперсии отдельных признаков, и каждая из них близка к единице. Значит, и среднее собственное число около единицы. [+] Получается, дисперсия никуда не делась, она просто перераспределилась: по одним осям завышена почти до четырёх, по другим занижена почти до нуля.
  show: {use: geo, scene: trace}

- say: >-
    Отсюда важное следствие для практики. На чистом шуме метод главных компонент «находит» компоненту с дисперсией вчетверо больше настоящей. [+] Популярное правило «оставляем компоненты с собственным числом больше единицы» на таких данных набирает один шум: таких чисел здесь сотни. [+] Сравнивать надо не с единицей, а с краем шума лямбда плюс. Именно так мы и будем искать сигнал во втором задании.
  show:
    block: compare
    titles: [Неверно, Верно]
    style: good-bad
    reveal: by-side
    left: 'Правило «$\lambda > 1$»: на чистом шуме при $p = n$ набирает сотни компонент.'
    right: 'Сравнивать с краем шума $\lambda_+ = \sigma^2(1+\sqrt{\gamma})^2$.'

- say: Быстрая проверка.
  quiz:
    q: 'Белый шум с $\sigma^2 = 1$, $p = n = 1000$. Около какого значения окажется наибольшее собственное число выборочной ковариации?'
    answer: 4
    tol: 0.15
    hint: '$\lambda_+ = (1 + \sqrt{\gamma})^2$ при $\gamma = 1$'
    explain: '$(1 + 1)^2 = 4$; в ноутбуке получилось 4,02.'

- say: И ещё один вопрос.
  quiz:
    q: 'Почему среднее собственное число выборочной ковариации шума остаётся около 1, хотя наибольшее близко к 4?'
    options:
    - {text: 'Так нормирует данные PCA', why: 'PCA ничего не нормирует: он только ищет главные оси.'}
    - 'Сумма собственных чисел равна следу, а на диагонали стоят дисперсии около 1'
    - {text: 'Это случайное совпадение', why: 'Это не случайность: след матрицы равен сумме собственных чисел.'}
    answer: 2
    explain: 'След сохраняется: дисперсия только перераспределяется между осями — где-то до 4, где-то почти до 0.'
