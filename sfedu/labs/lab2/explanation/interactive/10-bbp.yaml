- section: 'Задание 2. Сигнал в шуме: фазовый переход BBP'
  say: >-
    Прежде чем смотреть на графики, представим, что происходит, пока сила сигнала растёт. [+] Слева — спектр: балк шума Марченко–Пастура и самое большое собственное число. Справа — истинное направление сигнала и направление, которое нашёл метод главных компонент. [+] Пока сигнал слабый, наибольшее собственное число сидит на краю балка, а найденное направление случайно и почти перпендикулярно истинному. [+] Как только тэта переходит порог 0,707, собственное число отрывается от балка и уходит вправо, [+] а найденное направление начинает поворачиваться к истинному. [+] Это и называется фазовым переходом: поведение резко меняется, когда сила сигнала пересекает порог.
  show: {block: scene, src: 10-bbp.js, scene: trans}

- say: >-
    Теперь настоящие результаты. По горизонтали сила сигнала тэта, по вертикали старшее собственное число. [+] Синие точки — эксперимент, каждая точка — среднее по пяти повторам. [+] Оранжевая линия — теория бэ-бэ-пэ. [+] При тэта до 0,7 точки лежат на уровне от 2,89 до 2,91, то есть просто на краю шума. Сигнал есть, ведь дисперсия первого признака больше единицы, но собственное число его не замечает: сигнал полностью тонет в шуме. [+] Выше порога собственное число отрывается от балка и идёт по формуле. При тэта, равном единице, эксперимент дал 3,02 при теории 3,00, а при тэта 2,5 — 4,24 при теории 4,20.
  show: {block: scene, src: 10-bbp.js, scene: lamplot}

- say: >-
    Второй график — перекрытие найденного направления с истинным. [+] Ниже порога точки лежат почти на нуле: при тэта до 0,5 перекрытие меньше трёх тысячных. Метод главных компонент выдаёт случайное направление. [+] Выше порога перекрытие растёт по формуле Пола и Бенайча-Жорже. [+] При тэта, равном единице, эксперимент дал 0,36 при теории 0,33. [+] А при тэта 2,5 — 0,77, и теория даёт те же 0,77.
  show: {block: scene, src: 10-bbp.js, scene: ovplot}

- say: >-
    Разберём формулу перекрытия. В числителе единица минус гамма на тэта в квадрате, в знаменателе единица плюс гамма на тэта. [+] В точке порога тэта в квадрате равно гамме, и числитель обращается в ноль: перекрытие начинает расти с нуля. [+] При тэта 2,5 гамма на тэта в квадрате — это 0,08, а гамма на тэта — 0,2. Перекрытие равно 0,92, делённому на 1,2, то есть примерно 0,77. Это меньше единицы: найденное направление всё ещё заметно скошено шумом. [+] Чтобы оно почти совпало с истинным, обе дроби должны быть малы, то есть тэта в квадрате должно быть намного больше гаммы.
  show:
    block: derivation
    lines:
    - {tex: '|\langle \hat v_1, v_1\rangle|^2 \to \dfrac{1 - \gamma/\theta^2}{1 + \gamma/\theta}', note: 'формула Пола — Бенайча-Жорже, $\theta > \theta_c$'}
    - {tex: '\theta = \sqrt{\gamma}:\quad 1 - \gamma/\gamma = 0', note: 'рост начинается с нуля'}
    - {tex: '\theta = 2{,}5:\quad \dfrac{1 - 0{,}08}{1 + 0{,}2} \approx 0{,}77', note: 'всё ещё меньше 1'}
    - {tex: '\theta^2 \gg \gamma \;\Rightarrow\; |\langle \hat v_1, v_1\rangle|^2 \to 1', note: 'только тогда направление почти точное'}

- say: >-
    Ещё одна деталь на графике собственного числа. [+] Теория предсказывает излом ровно в точке порога. [+] А экспериментальные точки около порога идут плавно, без резкого излома: при тэта 0,7 уже 2,908, при 0,8 — 2,929, при 0,9 — 2,961. [+] Это нормально: при конечных пэ и эн переход размыт, а резким он становится только в пределе бесконечно больших матриц, как и края спектра в первом задании.
  show: {block: scene, src: 10-bbp.js, scene: kink}

- say: >-
    Главный вывод второго задания. При заданном отношении пэ к эн у метода главных компонент есть жёсткий предел чувствительности: тэта це, равное корню из пэ на эн. Сигнал слабее порога он не видит в принципе, какой бы точной ни была арифметика. Чтобы увидеть слабый сигнал, нужно больше наблюдений, то есть меньше гамма. На графике теоретическое перекрытие, а гамма плавно уменьшается от одной второй до одной десятой: порог сдвигается влево, и всё более слабые сигналы становятся видны. После шага можете сами подвигать ползунок гаммы.
  show:
    block: plot
    fn: [{f: 'max(0, (1 - g/x^2)/(1 + g/x))', label: 'перекрытие'}]
    params: {g: [0.05, 1, 0.5]}
    sweep: {g: [0.5, 0.1]}
    xrange: [0.02, 2.5]
    yrange: [0, 1]
    xlabel: '$\theta$'
    ylabel: '$|\langle \hat v_1, v_1\rangle|^2$'

- say: >-
    Посчитаем на примере. Пусть признаков по-прежнему 1500, а мы хотим замечать сигнал силы 0,5. [+] Для этого порог, корень из пэ на эн, должен стать меньше 0,5. [+] Возводим в квадрат: пэ на эн меньше одной четверти, то есть наблюдений должно быть больше, чем четыре пэ. [+] Это больше шести тысяч наблюдений вместо наших трёх тысяч.
  show:
    block: derivation
    lines:
    - 'p = 1500,\quad \theta = 0{,}5'
    - {tex: '\sqrt{p/n} < 0{,}5', note: 'порог ниже силы сигнала'}
    - {tex: 'p/n < 0{,}25 \;\Rightarrow\; n > 4p', note: 'возвели в квадрат'}
    - 'n > 6000'

- say: >-
    Так результаты выглядят в ноутбуке. [+] Слева старшее собственное число: точки эксперимента, оранжевая теория и пунктир порога. [+] Справа перекрытие: почти ноль до порога и рост после него.
  show:
    block: figure
    src: figures/task2_bbp.png
    marks: [{at: [0.27, 0.5], text: 'λ̂₁(θ)'}, {at: [0.77, 0.5], text: 'перекрытие'}]
    reveal: by-mark

- say: Быстрая проверка.
  quiz:
    q: 'Признаков $p = 1500$. Сколько наблюдений нужно, чтобы порог $\theta_c = \sqrt{p/n}$ стал равен 0,5?'
    answer: 6000
    tol: '1%'
    hint: '$\sqrt{p/n} = 0{,}5 \Rightarrow p/n = 0{,}25$'
    explain: '$n = p / 0{,}25 = 4p = 6000$.'

- say: И ещё один вопрос.
  quiz:
    q: '$p = 1500$, $n = 3000$, сила сигнала $\theta = 0{,}6$. Что покажет PCA?'
    options:
    - {text: 'Собственное число заметно больше $\lambda_+$ и направление, близкое к истинному', why: 'Так будет только выше порога $\theta_c \approx 0{,}707$, а 0,6 ниже него.'}
    - '$\hat\lambda_1 \approx \lambda_+$ и случайное направление: сигнал ниже порога'
    - {text: 'Нулевое старшее собственное число', why: 'Старшее собственное число шума равно краю $\lambda_+ \approx 2{,}9$, а не нулю.'}
    answer: 2
    explain: '$0{,}6 < \theta_c = \sqrt{0{,}5} \approx 0{,}707$: сигнал тонет в шуме, PCA его не видит.'
