- section: Итоговая классификация
  say: >-
    Сопоставим слои с пятью фазами Мартина–Махони. [+] Слой layer1.0.conv1 — первая фаза, рэндом-лайк, чистый белый шум: весь спектр внутри балка, за лямбда плюс ничего. [+] Слой layer2.0.conv1 — между второй и третьей фазами: 18 чисел вышли за лямбда плюс, значит, структура выучена. Но максимум лишь в 1,9 раза больше границы, хвост короткий и крутой, альфа около девяти, то есть больше четырёх. [+] Слой layer3.0.conv1 — пятая фаза, коллапс ранга: два ненулевых собственных числа из 256, стабильный ранг около полутора. [+] Выходной слой fc — четвёртая фаза, тяжёлый хвост, зона Златовласки: хвост тянется до пяти лямбда плюс, а альфа 3,38 лежит между двумя и четырьмя.
  show: {block: scene, src: 16-verdict.js, scene: map}

- say: >-
    Важная оговорка про надёжность альфы. У маленьких слоёв хвост состоит из десятка точек, а погрешность, напомню, примерно альфа минус один, делённое на корень из числа точек хвоста. [+] У layer2.0.conv1 получается 9,4 плюс-минус 2,7: точек в хвосте всего десять. [+] А у fc — 3,38 плюс-минус 0,31: точек в хвосте 59, и оценка намного точнее.
  show:
    block: derivation
    lines:
    - '\Delta\alpha \approx \dfrac{\alpha - 1}{\sqrt{N_{tail}}}'
    - {tex: '\text{layer2.0.conv1}:\quad \dfrac{9{,}38 - 1}{\sqrt{10}} \approx 2{,}7', note: '$\alpha = 9{,}4 \pm 2{,}7$'}
    - {tex: '\text{fc}:\quad \dfrac{3{,}38 - 1}{\sqrt{59}} \approx 0{,}31', note: '$\alpha = 3{,}38 \pm 0{,}31$'}

- say: >-
    К тому же у layer2.0.conv1 есть два почти одинаково хороших порога. [+] Короткий хвост из десяти точек с альфой около 9,4 и расстоянием дэ 0,130. [+] И длинный хвост из 67 точек с альфой около 2,2 и расстоянием 0,143. [+] Критерий Колмогорова–Смирнова выбирает первый, потому что его дэ меньше, но разница совсем маленькая. [+] Поэтому про этот слой уверенно можно сказать только две вещи: он не шум, ведь 18 чисел за лямбда плюс, и он не выродился, ведь стабильный ранг 32. А вывод по выходному слою надёжный.
  show: {block: scene, src: 16-verdict.js, scene: twothr}

- say: >-
    Так спектры слоёв выглядят в ноутбуке. [+] Верхний ряд — случайный и штатный слои. [+] Нижний ряд — коллапсированный и выходной. Красный пунктир на каждом графике — граница шума лямбда плюс.
  show:
    block: figure
    src: figures/task3_layers.png
    marks: [{at: [0.5, 0.3], text: 'случайный и штатный'}, {at: [0.5, 0.78], text: 'коллапс и выходной'}]
    reveal: by-mark

- say: Быстрая проверка.
  quiz:
    q: 'Что про слой layer2.0.conv1 можно утверждать уверенно?'
    options:
    - {text: 'Он в «зоне Златовласки»', why: 'Его α ≈ 9,4 ± 2,7, а второй почти равный порог даёт α ≈ 2,2: выбор режима ненадёжен.'}
    - 'Он не шум и не выродился'
    - {text: 'У него коллапс ранга', why: 'Стабильный ранг 32 — энергия распределена по многим направлениям.'}
    answer: 2
    explain: '18 чисел за $\lambda_+$ — не шум; srank 32 — не коллапс. Точнее про $\alpha$ сказать нельзя.'

- say: И ещё один вопрос.
  quiz:
    q: 'Какой из четырёх слоёв попал в «зону Златовласки»?'
    options: ['layer1.0.conv1', 'layer2.0.conv1', 'layer3.0.conv1', 'fc']
    answer: 4
    explain: 'У fc длинный хвост до $5\lambda_+$ и $\alpha = 3{,}38 \in (2, 4]$, причём оценка надёжная: $\pm 0{,}31$.'
