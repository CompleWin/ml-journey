- section: Минимум теории
  say: >-
    Следующая идея — дисперсия вдоль направления. Представим облако точек на плоскости: каждая точка — одно наблюдение с двумя признаками. [+] Выберем направление, то есть стрелку единичной длины. Обозначим её вэ. [+] Спроецируем все точки на прямую этого направления, как будто светим фонариком перпендикулярно ей, и посмотрим, насколько разбросаны тени. [+] Разброс теней и есть дисперсия данных вдоль направления вэ. Считать её можно прямо по ковариационной матрице: вэ транспонированное, умноженное на сигму с крышкой и снова на вэ. Красиво то, что одна матрица хранит дисперсию сразу для всех направлений.
  show: {block: scene, src: 03-eigen.js, scene: proj, id: cloud}

- say: >-
    Теперь будем поворачивать стрелку и следить за разбросом теней справа. [+] Вдоль длинной стороны облака разброс самый большой. [+] А поперёк облака — самый маленький. [+] Эти два особых направления называют главными осями облака. Математически это собственные векторы ковариационной матрицы, а разброс вдоль каждой оси — её собственное число. Собственные числа обозначают греческой буквой лямбда.
  show: {use: cloud, scene: rot}

- say: >-
    Метод главных компонент, сокращённо пэ-цэ-а, делает ровно это. [+] Он находит собственные векторы ковариационной матрицы, то есть главные оси облака. [+] И упорядочивает их по убыванию собственных чисел. Первая главная компонента — направление наибольшего разброса, вторая — следующее, и так далее. [+] Запомните связь, на которой держится вся лабораторная: собственное число — это дисперсия данных вдоль главной оси. Поэтому большое собственное число обычно читают так: «в этом направлении в данных что-то есть».
  show: {use: cloud, scene: pca}

- say: >-
    Набор всех собственных чисел матрицы называют её спектром. На плоскости собственных чисел всего два. [+] Но в нашей лабораторной признаков сотни и тысячи, а значит, и собственных чисел столько же, по одному на каждую главную ось. Вот, например, 500 собственных чисел из первого задания: каждая чёрточка на оси — одно число. [+] Чтобы увидеть их все сразу, строят гистограмму: разбивают ось лямбда на интервалы и считают, сколько чисел попало в каждый. [+] Такую гистограмму называют спектральной плотностью. Её форма и есть главный герой всей лабораторной.
  show: {block: scene, src: 03-eigen.js, scene: spec}

- say: >-
    Последнее понятие этого раздела — белый шум. Так называют данные, в которых все элементы матрицы независимы и распределены нормально, со средним ноль и дисперсией сигма квадрат. [+] Истинная ковариация такого шума — сигма квадрат, умноженная на единичную матрицу: на диагонали сигма квадрат, вне диагонали нули. [+] Геометрически это идеально круглое облако: в любом направлении дисперсия одна и та же, сигма квадрат, и выделенных направлений нет. [+] Значит, все истинные собственные числа равны сигме квадрат, а при единичной дисперсии — единице. Запомните это: скоро окажется, что выборочные собственные числа ведут себя совсем иначе.
  show: {block: scene, src: 03-eigen.js, scene: white}

- say: Быстрая проверка.
  quiz:
    q: 'Облако точек сильно вытянуто вдоль одной прямой. Какому собственному числу ковариации соответствует направление вдоль неё?'
    options:
    - {text: 'Наименьшему', why: 'Вдоль длинной стороны облака разброс самый большой, а собственное число и есть разброс.'}
    - 'Наибольшему'
    - {text: 'Нулевому', why: 'Ноль означал бы, что вдоль этого направления разброса нет совсем.'}
    answer: 2
    explain: 'Собственное число — это дисперсия вдоль главной оси, а вдоль длинной стороны облака она максимальна. Это первая главная компонента.'
