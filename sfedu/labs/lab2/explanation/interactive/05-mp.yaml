- section: 'Задание 1. Шум: закон Марченко–Пастура'
  say: >-
    Переходим к первому заданию. Что мы делали. [+] Генерировали матрицу белого шума: каждый элемент — случайное число из нормального распределения со средним ноль и дисперсией один. Наблюдений всегда тысяча. [+] Первый режим, назовём его режимом А: 500 признаков, гамма равна одной второй. [+] Второй, режим Б: 2000 признаков, гамма равна двум. [+] Для каждого режима считали выборочную ковариацию, её собственные числа и строили гистограмму этих чисел, а потом сравнивали её с теоретической кривой.
  show: {block: scene, src: 05-mp.js, scene: exp}

- say: >-
    Чего мы ждём? Истинная дисперсия в любом направлении равна единице, поэтому хочется, чтобы все собственные числа собрались около единицы. [+] Вот настоящая гистограмма для режима А. Числа совсем не собрались около единицы. [+] Они размазаны от 0,0859 до 2,905. [+] Самое маленькое собственное число почти в двенадцать раз меньше истинной дисперсии, а самое большое — почти в три раза больше. И это при том, что в данных нет ничего, кроме шума.
  show: {block: scene, src: 05-mp.js, scene: hist, id: hist}

- say: >-
    Теория случайных матриц предсказывает форму этой гистограммы точно. Это закон Марченко–Пастура. Вывод формулы — серьёзная математика, в лабораторной мы её не доказываем, а проверяем экспериментом. Разберём, из чего она состоит. [+] Главная часть — корень из произведения двух скобок: лямбда плюс минус лямбда и лямбда минус лямбда минус. Здесь лямбда минус и лямбда плюс — левый и правый края спектра. На каждом краю одна из скобок равна нулю, поэтому кривая начинается и заканчивается нулём. [+] Корень делится на два пи, сигму квадрат, гамму и саму лямбду. Лямбда в знаменателе поднимает левую часть кривой: маленьких собственных чисел больше, чем больших. А остальные множители подобраны так, чтобы площадь под кривой была правильной. [+] И формула действует только на отрезке от лямбда минус до лямбда плюс. Вне его плотность равна нулю: там собственных чисел просто нет.
  show:
    block: formula
    reveal: by-part
    parts:
    - {tex: '\rho_{MP}(\lambda) = \sqrt{(\lambda_+ - \lambda)(\lambda - \lambda_-)}', note: 'обращается в 0 на обоих краях'}
    - {tex: '\cdot\,\dfrac{1}{2\pi\sigma^2\gamma\lambda}', note: '$\lambda$ внизу поднимает левую часть, остальное — нормировка'}
    - {tex: ',\qquad \lambda\in[\lambda_-,\,\lambda_+]', note: 'вне отрезка плотность равна 0'}

- say: >-
    Края отрезка тоже задаются формулой: лямбда плюс-минус равна сигме квадрат, умноженной на квадрат скобки «один плюс-минус корень из гаммы». [+] Посчитаем для режима А. Сигма квадрат равна единице, гамма — одной второй, а корень из одной второй примерно 0,707. [+] Нижний край — квадрат разности единицы и 0,707, это 0,0858. [+] Верхний край — квадрат суммы, это 2,914. [+] Для режима Б корень из двух примерно 1,414, и края получаются 0,1716 и 5,828. Заметьте: чем больше гамма, тем дальше оба края от единицы.
  show:
    block: derivation
    lines:
    - '\lambda_\pm = \sigma^2\,(1 \pm \sqrt{\gamma})^2'
    - {tex: '\gamma = 0{,}5:\quad \sqrt{\gamma} \approx 0{,}707', note: 'режим А, $\sigma^2 = 1$'}
    - '\lambda_- = (1 - 0{,}707)^2 \approx 0{,}0858'
    - '\lambda_+ = (1 + 0{,}707)^2 \approx 2{,}914'
    - {tex: '\gamma = 2:\quad \lambda_- \approx 0{,}1716,\quad \lambda_+ \approx 5{,}828', note: 'режим Б, $\sqrt{2} \approx 1{,}414$'}

- say: >-
    Посмотрим, как форма плотности зависит от гаммы. Здесь гамма плавно растёт от одной десятой до двух. При маленькой гамме, когда наблюдений намного больше, чем признаков, кривая узкая и собирается вокруг единицы: оценки близки к истине. Чем больше гамма, тем шире отрезок и тем сильнее размазаны собственные числа. Когда гамма подходит к единице, левый край прижимается к нулю. После этого шага можете сами подвигать ползунок гаммы.
  show:
    block: plot
    fn: [{f: 'sqrt(max(0, ((1+sqrt(g))^2 - x)*(x - (1-sqrt(g))^2)))/(2*pi*g*x)', label: '$\rho_{MP}(\lambda)$'}]
    params: {g: [0.1, 2, 0.1]}
    sweep: {g: [0.1, 2]}
    xrange: [0.02, 6]
    yrange: [0, 1.3]
    xlabel: '$\lambda$'
    ylabel: 'плотность'

- say: >-
    Теперь наложим теорию на эксперимент. [+] Оранжевая кривая Марченко–Пастура идёт точно по гистограмме режима А. [+] А пунктирные границы лямбда минус и лямбда плюс аккуратно обрамляют все собственные числа: ни одно не вышло наружу. [+] В режиме Б картина та же, только отрезок шире: от 0,17 до 5,8. Кривая здесь уже с одной поправкой, о ней поговорим в следующей главе. [+] Вывод: чем больше гамма, то есть чем меньше данных приходится на один признак, тем шире размазка.
  show: {use: hist, scene: fit}

- say: >-
    Сведём теорию и эксперимент в таблицу. [+] При гамме одна вторая теоретический нижний край 0,0858, а наименьшее найденное число 0,0859. Верхний край по теории 2,9142, а наибольшее число 2,9048. [+] При гамме два нижний край 0,1716 против 0,1806, а верхний 5,8284 против 5,8093. Совпадение хорошее, но не до последнего знака. Почему так, разберём через одну главу.
  show:
    block: table
    cols: ['$\gamma$', '$\lambda_-$ теория', '$\lambda_{min}$ эксперимент', '$\lambda_+$ теория', '$\lambda_{max}$ эксперимент']
    rows:
    - ['0,5', '0,0858', '0,0859', '2,9142', '2,9048']
    - ['2,0', '0,1716', '0,1806', '5,8284', '5,8093']
    reveal: by-row

- say: >-
    А так этот результат выглядит в ноутбуке. Именно этот график вы будете показывать на защите. [+] Слева режим А: синяя гистограмма, оранжевая кривая теории и пунктирные границы. [+] Справа режим Б: отрезок шире, и кривая совпадает с гистограммой после поправки. [+] В заголовках подписаны пэ, эн и гамма каждого режима.
  show:
    block: figure
    src: figures/task1_mp.png
    marks: [{at: [0.25, 0.55], text: 'режим А, γ = 0,5'}, {at: [0.75, 0.55], text: 'режим Б, γ = 2'}, {at: [0.5, 0.1], text: 'p, n и γ в заголовках'}]
    reveal: by-mark

- say: Быстрая проверка.
  quiz:
    q: 'Белый шум с $\sigma^2 = 1$, $\gamma = 0{,}25$. Чему равен правый край спектра $\lambda_+$?'
    answer: 2.25
    tol: 0.02
    hint: '$\lambda_+ = (1 + \sqrt{\gamma})^2$, а $\sqrt{0{,}25} = 0{,}5$'
    explain: '$(1 + 0{,}5)^2 = 2{,}25$.'

- say: И ещё один вопрос.
  quiz:
    q: 'Признаков столько же, а наблюдений стало вдвое больше. Что станет со спектром шума?'
    options:
    - {text: 'Станет шире', why: 'При росте $n$ гамма $= p/n$ уменьшается, а края $(1 \pm \sqrt{\gamma})^2$ приближаются к 1.'}
    - 'Станет уже, ближе к 1'
    - {text: 'Не изменится', why: 'Ширина зависит от $\gamma = p/n$, а она изменилась.'}
    answer: 2
    explain: 'Гамма уменьшилась вдвое, края $(1 \pm \sqrt{\gamma})^2$ сдвинулись к единице: больше данных — точнее оценки.'
