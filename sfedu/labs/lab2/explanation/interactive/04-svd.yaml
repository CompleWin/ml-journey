- section: Минимум теории
  say: >-
    Остался последний инструмент — сингулярное разложение, по-английски эс-вэ-дэ. Любую матрицу можно представить как три простых действия подряд. Посмотрим, что матрица делает с кругом. [+] Сначала поворот. Он записан справа, как вэ транспонированное, потому что действует на вектор первым. [+] Потом растяжение вдоль осей: по одной оси круг растягивается, по другой сжимается, и получается эллипс. [+] Потом ещё один поворот, у. [+] Коэффициенты растяжения называются сингулярными числами и обозначаются буквой эс: эс один, эс два и так далее. Вся формула читается так: икс равна у, умноженной на эс и на вэ транспонированное. У и вэ — повороты, а эс — диагональная матрица растяжений.
  show: {block: scene, src: 04-svd.js, scene: svd}

- say: >-
    Почему это полезно для нас? Подставим разложение в ковариацию. [+] Икс, умноженная на икс транспонированную, — это у эс вэ транспонированное, умноженное на вэ эс у транспонированное. Мы просто транспонировали произведение, а при этом порядок множителей меняется на обратный. [+] В середине встречаются вэ транспонированное и вэ. Поворот, умноженный на обратный поворот, ничего не делает, это единичная матрица, и она исчезает. Остаётся у, эс в квадрате, у транспонированное. [+] Делим на эн и получаем ковариацию. [+] А это ровно разложение по собственным векторам: столбцы матрицы у — собственные векторы ковариации, а собственные числа равны квадратам сингулярных чисел, делённым на эн.
  show:
    block: derivation
    id: svdder
    lines:
    - 'XX^T &= (USV^T)(USV^T)^T'
    - {tex: '&= U S V^T\, V S^T U^T', note: 'транспонирование меняет порядок множителей'}
    - {tex: '&= U S S^T U^T', note: '$V^T V = I$: поворот и обратный поворот'}
    - {tex: '\tfrac{1}{n}XX^T &= U\,\tfrac{S^2}{n}\,U^T', note: 'делим на $n$'}
    - {tex: '\lambda_i &= \tfrac{s_i^2}{n}', note: 'собственные числа ковариации'}

- say: >-
    Зачем нам эта связь? [+] Во втором и третьем заданиях матрицы большие, а нужна не вся ковариация, а только её собственные числа, иногда лишь самое большое. [+] Сингулярное разложение считают прямо по матрице данных, не строя ковариацию. А частичное разложение находит только несколько старших сингулярных чисел, и это намного быстрее. [+] Пример: если сингулярное число равно тридцати, а наблюдений тысяча, то собственное число ковариации равно девятистам, делённым на тысячу, то есть 0,9. Дальше вы часто будете слышать эту фразу: собственные числа ковариации — это квадраты сингулярных чисел, делённые на эн.
  show:
  - {use: svdder, highlight: [5], reveal: all}
  - block: text
    md: |
      - В заданиях 2 и 3 нужны только собственные числа, иногда одно, старшее.

      - SVD считают прямо по $X$; частичное SVD находит лишь старшие тройки — это быстро.

      - Пример: $s = 30,\ n = 1000 \;\Rightarrow\; \lambda = 900/1000 = 0{,}9$.
    reveal: by-para

- say: Быстрая проверка.
  quiz:
    q: 'Сингулярное число матрицы данных $s = 60$, наблюдений $n = 1000$. Чему равно соответствующее собственное число ковариации?'
    answer: 3.6
    tol: 0.05
    hint: '$\lambda = s^2 / n$'
    explain: '$60^2 / 1000 = 3600 / 1000 = 3{,}6$.'
