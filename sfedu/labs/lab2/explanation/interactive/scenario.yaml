title: Спектральная теория случайных матриц
subtitle: Лабораторная № 2 — разбор для защиты
lang: ru
kind: lab
data:
  bbp:
    csv: bbp.csv
    calc: {naive: 'lam1 - 1'}
    digits: {naive: 3}
    labels: {theta: '$\theta$', lam1: '$\hat\lambda_1$', overlap: 'перекрытие', naive: 'наивная $\hat\lambda_1 - 1$', calib: 'калиброванная $\hat\theta$'}
chapters:
- title: Идея лабораторной и минимум теории
  parts:
  - 01-idea.yaml          # шум даёт целый спектр, а не одно число; зачем знать спектр шума; три задания
  - 02-covariance.yaml    # матрица X (p признаков × n наблюдений), γ = p/n, дисперсия, ковариация, Σ̂ = XXᵀ/n, диагональ и вне её, пример
  - 03-eigen.yaml         # дисперсия вдоль направления vᵀΣ̂v, собственные векторы и числа, PCA, спектр, спектральная плотность, белый шум σ²I
  - 04-svd.yaml           # X = USVᵀ, сингулярные числа, вывод XXᵀ/n = U(S²/n)Uᵀ, λ = s²/n, зачем это в заданиях 2 и 3
- title: Задание 1. Закон Марченко–Пастура и две ловушки
  parts:
  - 05-mp.yaml            # эксперимент n = 1000, p = 500 и 2000; ожидание «всё около 1»; плотность ρ_MP; границы λ±; форма от γ; что видно на графиках; таблица; график ноутбука
  - 06-traps.yaml         # ранг ≤ n и p − n нулей; округление ±10⁻¹⁵ и 1496 вместо 1000; порог eps·λmax·p ≈ 2,6·10⁻¹², matrix_rank, запас 3 и 11 порядков; масса пика 1 − 1/γ, ∫ρ_MP = 1/γ, условная плотность γρ_MP, max(gamma, 1)
- title: Задание 1. Края спектра и случай p = n
  parts:
  - 07-edges.yaml         # λ± — пределы n → ∞; мягкие края; масштаб s ≈ 0,023; 200 повторов и TW₁; −1,29 и 1,18 против −1,21 и 1,27; 12 % правее λ₊; асимметрия; основной запуск левее; запас в несколько s и δₙ
  - 08-four.yaml          # γ = 1 → λ₊ = 4, λmax = 4,02; заранее выбранное направление и закон больших чисел; максимум по направлениям — переобучение на шум; ошибки ~1/√n у ~p²/2 элементов; сплюснутый эллипсоид, след сохраняется; правило «λ > 1» набирает шум
- title: Задание 2. Фазовый переход BBP
  parts:
  - 09-spike.yaml         # модель Σ = I + θv₁v₁ᵀ и почему дисперсия 1 + θ; генерация умножением первой строки на √(1 + θ); параметры p = 1500, n = 3000, θc ≈ 0,707; λ̂₁ и перекрытие cos²; svds(k = 1) и s²/n; ловушка порядка eigh; кусочная теория
  - 10-bbp.yaml           # анимация перехода; график λ̂₁ ниже и выше порога с числами; график перекрытия и формула Пола — Бенайча-Жорже; перекрытие < 1 и θ² ≫ γ; размытость у порога; предел чувствительности θc = √(p/n) и больше наблюдений
- title: Задание 2. Калибровка силы сигнала
  parts:
  - 11-calib.yaml         # раскрытие скобок и завышение γ + γ/θ; квадратное уравнение для 1 + θ; почему больший корень; guard clause и дискриминант в λ₊; примеры из вывода; график калибровки с числами
- title: Задание 3. Спектр весов и наивная оценка α
  parts:
  - 12-htsr.yaml          # спектр слоя S = WWᵀ/N; случайные веса → балк МП; обучение вытягивает хвост λ^(−α); смысл степенного закона; таблица режимов α; пять фаз; развёртка свёртки 512 × 4608; сингулярные числа вместо WᵀW
  - 13-ols.yaml           # МНК по гистограмме в log-log; α от 2,20 до 0,88 по числу бинов; редкий хвост и «пол»; логарифмические бины и сдвиг на 1; нарушенные условия МНК, несостоятельность
- title: Задание 3. Оценщик Хилла
  parts:
  - 14-mle.yaml           # оценщик Хилла и пример; вывод из правдоподобия; свойства и погрешность (α − 1)/√N_tail; расстояние KS; перебор порога, алгоритм Клаузе–Шализи–Ньюмана, powerlaw 1.5 и 2.0; код fit_alpha; CCDF; итог α = 6,04
- title: Задание 3. Слепой тест на четырёх слоях
  parts:
  - 15-layers.yaml        # четыре слоя и как их испортили; ранг 2 через SVD; stable rank; λ₊ слоя и почему σ² завышена; спектры; таблица; почему у случайного слоя нет хвоста; почему у коллапса нет α
  - 16-verdict.yaml       # итоговая классификация по фазам; погрешность α у маленьких слоёв; два порога у layer2.0.conv1; что надёжно
- title: Итог. Лабораторная за минуту
  parts:
  - 17-summary.yaml       # пересказ всей лабы за минуту; карточки для повторения перед защитой
