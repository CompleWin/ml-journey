- section: 'Задание 2. Сигнал в шуме: фазовый переход BBP'
  say: >-
    Во втором задании мы прячем в шум сигнал и проверяем, найдёт ли его метод главных компонент. Модель называется моделью с одним шипом. Истинная ковариация в ней равна единичной матрице плюс тэта, умноженное на вэ один на вэ один транспонированное. [+] Единичная матрица — это шум с единичной дисперсией во всех направлениях: круглое облако. [+] Добавка тэта вэ один вэ один транспонированное увеличивает дисперсию только вдоль одного направления вэ один, и облако вытягивается вдоль него. [+] Число тэта — сила сигнала: насколько сильно облако вытянуто.
  show:
  - {block: scene, src: 09-spike.js, scene: spike, size: [800, 900]}
  - block: formula
    reveal: by-part
    parts:
    - {tex: '\Sigma = I', note: 'шум: дисперсия 1 во всех направлениях'}
    - {tex: '+\ \theta\, v_1 v_1^T', note: 'вытягивает облако вдоль $v_1$'}
    - {tex: ',\qquad \theta > 0', note: 'сила сигнала'}

- say: >-
    Проверим, что дисперсия вдоль вэ один действительно равна единице плюс тэта. Напомню: дисперсия вдоль направления — это вэ транспонированное, сигма, вэ. [+] Подставим вэ один. Единичная матрица даёт вэ один транспонированное на вэ один, то есть квадрат длины. Добавка даёт тэта, умноженное на квадрат скалярного произведения вэ один с самим собой. [+] Длина вэ один равна единице, поэтому итог — единица плюс тэта. [+] А для любого направления у, перпендикулярного вэ один, скалярное произведение у на вэ один равно нулю, добавка пропадает, и остаётся единица. Значит, сигнал живёт ровно в одном направлении.
  show:
    block: derivation
    lines:
    - {tex: 'v_1^T \Sigma\, v_1 = v_1^T v_1 + \theta\,(v_1^T v_1)^2', note: 'подставили $\Sigma = I + \theta v_1 v_1^T$'}
    - {tex: '= 1 + \theta', note: '$v_1$ единичной длины'}
    - {tex: 'u \perp v_1:\quad u^T \Sigma\, u = 1 + \theta\,(u^T v_1)^2 = 1', note: 'скалярное произведение равно 0'}

- say: >-
    Как сгенерировать такие данные? Направление вэ один взяли самым простым: единица на первом месте и нули на остальных. То есть сигнал сидит в первом признаке. [+] Тогда достаточно взять матрицу шума и умножить её первую строку на корень из единицы плюс тэта. [+] Почему корень? При умножении случайной величины на число её дисперсия умножается на квадрат этого числа. Квадрат корня из единицы плюс тэта — как раз единица плюс тэта. [+] Например, при тэта, равном 0,44, первую строку умножаем на 1,2, и её дисперсия становится 1,44.
  show: {block: scene, src: 09-spike.js, scene: rows}

- say: >-
    Параметры эксперимента. Признаков 1500, наблюдений 3000, значит, гамма опять одна вторая, как в режиме А. Порог, который предскажет теория, — корень из гаммы, примерно 0,707. Край шума лямбда плюс, как и в первом задании, примерно 2,914. Силу сигнала тэта меняли от 0,1 до 2,5 с шагом 0,1, для каждого значения делали по пять повторов, а результаты усредняли.
  show:
    block: table
    cols: [параметр, значение]
    rows:
    - ['$p$, признаков', '1500']
    - ['$n$, наблюдений', '3000']
    - ['$\gamma = p/n$', '0,5']
    - ['порог $\theta_c = \sqrt{\gamma}$', '≈ 0,707']
    - ['край шума $\lambda_+$', '≈ 2,914']
    - ['сила сигнала $\theta$', 'от 0,1 до 2,5, шаг 0,1']
    - ['повторов на каждое $\theta$', '5']

- say: >-
    В каждом опыте считали две величины. [+] Первая — старшее собственное число, лямбда один с крышкой: какую наибольшую дисперсию нашёл метод главных компонент. [+] Вторая — перекрытие: квадрат косинуса угла между направлением, которое нашёл метод, и истинным направлением сигнала. [+] Если направления совпадают, косинус равен единице, и перекрытие равно единице. [+] Если они перпендикулярны, перекрытие равно нулю. [+] Например, при угле шестьдесят градусов косинус равен одной второй, а перекрытие — одной четверти.
  show: {block: scene, src: 09-spike.js, scene: angle}

- say: >-
    Посмотрим на код одного опыта. [+] Генерируем матрицу шума пэ на эн. [+] Умножаем первую строку на корень из единицы плюс тэта: прячем сигнал. [+] Дальше нужна только старшая компонента, поэтому вместо полного разложения матрицы 1500 на 1500 вызываем частичное сингулярное разложение svds с ка, равным единице. Оно находит только одну, наибольшую тройку и не строит большую матрицу целиком. [+] Собственное число — квадрат сингулярного числа, делённый на эн. А перекрытие — квадрат первой координаты левого сингулярного вектора, ведь истинное направление — первый базисный вектор.
  show:
  - {block: scene, src: 09-spike.js, scene: pipe, size: [800, 900]}
  - block: code
    lang: python
    trace: [2, 3, 4, 5]
    src: |
      def top_component(theta):
          X = rng.standard_normal((p, n))
          X[0] *= np.sqrt(1 + theta)
          u, s, _ = scipy.sparse.linalg.svds(X, k=1)
          return s[0]**2 / n, u[0, 0]**2

- say: >-
    Здесь есть ловушка, о которой стоит знать. Если считать через функцию eigh из numpy, она выдаёт собственные числа по возрастанию. [+] Если по привычке взять индекс ноль, получится наименьшее собственное число, прижатое к лямбда минус, и вектор, перпендикулярный сигналу. Перекрытие будет около нуля при любой силе сигнала. [+] Главная компонента у eigh последняя, с индексом минус один. А svds с ка, равным единице, сразу возвращает наибольшую тройку.
  show:
    block: compare
    titles: [Неверно, Верно]
    style: good-bad
    reveal: by-side
    left: '`w[0]`, `V[:, 0]` — наименьшее $\lambda \approx \lambda_-$ и вектор, перпендикулярный сигналу.'
    right: '`w[-1]`, `V[:, -1]` — главная компонента. Или сразу `svds(k=1)`.'

- say: >-
    Теоретическую кривую для лямбда один строили кусочно: ниже порога это просто край шума лямбда плюс, а выше порога — единица плюс тэта, умноженная на единицу плюс гамма на тэта. [+] Почему нельзя взять вторую формулу везде? Вот она, подставленная при всех тэта. Слагаемое гамма на тэта при маленьком тэта становится огромным, и кривая улетает вверх. [+] А это правильная кусочная теория. Справа от порога кривые совпадают. Заметьте: в самой точке порога формула как раз равна лямбда плюс, поэтому кусочная кривая непрерывна.
  show:
    block: plot
    fn:
    - {f: '(1+x)*(1+0.5/x)', label: 'формула везде'}
    - {f: '(1+max(x,0.70711))*(1+0.5/max(x,0.70711))', label: 'кусочная теория'}
    xrange: [0.05, 2.5]
    yrange: [2.5, 6]
    xlabel: '$\theta$'
    ylabel: '$\lambda_1$'
    reveal: by-layer

- say: Быстрая проверка.
  quiz:
    q: 'Дисперсия первого признака должна стать $1 + \theta = 2{,}25$. На что умножить первую строку шума?'
    answer: 1.5
    tol: 0.01
    hint: 'Дисперсия умножается на квадрат множителя.'
    explain: '$\sqrt{2{,}25} = 1{,}5$, и $1{,}5^2 = 2{,}25$.'

- say: И ещё один вопрос.
  quiz:
    q: 'Угол между найденным и истинным направлением равен 45°. Чему равно перекрытие $|\langle \hat v_1, v_1\rangle|^2$?'
    answer: 0.5
    tol: 0.02
    hint: 'Перекрытие — квадрат косинуса угла.'
    explain: '$\cos 45° = \sqrt{2}/2$, а его квадрат равен 0,5.'
