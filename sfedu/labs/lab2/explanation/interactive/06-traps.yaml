- section: Две ловушки режима B (γ = 2)
  say: >-
    В режиме Б признаков больше, чем наблюдений, и здесь нас ждут две ловушки. Первая — нулевые собственные числа. Откуда они берутся? [+] Начнём с маленькой картинки. Пусть признаков три, то есть пространство трёхмерное, а наблюдений всего два. Каждое наблюдение — точка в этом пространстве. [+] Две точки и начало координат всегда лежат в одной плоскости. [+] Значит, в направлении, перпендикулярном этой плоскости, разброса нет совсем. Дисперсия вдоль него равна нулю, и у ковариации появляется нулевое собственное число. [+] То же в общем случае: эн точек в пэ-мерном пространстве лежат в подпространстве размерности не больше эн. Поэтому ранг ковариации не больше эн, и при пэ больше эн как минимум пэ минус эн собственных чисел равны нулю.
  show: {block: scene, src: 06-traps.js, scene: plane}

- say: >-
    В нашем режиме Б признаков 2000, а наблюдений 1000. Слева тысяча настоящих, ненулевых собственных чисел. [+] Значит, ещё ровно тысяча собственных чисел должны быть нулями. [+] Но компьютер считает с округлением и вместо точных нулей получает крошечные числа порядка десяти в минус пятнадцатой степени, причём примерно поровну положительных и отрицательных. [+] Поэтому наивный фильтр «оставить числа больше нуля» пропустил 496 ложных нулей и оставил 1496 чисел вместо тысячи.
  show: {block: scene, src: 06-traps.js, scene: zeros}

- say: >-
    Нужен разумный порог, ниже которого число считается нулём. Мы взяли такой: машинная точность чисел float64, примерно два на десять в минус шестнадцатой. Это относительная точность, с которой компьютер хранит числа. [+] Умножаем её на наибольшее собственное число, чтобы порог учитывал масштаб матрицы. [+] И на размер матрицы, потому что ошибка округления растёт вместе с размером. [+] Получается около 2,6 на десять в минус двенадцатой. В коде это одна строка: функция drop zeros оставляет только числа больше этого порога. По тому же правилу считает ранг функция numpy matrix rank, так что правило не придумано нами, а стандартное.
  show:
  - block: formula
    reveal: by-part
    parts:
    - {tex: '\tau = \varepsilon_{\text{mach}}', note: '$\approx 2{,}2\cdot10^{-16}$ для float64'}
    - {tex: '\cdot\,\lambda_{max}', note: 'масштаб, $\approx 5{,}8$'}
    - {tex: '\cdot\,p', note: 'размер, 2000'}
    - {tex: '\approx 2{,}6\cdot10^{-12}'}
  - block: code
    lang: python
    src: |
      def drop_zeros(lam):
          return lam[lam > lam.max() * len(lam) * np.finfo(float).eps]

- say: >-
    Почему порог удачный? Посмотрим на логарифмическую шкалу, где каждое деление — умножение на десять. [+] Слева — ошибки округления: тысяча «нулей», и все они около десяти в минус пятнадцатой. [+] Порог стоит примерно на три порядка выше них, то есть примерно в тысячу раз. [+] А настоящие собственные числа начинаются около лямбда минус, это примерно 0,17. От порога до них одиннадцать порядков. [+] Запас огромный в обе стороны, и после фильтра осталось ровно тысяча чисел, как и должно быть.
  show: {block: scene, src: 06-traps.js, scene: logscale}

- say: >-
    Вторая ловушка. Если в режиме Б просто наложить кривую Марченко–Пастура на гистограмму, кривая окажется ровно в два раза ниже столбиков. [+] Дело в том, что при гамме больше единицы полное распределение собственных чисел состоит из двух частей. Первая — пик в нуле, туда попадают все нулевые числа. Его масса — это доля нулей: один минус один на гамму, у нас одна вторая. [+] Вторая часть — непрерывная плотность Марченко–Пастура. [+] Вся масса вместе равна единице. Значит, на непрерывную часть остаётся один на гамму, тоже одна вторая. Площадь под кривой равна одной второй, а не единице.
  show: {block: scene, src: 06-traps.js, scene: mass}

- say: >-
    А гистограмма с параметром density равно true построена только по ненулевым числам, и её площадь всегда равна единице. [+] По сути, это условная плотность: распределение собственного числа при условии, что оно больше нуля. По определению её получают делением на вероятность этого условия. [+] Вероятность того, что число ненулевое, — это доля ненулевых чисел, один на гамму. [+] А делить на один на гамму — то же, что умножать на гамму. Поэтому кривую надо умножить на гамму, то есть на два, и тогда она ложится точно на столбики.
  show:
  - {block: scene, src: 06-traps.js, scene: cond, size: [800, 900]}
  - block: derivation
    lines:
    - {tex: '\rho(\lambda \mid \lambda > 0) = \dfrac{\rho_{MP}(\lambda)}{P(\lambda > 0)}', note: 'определение условной плотности'}
    - {tex: '= \dfrac{\rho_{MP}(\lambda)}{1/\gamma}', note: 'доля ненулевых чисел — $1/\gamma$'}
    - {tex: '= \gamma\,\rho_{MP}(\lambda)', note: 'делить на $1/\gamma$ — умножать на $\gamma$'}

- say: >-
    Остался вопрос: почему в коде множитель записан как максимум из гаммы и единицы? [+] При гамме не больше единицы нулевых собственных чисел нет, пика в нуле нет, и кривую трогать не нужно: множитель равен единице. [+] При гамме больше единицы множитель равен гамме. Обе ситуации описывает одно выражение: максимум из гаммы и единицы.
  show:
  - block: code
    lang: python
    highlight: [4]
    src: |
      lam = drop_zeros(lam)
      x, rho = mp_density(gamma)
      ax.hist(lam, bins=50, density=True)
      ax.plot(x, rho * max(gamma, 1))
  - block: compare
    titles: ['$\gamma \le 1$', '$\gamma > 1$']
    left: 'Нулей нет, пика в нуле нет. Множитель **1**.'
    right: 'Доля нулей $1 - 1/\gamma$. Множитель **$\gamma$**.'
    style: plain
    reveal: by-side

- say: Быстрая проверка.
  quiz:
    q: 'Признаков $p = 3000$, наблюдений $n = 1000$. Сколько собственных чисел выборочной ковариации равны нулю?'
    answer: 2000
    tol: 0
    hint: 'Ранг не больше $n$, значит, нулей не меньше $p - n$.'
    explain: '$p - n = 3000 - 1000 = 2000$.'

- say: И ещё один вопрос.
  quiz:
    q: 'На что нужно умножить кривую МП при $\gamma = 4$, чтобы она совпала с гистограммой ненулевых собственных чисел?'
    answer: 4
    tol: 0
    hint: 'Доля ненулевых чисел равна $1/\gamma$.'
    explain: 'Условная плотность равна $\gamma\,\rho_{MP}$, то есть множитель $\max(\gamma, 1) = 4$.'
