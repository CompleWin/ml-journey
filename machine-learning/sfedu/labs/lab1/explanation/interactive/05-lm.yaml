- section: Что делает языковая модель
  say: >-
    Во второй половине первого задания появляется настоящая языковая модель, Pythia с семьюдесятью миллионами параметров. Разберёмся, как она устроена, ровно настолько, насколько нужно для лабы.
    [+] Языковая модель получает начало текста. Например, фразу из четвёртого задания: «In the middle of the room there was a large table».
    [+] И выдаёт вероятности для каждого возможного продолжения: какое слово скорее всего будет следующим.
    [+] Выбираем продолжение, приписываем его к тексту и повторяем. Так модель пишет текст слово за словом. Это называется авторегрессией: каждый шаг опирается на всё, что уже написано. Если каждый раз брать самое вероятное слово, это жадная генерация, она будет в четвёртом задании.
  show: {block: scene, src: 05-lm.js, scene: predict}

- section: Токены и словарь
  say: >-
    Модель работает не с буквами и не совсем со словами, а с токенами. Токенизатор режет текст на кусочки.
    [+] Наша фраза вместе с продолжением with превращается в двенадцать токенов. Обрати внимание: пробел приклеен к началу слова, это отдельный токен «пробел-table», не то же самое, что «table» без пробела.
    [+] Всего в словаре токенизатора Pythia пятьдесят тысяч двести семьдесят семь токенов, и у каждого свой номер. Модель видит только эти номера.
  show: {block: scene, src: 05-lm.js, scene: tokens}

- section: Эмбеддинг
  say: >-
    Номер токена надо превратить в вектор. Для этого у модели есть большая таблица, матрица эмбеддингов. В ней по строке на каждый токен, и в каждой строке пятьсот двенадцать чисел.
    [+] Номер токена просто выбирает строку таблицы.
    [+] Эта строка и есть эмбеддинг токена: вектор из пятисот двенадцати чисел, с которого модель начинает работу. Эти числа не придуманы человеком, они выучены при обучении. В коде эта таблица называется embed_in, входные эмбеддинги.
  show: {block: scene, src: 05-lm.js, scene: lookup, id: lookup}

- say: >-
    Тонкость из условия. В таблице не пятьдесят тысяч двести семьдесят семь строк, а пятьдесят тысяч триста четыре.
    [+] Размер дополнили до числа, кратного шестидесяти четырём: пятьдесят тысяч триста четыре это шестьдесят четыре умножить на семьсот восемьдесят шесть. Матричные ядра видеокарты, Tensor Cores, быстрее работают с такими размерами.
    [+] Лишние двадцать семь строк не соответствуют никаким настоящим токенам, поэтому в лабе таблицу обрезают до размера словаря. Иначе в статистику попали бы мусорные векторы.
  show: {use: lookup, scene: padding}

- section: Путь токена через модель
  say: >-
    Теперь весь путь целиком.
    [+] Токены превращаются в эмбеддинги через embed_in.
    [+] Затем вектор проходит через шесть слоёв модели. Каждый слой что-то добавляет к вектору, учитывая соседние токены. Подробнее о слоях поговорим в третьем задании.
    [+] После последнего слоя стоит нормализация, финальный LayerNorm.
    [+] Получается финальное скрытое состояние, вектор h из пятисот двенадцати чисел. В нём сжато всё, что модель поняла о контексте.
    [+] Вектор h сравнивается со второй таблицей, embed_out, выходными эмбеддингами. Это тоже пятьдесят тысяч двести семьдесят семь строк по пятьсот двенадцать чисел, но другая матрица.
    [+] И из результатов сравнения softmax делает вероятности следующего токена.
  show:
    block: diagram
    direction: lr
    reveal: by-node
    nodes: ['T: токены', 'E: embed_in', 'L: 6 слоёв', 'N: LayerNorm', 'H: h — 512 чисел', 'O: embed_out', 'S: softmax → вероятности']
    edges: ['T -> E', 'E -> L', 'L -> N', 'N -> H', 'H -> O', 'O -> S']

- section: Логиты
  say: >-
    Как именно h сравнивается с выходной таблицей? Скалярным произведением.
    [+] Для каждого токена словаря берём его строку из embed_out, вектор w, и считаем скалярное произведение с h. Получается одно число на токен, его называют логитом.
    [+] Чем больше логит, тем лучше токен подходит как продолжение. Вектор, который смотрит туда же, куда h, получает большой логит, перпендикулярный около нуля, противоположный отрицательный. Логитов столько же, сколько токенов в словаре, пятьдесят тысяч двести семьдесят семь.
  show: {block: scene, src: 05-lm.js, scene: logits}

- section: Softmax
  say: >-
    Логиты это ещё не вероятности: они бывают отрицательными и в сумме не дают единицу. Их превращает в вероятности функция softmax.
    [+] Каждый логит возводят в экспоненту, то есть берут e в этой степени. Экспонента всегда положительна.
    [+] И делят на сумму экспонент всех логитов, чтобы в сумме получилась единица. Пример: логиты два, один и ноль. Экспоненты примерно семь и тридцать девять сотых, два и семьдесят две сотых, и один. Сумма около одиннадцати и одной десятой. Вероятности ноль шестьдесят семь, ноль двадцать четыре и ноль ноль девять.
  show:
    block: derivation
    lines:
    - {tex: 'p_t &= \frac{e^{z_t}}{\sum_{j} e^{z_j}}', note: 'экспонента делает всё положительным, деление — сумму равной 1'}
    - {tex: 'z = (2,\ 1,\ 0) \;&\Rightarrow\; (7.39,\ 2.72,\ 1)\,/\,11.11 = (0.67,\ 0.24,\ 0.09)', note: 'пример'}

- say: >-
    Главное свойство softmax для нашей лабы.
    [+] Прибавим ко всем логитам одно и то же число c.
    [+] Каждая экспонента умножится на e в степени c, и в числителе, и в знаменателе. Множитель сокращается.
    [+] Вероятности не изменились. Softmax видит только разницу между логитами, а общий сдвиг ему безразличен. Запомни это: именно поэтому в модели может накопиться «паразитный конус», и именно поэтому его можно безнаказанно убрать.
  show:
    block: derivation
    lines:
    - {tex: 'z_t \;&\to\; z_t + c \quad \text{для всех } t', note: 'один и тот же сдвиг'}
    - {tex: '\frac{e^{z_t + c}}{\sum_j e^{z_j + c}} &= \frac{e^{c}\, e^{z_t}}{e^{c} \sum_j e^{z_j}}', note: 'e^c выносится и сокращается'}
    - {tex: '&= p_t', note: 'вероятности не изменились'}

- section: Кросс-энтропия
  say: >-
    Как понять, хорошо ли модель угадывает? Берём настоящий текст и смотрим, какую вероятность модель дала правильному следующему токену.
    [+] Ошибка, она же функция потерь, равна минус логарифму этой вероятности. Это кросс-энтропия.
    [+] Если правильному токену дали ноль шестьдесят семь, потеря ноль сорок. Если всего ноль ноль девять, потеря два и сорок одна сотая. Чем увереннее модель в правильном ответе, тем меньше потеря.
    [+] Усреднённая по тексту кросс-энтропия называется Language Modeling Loss. Она встретится в четвёртом задании: у нашей модели на нейтральном тексте она три и восемьсот пятьдесят две тысячных. А e в этой степени, перплексия, около сорока семи: модель выбирает как будто из сорока семи равновероятных вариантов.
  show:
    block: derivation
    lines:
    - {tex: 'L &= -\log p_y', note: 'y — правильный следующий токен'}
    - {tex: 'p_y = 0.67 \Rightarrow L = 0.40, \qquad p_y = 0.09 &\Rightarrow L = 2.41', note: 'увереннее в правильном — меньше потеря'}
    - {tex: '\mathrm{CE} = 3.852 \;&\Rightarrow\; e^{3.852} \approx 47', note: 'перплексия Pythia на нейтральном тексте'}

- section: Обучение
  say: >-
    Обучение модели это много маленьких исправлений всех таблиц и слоёв так, чтобы кросс-энтропия падала. Посмотрим, что при одном шаге происходит с выходными эмбеддингами.
    [+] Вектор правильного токена немного подтягивается к h: в следующий раз его логит будет больше.
    [+] А векторы всех остальных токенов немного отталкиваются от h, каждый с силой, равной своей вероятности. Формально производная потери по вектору токена t равна разности его вероятности и единицы для правильного, нуля для неправильных, умноженной на h.
    [+] Запомни главное: каждый такой толчок направлен вдоль h. Это ключ к паразитному конусу.
  show: {block: scene, src: 05-lm.js, scene: pushpull}

- section: Две таблицы эмбеддингов
  say: >-
    Последнее. У модели две таблицы одинаковой формы: входная embed_in и выходная embed_out.
    [+] В некоторых моделях это одна и та же матрица, их называют связанными. За это отвечает настройка tie_word_embeddings.
    [+] В Pythia она равна False: таблицы разные и учатся по-разному. Входная выбирает строку по номеру токена, а выходная участвует в softmax и получает толчки вдоль h. Эта разница объяснит главный сюрприз задания 1.2.
  show:
    block: compare
    reveal: by-side
    titles: ['embed_in — вход', 'embed_out — выход']
    left: |
      - строка выбирается **по номеру** токена
      - начало пути через модель
      - `model.gpt_neox.embed_in.weight`
    right: |
      - сравнивается с $h$: логит $z_t = \langle h, w_t \rangle$
      - участвует в **softmax**
      - `model.embed_out.weight`; `tie_word_embeddings = False`

- say: Проверка.
  quiz:
    q: Ко всем логитам прибавили 5. Как изменятся вероятности следующего токена?
    options:
    - {text: 'Все вырастут', why: 'Вероятности в сумме всегда 1 — все сразу вырасти не могут.'}
    - 'Не изменятся'
    - {text: 'Самый вероятный токен станет ещё вероятнее', why: 'Softmax видит только разности логитов, а они не изменились.'}
    answer: 2
    explain: '$e^{5}$ появляется и в числителе, и в знаменателе и сокращается.'

- say: И ещё одна.
  quiz:
    q: Через какую матрицу считаются логиты следующего токена?
    options:
    - {text: '`embed_in`', why: 'Входная матрица превращает номер токена в вектор в начале пути.'}
    - '`embed_out`'
    - {text: 'Через матрицу LayerNorm', why: 'LayerNorm нормирует вектор, но логиты считаются скалярными произведениями с embed_out.'}
    answer: 2
    explain: 'Логит $z_t = \langle h, w_t \rangle$, где $w_t$ — строка `embed_out`.'
