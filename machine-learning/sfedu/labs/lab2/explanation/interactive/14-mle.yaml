- section: 'Правильная оценка: метод максимального правдоподобия (оценщик Хилла)'
  say: >-
    Правильный способ — метод максимального правдоподобия. Для степенного закона он даёт простую формулу, её называют оценщиком Хилла. [+] Выбираем порог, лямбда минимальное, и берём все собственные числа не меньше него. Это хвост, в нём эн хвоста чисел. [+] Для каждого числа хвоста считаем логарифм его отношения к порогу: насколько далеко, в логарифмическом смысле, оно ушло от порога. [+] Складываем эти логарифмы. [+] И альфа равна единице плюс число точек хвоста, делённое на эту сумму. Никаких бинов: работает каждое число по отдельности.
  show: {block: scene, src: 14-mle.js, scene: hill}

- say: >-
    Маленький пример. Пусть порог равен единице, а в хвосте три числа: один, е и е в квадрате, где е — основание натурального логарифма, примерно 2,72. [+] Логарифмы отношений к порогу: ноль, один и два. [+] Их сумма — три, а точек в хвосте тоже три. [+] Альфа равна единице плюс три делить на три, то есть двум. [+] Обратите внимание на смысл формулы: среднее логарифмическое удаление от порога равно единице, делённой на альфа минус один. Чем дальше точки разбегаются от порога, тем больше сумма и тем меньше альфа, то есть тем тяжелее хвост.
  show:
    block: derivation
    lines:
    - '\lambda_{min} = 1:\quad \lambda_i = 1,\ e,\ e^2'
    - '\ln(\lambda_i/\lambda_{min}) = 0,\ 1,\ 2'
    - '\textstyle\sum \ln(\lambda_i/\lambda_{min}) = 3,\quad N_{tail} = 3'
    - '\alpha = 1 + 3/3 = 2'
    - {tex: '\overline{\ln(\lambda_i/\lambda_{min})} = \dfrac{1}{\alpha - 1}', note: 'дальше от порога — меньше $\alpha$, тяжелее хвост'}

- say: >-
    Откуда эта формула? Запишем плотность степенного закона на хвосте: она пропорциональна лямбде в степени минус альфа, а множитель альфа минус один, делённый на лямбда минимальное, делает площадь под ней равной единице. [+] Правдоподобие — это произведение плотностей во всех точках хвоста, а его логарифм — сумма логарифмов. Получаем эн хвоста на логарифм альфа минус один, минус слагаемое без альфы, минус альфа на сумму логарифмов отношений. [+] Ищем альфу, при которой это выражение максимально: берём производную по альфе и приравниваем к нулю. [+] Отсюда альфа минус один равно числу точек хвоста, делённому на сумму логарифмов. Это и есть формула Хилла, и она точная оценка максимального правдоподобия.
  show:
    block: derivation
    lines:
    - {tex: 'p(\lambda) = \dfrac{\alpha-1}{\lambda_{min}}\Bigl(\dfrac{\lambda}{\lambda_{min}}\Bigr)^{-\alpha},\quad \lambda \ge \lambda_{min}', note: 'множитель делает площадь равной 1'}
    - {tex: '\ln L = N_{tail}\ln(\alpha-1) - N_{tail}\ln\lambda_{min} - \alpha\sum\ln\dfrac{\lambda_i}{\lambda_{min}}', note: 'логарифм произведения — сумма логарифмов'}
    - {tex: '\dfrac{d\ln L}{d\alpha} = \dfrac{N_{tail}}{\alpha-1} - \sum\ln\dfrac{\lambda_i}{\lambda_{min}} = 0', note: 'в максимуме производная равна 0'}
    - {tex: '\alpha = 1 + \dfrac{N_{tail}}{\sum\ln(\lambda_i/\lambda_{min})}', note: 'оценщик Хилла'}

- say: >-
    Чем этот способ лучше МНК по гистограмме? [+] Бины ему не нужны совсем: никакой нарезки, которую можно выбрать по-разному. [+] Он использует каждое собственное число хвоста, а не счётчики в интервалах. [+] Оценка состоятельна: с ростом данных она сходится к истинному альфа. [+] А её погрешность примерно равна альфа минус один, делённому на корень из числа точек хвоста. Запомните эту формулу: она понадобится, когда будем решать, насколько верить полученным числам.
  show:
    block: text
    reveal: by-para
    md: |
      - Бины не нужны: нечего выбирать.

      - Работает каждое собственное число хвоста.

      - Состоятельна: с ростом данных сходится к истинному $\alpha$.

      - Погрешность $\approx (\alpha - 1)/\sqrt{N_{tail}}$.

- say: >-
    Остался вопрос: где начинается хвост, то есть какой взять порог? Для каждого порога мы подгоняем степенной закон и сравниваем его с данными по расстоянию Колмогорова–Смирнова. [+] Берём две функции распределения. Эмпирическую, ступеньками: какая доля чисел хвоста не больше данного лямбда. [+] И теоретическую, гладкую, по подогнанному закону. [+] Расстояние дэ — это наибольшая вертикальная разница между ними. [+] Чем меньше дэ, тем лучше закон описывает хвост. Здесь показан настоящий хвост слоя layer4.1.conv2 при лучшем пороге: дэ равно 0,041.
  show: {block: scene, src: 14-mle.js, scene: ks}

- say: >-
    Теперь перебираем порог по всем собственным числам по очереди. [+] Для каждого кандидата считаем альфу по формуле Хилла и расстояние дэ. Кривая показывает, как дэ меняется при сдвиге порога. [+] Выбираем порог, при котором дэ наименьшее. [+] Это стандартный алгоритм Клаузе, Шализи и Ньюмана. Наша реализация даёт ровно те же альфу, порог и дэ, что библиотека powerlaw версии 1.5. Версия 2.0 подбирает порог по-другому и даёт другие числа.
  show: {block: scene, src: 14-mle.js, scene: sweep}

- say: >-
    Посмотрим на код. [+] Сортируем собственные числа и перебираем пороги, оставляя в хвосте хотя бы три точки. [+] Хвост — все числа не меньше порога. [+] Альфа — по формуле Хилла. [+] Теоретическая функция распределения подогнанного закона. [+] Дэ — наибольшая разница между ней и эмпирической. [+] И запоминаем тройку с наименьшим дэ: кортежи в Python сравниваются по первому элементу, поэтому min выбирает наименьшее расстояние.
  show:
    block: code
    lang: python
    trace: [4, 5, 6, 7, 8, 9]
    src: |
      def fit_alpha(lam):
          lam = np.sort(lam)
          best = (np.inf, np.nan, np.nan)
          for lam_min in lam[:-2]:
              tail = lam[lam >= lam_min]
              alpha = 1 + len(tail) / np.sum(np.log(tail / lam_min))
              cdf = 1 - (tail / lam_min)**(1 - alpha)
              D = np.max(np.abs(np.arange(len(tail)) / len(tail) - cdf))
              best = min(best, (D, alpha, lam_min))
          return best

- say: >-
    Результат удобно смотреть на графике дополнительной функции распределения в логарифмических осях. [+] Для каждого лямбда по вертикали отложена доля собственных чисел, которые не меньше него. [+] Левее порога кривая плавно загибается вниз — это балк. [+] Правее порога точки идут почти по прямой. [+] А прямая в логарифмических осях и есть степенной закон. Её наклон равен минус альфа плюс один: доля чисел больше лямбда получается сложением плотности по всему хвосту, и степень при этом уменьшается на единицу.
  show: {block: scene, src: 14-mle.js, scene: ccdf, id: ccdf}

- say: >-
    Итог для слоя layer4.1.conv2. [+] Альфа равна 6,04. [+] Порог — 4,88 на десять в минус четвёртой, расстояние дэ равно 0,041. [+] В хвосте 40 чисел из 512. Хвост есть, но довольно крутой: альфа больше четырёх.
  show: {use: ccdf, scene: ccdf2}

- say: >-
    Так это выглядит в ноутбуке. [+] Синие точки — эмпирическая дополнительная функция распределения, пунктир — найденный порог. [+] Оранжевая прямая — степенной закон с альфой 6,04.
  show:
