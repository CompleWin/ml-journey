- say: Быстрая проверка.
  quiz:
    q: 'Порог $\lambda_{min} = 1$, в хвосте числа $1,\ e,\ e^2,\ e^3$. Чему равно $\alpha$ по формуле Хилла?'
    answer: 1.667
    tol: 0.02
    hint: 'Сумма логарифмов $0 + 1 + 2 + 3$, точек в хвосте 4.'
    explain: '$\alpha = 1 + 4/6 \approx 1{,}67$.'

- say: И ещё один вопрос.
  quiz:
    q: 'По какому признаку алгоритм Клаузе–Шализи–Ньюмана выбирает порог $\lambda_{min}$?'
    options:
    - {text: 'Максимальное число точек в хвосте', why: 'Число точек — следствие выбора порога, а не критерий.'}
    - 'Наименьшее расстояние Колмогорова–Смирнова $D$'
    - {text: 'Наименьшая погрешность $\alpha$', why: 'Погрешность считают уже после выбора порога.'}
    answer: 2
    explain: 'Для каждого порога подгоняют закон и берут тот порог, где эмпирическая и теоретическая функции распределения ближе всего.'
