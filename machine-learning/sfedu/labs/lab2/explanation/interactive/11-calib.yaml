- section: Калибровка
  say: >-
    Допустим, собственное число оторвалось от балка. Насколько силён сигнал? Выше порога лямбда один равно единице плюс тэта, умноженной на единицу плюс гамма на тэта. [+] Раскроем скобки: единица на единицу, единица на гамма на тэта, тэта на единицу и тэта на гамма на тэта, где тэта сокращается. Получается единица плюс гамма на тэта плюс тэта плюс гамма. [+] Наивная оценка силы сигнала — лямбда один минус единица, ведь истинная дисперсия вдоль сигнала равна единице плюс тэта. Но из формулы видно, что такая оценка завышена на гамма плюс гамма на тэта: шум подталкивает собственное число вверх. [+] Пример: при тэта, равном единице, и гамме одна вторая собственное число равно трём. Наивная оценка даёт два, а настоящая сила сигнала — единица.
  show:
    block: derivation
    lines:
    - '\hat\lambda_1 = (1+\theta)(1+\gamma/\theta)'
    - {tex: '= 1 + \gamma/\theta + \theta + \gamma', note: 'раскрыли скобки'}
    - {tex: '\hat\theta_{\text{naive}} = \hat\lambda_1 - 1 = \theta + \gamma + \gamma/\theta', note: 'завышение на $\gamma + \gamma/\theta$'}
    - {tex: '\theta = 1,\ \gamma = 0{,}5:\quad \hat\lambda_1 = 3,\quad \hat\theta_{\text{naive}} = 2', note: 'а на самом деле $\theta = 1$'}

- say: >-
    Нагляднее это видно, если разложить собственное число на части. [+] Первая единица — это дисперсия шума, она есть в любом направлении. [+] Следующий кусок, тэта, — настоящий сигнал. [+] А гамма плюс гамма на тэта — добавка от шума: она выталкивает собственное число вверх. При тэта, равном единице, это ещё целая единица. [+] Наивная оценка отрезает только нижнюю единицу и принимает добавку шума за сигнал. Поэтому здесь она вдвое завышает силу сигнала.
  show: {block: scene, src: 11-calib.js, scene: bias}

- say: >-
    Значит, формулу надо обратить: по наблюдаемому лямбда один найти тэта. Обозначим у — это единица плюс тэта. Тогда тэта равно у минус один, и формула превращается в дробь. [+] Умножаем обе части на у минус один и переносим всё в одну сторону. Получается квадратное уравнение относительно у. [+] Решаем его по обычной формуле корней квадратного уравнения. [+] Берём больший корень и вычитаем единицу. Это и есть калиброванная, несмещённая оценка тэта с крышкой.
  show:
    block: derivation
    lines:
    - {tex: 'u = 1 + \theta:\quad \hat\lambda_1 = u\left(1 + \dfrac{\gamma}{u-1}\right) = \dfrac{u\,(u - 1 + \gamma)}{u - 1}', note: 'подставили $\theta = u - 1$'}
    - {tex: 'u^2 - (\hat\lambda_1 + 1 - \gamma)\,u + \hat\lambda_1 = 0', note: 'умножили на $u - 1$ и перенесли'}
    - {tex: 'u = \dfrac{(\hat\lambda_1 + 1 - \gamma) \pm \sqrt{(\hat\lambda_1 + 1 - \gamma)^2 - 4\hat\lambda_1}}{2}', note: 'формула корней'}
    - {tex: '\hat\theta = u_{\max} - 1', note: 'больший корень'}

- say: >-
    Почему именно больший корень? [+] У формулы бэ-бэ-пэ есть симметрия: если заменить тэта на гамма, делённое на тэта, скобки просто поменяются местами, и значение не изменится. Значит, у уравнения два корня: настоящая тэта и гамма на тэта. [+] Выше порога тэта больше корня из гаммы, а гамма на тэта, наоборот, меньше. Второй корень лежит ниже порога, где формула не работает, поэтому берём больший. [+] Проверим на примере: лямбда один равно трём, гамма одна вторая. Корни у получаются два и полтора, то есть тэта равно единице или одной второй. Правильный ответ — единица.
  show:
  - {block: scene, src: 11-calib.js, scene: roots, id: roots, size: [800, 900]}
  - block: derivation
    lines:
    - {tex: '\theta \to \dfrac{\gamma}{\theta}:\quad (1+\theta)\Bigl(1+\dfrac{\gamma}{\theta}\Bigr) = \Bigl(1+\dfrac{\gamma}{\theta}\Bigr)(1+\theta)', note: 'корни $u_1 = 1+\theta$ и $u_2 = 1+\gamma/\theta$'}
    - {tex: '\theta > \sqrt{\gamma} \;\Rightarrow\; \gamma/\theta < \sqrt{\gamma}', note: 'второй корень ниже порога'}
    - {tex: '\hat\lambda_1 = 3,\ \gamma = 0{,}5:\quad u \in \{2;\ 1{,}5\} \;\Rightarrow\; \hat\theta = 1', note: 'а не 0,5'}

- say: >-
    Теперь код. Функция calibrate начинается с проверки, так называемой guard clause, то есть «охранного условия». [+] Если лямбда один не больше лямбда плюс, функция сразу возвращает вердикт: «Сигнал отсутствует или находится ниже предела детектирования». [+] Иначе она считает формулу и возвращает тэта с крышкой. Переменная бэ — это скобка «лямбда один плюс один минус гамма», а дальше больший корень минус единица.
  show:
    block: code
    lang: python
    trace: [[2, 3], [4, 5]]
    src: |
      def calibrate(lam):
          if lam <= lam_plus:
              return 'Сигнал отсутствует или находится ниже предела детектирования'
          b = lam + 1 - gamma
          return (b + np.sqrt(b**2 - 4 * lam)) / 2 - 1

- say: >-
    Посмотрим, как это работает на числах из ноутбука. [+] При тэта 0,1 собственное число получилось 2,902. [+] Это меньше края 2,914, и функция честно отвечает, что сигнала нет. [+] А при тэта 1,3 собственное число 3,202. [+] Оно выше края, и калибровка даёт 1,32 — очень близко к правде.
  show:
    block: diagram
    direction: lr
    nodes: ['in: собственное число λ̂₁', 'chk: λ̂₁ ≤ λ₊ ?', 'no: «сигнал не обнаружен»', 'yes: θ̂ по формуле']
    edges: ['in -> chk', 'chk -> no: да', 'chk -> yes: нет']
    flow: ['in -> chk: 2,902', 'chk -> no: 2,902 ≤ 2,914', 'in -> chk: 3,202', 'chk -> yes: θ̂ = 1,32']

- say: >-
    Зачем нужна проверка? Причин две, и первая — математическая. [+] Подставим лямбда один, равное лямбда плюс, то есть единица плюс корень из гаммы в квадрате. Скобка «лямбда один плюс один минус гамма» превращается в два, умноженное на единицу плюс корень из гаммы. [+] Её квадрат равен четырём лямбда плюс, и подкоренное выражение обращается в ноль. Внутри балка оно отрицательно, и корня просто не существует. [+] Вторая причина — статистическая: значение внутри балка шум даёт и без всякого сигнала. Так что считать там силу сигнала бессмысленно.
  show:
  - {use: roots, scene: roots2, size: [800, 900]}
  - block: derivation
    lines:
    - {tex: '\hat\lambda_1 = \lambda_+ = (1+\sqrt{\gamma})^2:\quad \hat\lambda_1 + 1 - \gamma = 2\,(1+\sqrt{\gamma})', note: '$1 + 2\sqrt\gamma + \gamma + 1 - \gamma = 2 + 2\sqrt\gamma$'}
    - {tex: '(\hat\lambda_1 + 1 - \gamma)^2 - 4\hat\lambda_1 = 4\lambda_+ - 4\lambda_+ = 0', note: 'на краю балка подкоренное выражение равно 0'}
    - {tex: '\hat\lambda_1 \le \lambda_+', note: 'такое значение шум даёт и без всякого сигнала'}

- say: >-
    Посмотрим, как работает калибровка на всех опытах. По горизонтали истинная сила сигнала, по вертикали оценка. [+] Сначала наивная оценка. Она ошибается везде. При тэта 0,1 она показывает 1,9, то есть уверенно «находит» сильный сигнал в чистом шуме. А при тэта 2,5 даёт 3,24 вместо 2,5. [+] Теперь калиброванная оценка. При тэта до 0,7 её точек нет вовсе: функция честно отвечает, что сигнал не обнаружен. Первая оценка появляется сразу за порогом, при тэта 0,8, и равна 0,82. [+] Прямая — истинное значение тэта. Калиброванные точки лежат на ней: при тэта единица получается 1,05, при двух — 1,98, при 2,5 — 2,54.
  show:
    block: plot
    data: bbp
    x: theta
    y: [naive, calib]
    fn: [{f: 'x', label: 'истинное $\theta$'}]
    xlabel: '$\theta$'
    ylabel: 'оценка силы сигнала'
    reveal: by-layer

- say: >-
    В ноутбуке этот график выглядит так. [+] Оранжевые точки — наивная оценка, они висят высоко над прямой. [+] Зелёные — калиброванная, они лежат на синей прямой истинного тэта, начиная сразу за пунктиром порога.
  show:
    block: figure
    src: figures/task2_calibration.png
    marks: [{at: [0.55, 0.15], text: 'наивная λ̂₁ − 1'}, {at: [0.62, 0.58], text: 'калиброванная θ̂'}]
    reveal: by-mark

- say: Быстрая проверка.
  quiz:
    q: 'Выше порога наблюдали $\hat\lambda_1 = 3$ при $\gamma = 0{,}5$. Какова калиброванная оценка $\hat\theta$?'
    answer: 1
    tol: 0.02
    hint: '$u^2 - (\hat\lambda_1 + 1 - \gamma)u + \hat\lambda_1 = 0$, то есть $u^2 - 3{,}5u + 3 = 0$'
    explain: 'Корни $u = 2$ и $u = 1{,}5$; берём больший: $\hat\theta = 2 - 1 = 1$. Наивная оценка дала бы 2.'

- say: И ещё один вопрос.
  quiz:
    q: 'Что вернёт `calibrate` при $\hat\lambda_1 = 2{,}85$ и $\gamma = 0{,}5$?'
    options:
    - {text: 'Оценку $\hat\theta \approx 1{,}85$', why: 'Это была бы наивная оценка. Но $2{,}85 < \lambda_+ \approx 2{,}914$, и функция до формулы не дойдёт.'}
    - 'Вердикт «сигнал отсутствует или находится ниже предела детектирования»'
    - {text: 'Ошибку из-за корня из отрицательного числа', why: 'До корня дело не дойдёт: охранное условие сработает раньше.'}
    answer: 2
    explain: '$2{,}85 \le \lambda_+$: значение внутри балка, такое шум даёт и сам. Guard clause сразу возвращает вердикт.'
