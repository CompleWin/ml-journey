- section: Задание 3. Диагностика слоёв ResNet-18 (теория Мартина–Махони)
  say: >-
    Третье задание переносит всё, что мы узнали, на нейросети. Возьмём слой нейросети. Его веса — это матрица вэ размером эм на ка. [+] Посчитаем её спектр так же, как спектр ковариации: собственные числа матрицы вэ на вэ транспонированное, делённой на эн, где эн — больший из двух размеров. [+] Если бы веса были случайными, как до обучения, спектр выглядел бы как балк Марченко–Пастура из первого задания. [+] Обучение, то есть стохастический градиентный спуск, вытягивает из балка хвост: появляются собственные числа далеко справа, за краем шума. [+] Этот хвост подчиняется степенному закону: плотность пропорциональна лямбде в степени минус альфа. По показателю альфа и судят о слое.
  show: {block: scene, src: 12-htsr.js, scene: train}

- say: >-
    Что значит степенной закон? [+] Возьмём альфу, равную трём. Если лямбда вырастет вдвое, плотность упадёт в два в кубе, то есть в восемь раз. [+] Чем меньше альфа, тем медленнее падает плотность и тем длиннее, «тяжелее» хвост: больших собственных чисел много. [+] Чем больше альфа, тем круче обрывается хвост. [+] Сравните с краем балка Марченко–Пастура: там плотность падает до нуля в конкретной точке лямбда плюс, и дальше собственных чисел нет вообще. А степенной хвост тянется далеко за неё.
  show: {block: scene, src: 12-htsr.js, scene: power}

- say: >-
    По показателю альфа судят о слое, причём без всяких тестовых данных, только по его весам. Вот правило из теории. [+] Если альфа больше четырёх или хвоста нет вовсе, слой слабо обучен или остался шумом. [+] Если альфа от двух до четырёх, это так называемая «зона Златовласки». Название из сказки, где героине нравилась каша не слишком горячая и не слишком холодная. Здесь хвост не слишком тяжёлый и не слишком лёгкий, и такой слой хорошо обобщает. [+] Если альфа не больше двух или спектр выродился, это коллапс ранга или переобучение.
  show:
    block: table
    cols: ['$\alpha$', режим]
    rows:
    - ['$\alpha > 4$ или хвоста нет', 'слабо обучен / шум']
    - ['$2 < \alpha \le 4$', '«зона Златовласки»: хорошая обобщающая способность']
    - ['$\alpha \le 2$ или спектр выродился', 'коллапс ранга / переобучение']
    reveal: by-row

- say: >-
    В конспекте путь от необученного слоя к выродившемуся разбит на пять фаз. [+] Первая — рэндом-лайк, то есть «похожая на случайную»: спектр — чистый балк Марченко–Пастура, все собственные числа внутри границ. [+] Вторая — блидинг аут, «просачивание»: несколько собственных чисел чуть выходят за лямбда плюс, но хвоста ещё нет. [+] Третья — балк плюс дикей, «балк и спад»: балк шума плюс заметный хвост справа. [+] Четвёртая — хэви тейлд, «тяжёлый хвост»: весь спектр подчиняется степенному закону с альфой от двух до четырёх. Это оптимум. [+] И пятая — коллапсд, «коллапс»: одно-два огромных собственных числа забирают почти весь след, а остальные около нуля.
  show: {block: scene, src: 12-htsr.js, scene: phases}

- say: >-
    Как получить спектр конкретного слоя? Свёрточный слой хранит веса как четырёхмерный массив: число выходных каналов, число входных каналов и размер ядра ка на ка. [+] Каждый выходной канал — это один фильтр: маленький кубик размером «входные каналы на ка на ка». [+] Разворачиваем каждый фильтр в одну длинную строку. [+] Строки складываем друг под другом и получаем обычную матрицу: строк столько, сколько фильтров, а столбцов — входные каналы, умноженные на ка в квадрате. [+] Для слоя layer4.1.conv2 это 512 фильтров по 512 входных каналов с ядром три на три, и получается матрица 512 на 4608.
  show: {block: scene, src: 12-htsr.js, scene: reshape}

- say: >-
    Теперь спектр. Можно было бы построить матрицу вэ транспонированное на вэ, но она размером 4608 на 4608. [+] А ранг у неё не больше 512. Это та же ловушка нулей, что в первом задании: 4096 её собственных чисел были бы машинными нулями. [+] Поэтому берём сингулярные числа самой матрицы весов. Собственные числа вэ на вэ транспонированное, делённой на эн, — это квадраты сингулярных чисел, делённые на эн. [+] Их ровно 512, то есть меньший из двух размеров. Лишних нулей нет, и считаются они за доли секунды.
  show:
    block: derivation
    lines:
    - 'W:\ 512 \times 4608'
    - {tex: 'W^TW/N:\ 4608 \times 4608,\quad \mathrm{rank} \le 512', note: '4096 машинных нулей'}
    - {tex: '\lambda_i\Bigl(\tfrac{1}{N}WW^T\Bigr) = \dfrac{s_i^2}{N}', note: '$s_i$ — сингулярные числа $W$, $N = \max(M, K)$'}
    - {tex: 'i = 1, \dots, \min(M, K) = 512', note: 'без лишних нулей'}

- say: >-
    В коде это функция esd, от английских слов «эмпирическая спектральная плотность». [+] Сначала reshape разворачивает тензор в матрицу: число строк сохраняется, а всё остальное вытягивается в строку. [+] Потом считаем только сингулярные числа, без векторов: параметр compute uv равен false. [+] И возвращаем их квадраты, делённые на больший размер матрицы.
  show:
    block: code
    lang: python
    trace: [2, 3, 4]
    src: |
      def esd(W):
          W = W.reshape(len(W), -1)
          s = np.linalg.svd(W, compute_uv=False)
          return s**2 / max(W.shape)

- say: Быстрая проверка.
  quiz:
    q: 'Веса свёрточного слоя имеют форму (64, 64, 3, 3). Сколько столбцов будет в развёрнутой матрице?'
    answer: 576
    tol: 0
    hint: 'Столбцов $C_{in} \cdot K \cdot K$.'
    explain: '$64 \cdot 3 \cdot 3 = 576$: матрица $64 \times 576$, и у неё 64 собственных числа.'

- say: И ещё один вопрос.
  quiz:
    q: 'У слоя оценили $\alpha = 3$. К какому режиму он относится?'
    options:
    - {text: 'Слабо обучен / шум', why: 'Этот режим — при $\alpha > 4$ или без хвоста.'}
    - '«Зона Златовласки»'
    - {text: 'Коллапс ранга', why: 'Этот режим — при $\alpha \le 2$ или выродившемся спектре.'}
    answer: 2
    explain: '$2 < 3 \le 4$: хвост не слишком тяжёлый и не слишком лёгкий.'
